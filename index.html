<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#eceffb; --bg-2:#f6f7fd; --bg-3:#e2e6f4;
  --text:#1d2030; --text-2:#5c6178; --text-3:#9297ac;
  --line:rgba(93,98,160,.10); --line-2:rgba(93,98,160,.16);
  --brand:#5a5fd8; --brand-2:#767bef; --brand-soft:#e5e6fb;
  --danger:#e0525f; --danger-soft:#fdeaec;
  --ok:#2fa46b;
  --shadow:0 2px 6px rgba(90,95,180,.06),0 14px 34px -14px rgba(90,95,180,.16);
  --shadow-lg:0 18px 60px -16px rgba(70,74,150,.30);
  --r:24px; --r-sm:14px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12141f; --bg-2:#1a1d2c; --bg-3:#232739;
    --text:#eceef8; --text-2:#a3a9c2; --text-3:#737a96;
    --line:rgba(160,168,220,.12); --line-2:rgba(160,168,220,.2);
    --brand:#7c81f2; --brand-2:#979bfa; --brand-soft:#252a4a;
    --danger:#ff6b78; --danger-soft:#33202a;
    --ok:#43c98a;
    --shadow:0 2px 8px rgba(0,0,0,.25),0 16px 40px -16px rgba(0,0,0,.5);
    --shadow-lg:0 22px 64px -16px rgba(0,0,0,.7);
  }
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ============ 主题选择器 ============ */
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 6px}
.skins .grp{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--text-3);letter-spacing:.06em;margin:10px 0 -2px}
.skins .grp:first-child{margin-top:0}
.swatch{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--bg-2);border:1.5px solid var(--line);
  border-radius:14px;padding:9px 3px 7px;position:relative;transition:transform .12s,border-color .15s}
.swatch:active{transform:scale(.95)}
.swatch.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.swatch .dot{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);position:relative;overflow:hidden}
.swatch .dot i{position:absolute;inset:0}
.swatch .dot i.a{clip-path:polygon(0 0,100% 0,0 100%)}
.swatch .dot i.b{clip-path:polygon(100% 0,100% 100%,0 100%)}
.swatch .nm{font-size:10.5px;font-weight:650;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatch .ck{position:absolute;top:3px;right:4px;color:var(--brand);font-weight:800;font-size:10.5px}
/* 自定义取色行 */
.cusrow{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:10px 12px;border-radius:14px;
  background:var(--bg-2);border:1.5px solid var(--line)}
.cusrow.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.cusrow .prev{width:34px;height:34px;border-radius:50%;flex:none;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.cusrow .prev i{position:absolute;inset:0}
.cusrow .prev i.a{clip-path:polygon(0 0,100% 0,0 100%)}
.cusrow .prev i.b{clip-path:polygon(100% 0,100% 100%,0 100%)}
.cusrow .tt{flex:1;min-width:0}
.cusrow .tt b{display:block;font-size:13px;font-weight:700}
.cusrow .tt span{display:block;font-size:10.5px;color:var(--text-3);font-family:ui-monospace,Menlo,monospace}
.cusrow .go{height:32px;padding:0 14px;border-radius:999px;background:var(--brand);color:#fff;font-size:12.5px;font-weight:700;flex:none}
.pickers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 4px}
.pickers label{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:650;color:var(--text-2)}
.pickers input[type=color]{width:100%;height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg-2);
  padding:3px;cursor:pointer;-webkit-appearance:none;appearance:none}
.pickers input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.pickers input[type=color]::-webkit-color-swatch{border:0;border-radius:9px}
.cusacts{display:flex;gap:8px;margin-top:10px}
.cusacts button{flex:1;height:42px;border-radius:12px;font-size:13px;font-weight:650;
  background:var(--bg-2);border:1px solid var(--line);color:var(--text-2)}
.cusacts button.pri{background:var(--brand);color:#fff;border-color:transparent}

html{background:var(--bg,#eceffb)}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  font-feature-settings:"tnum" 0;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brand);text-decoration:none}
::selection{background:color-mix(in srgb,var(--brand) 28%,transparent)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ============ 顶部栏 ============ */
.topbar{
  position:sticky; top:0; z-index:30;
  padding:calc(var(--safe-t) + 16px) calc(20px + var(--safe-r)) 14px calc(20px + var(--safe-l));
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px); backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid transparent; transition:border-color .2s;
}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{
  width:40px;height:40px;border-radius:14px;flex:none;
  background:var(--brand);
  display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--brand) 55%,transparent);
  transition:background .2s;
}
/* 灰青主题下 logo 用奶黄（该主题强调色为亮黄，logo 单独调柔和） */
html[data-theme="mutedteal"] .logo{
  background:#f2dd9d;
  box-shadow:0 8px 20px -6px color-mix(in srgb,#f2dd9d 55%,transparent);
}
.logo svg{width:21px;height:21px}
.brand h1{font-size:21px;font-weight:750;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:11px;color:var(--text-3);margin-top:0;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.iconbtn{
  width:44px;height:44px;border-radius:16px;display:grid;place-items:center;flex:none;
  color:var(--text-2);background:var(--bg-2);border:1px solid var(--line);
  box-shadow:var(--shadow);
  transition:transform .12s,background .15s,color .15s;
}
.iconbtn:hover{color:var(--text);background:var(--bg-3)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:19px;height:19px}
.btn-primary{
  height:46px;padding:0 20px;border-radius:999px;flex:none;
  background:linear-gradient(160deg,var(--brand),var(--brand-2));color:#fff;font-weight:650;font-size:14.5px;
  display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 10px 24px -8px color-mix(in srgb,var(--brand) 75%,transparent);
  transition:transform .12s,filter .15s;
}
.btn-primary:hover{filter:brightness(1.07)}
.btn-primary:active{transform:scale(.96)}
.btn-primary svg{width:17px;height:17px}
.btn-primary .lbl-txt{display:inline}

/* ============ 主体 ============ */
.wrap{max-width:1040px;margin:0 auto;padding:0 calc(16px + var(--safe-r)) calc(40px + var(--safe-b)) calc(16px + var(--safe-l))}
.toolbar{display:flex;gap:10px;align-items:center;padding:16px 0 10px}
.search{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;
  height:48px;padding:0 16px;border-radius:999px;background:var(--bg-2);
  border:1px solid var(--line);box-shadow:var(--shadow);
  transition:border-color .15s,box-shadow .15s;
}
.search:focus-within{border-color:color-mix(in srgb,var(--brand) 45%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 12%,transparent)}
.search svg{width:17px;height:17px;color:var(--text-3);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.search input::placeholder{color:var(--text-3)}
@media (max-width:700px){
  .toolbar{flex-wrap:wrap;row-gap:10px}
  .search{flex:1 1 100%;width:100%}
  .seg{order:2}
  #btnView,#btnList{order:3}
}
.seg{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex:none;box-shadow:var(--shadow)}
.seg button{padding:9px 14px;border-radius:999px;font-size:13.5px;color:var(--text-2);font-weight:560;white-space:nowrap;transition:.15s}
.seg button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);font-weight:680}

.statline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 12px;color:var(--text-3);font-size:12.5px}
.statline b{color:var(--text-2);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:12px;transform:translateZ(0)}
.card{
  position:relative;display:flex;flex-direction:column;gap:0;
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;text-align:left;box-shadow:var(--shadow);
  transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s;
}
@keyframes cardIn{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card:active{transform:scale(.98)}
.card .meta{padding:16px;display:flex;flex-direction:column;gap:4px;background:var(--bg-2)}
.card .name{font-size:15.5px;font-weight:680;line-height:1.35;letter-spacing:-.01em;padding-right:26px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .desc{font-size:12px;color:var(--text-3);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .tagrow{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.chip{font-size:10.5px;line-height:1;padding:5px 8px;border-radius:999px;background:var(--bg-3);color:var(--text-2);font-weight:600;letter-spacing:.02em}
.chip.embed{background:var(--brand-soft);color:var(--brand)}
html.dark .chip.embed{color:var(--brand-2)}
.chip.ref{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--text-2)}
.chip.warn{background:var(--danger-soft);color:var(--danger)}
.card .more{
  position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:999px;
  display:grid;place-items:center;color:var(--text-3);
  background:transparent;
  opacity:0;transition:opacity .15s,background .15s;
}
.card:hover .more,.card:focus-within .more{opacity:1}
.card .more:hover{background:var(--bg-2);color:var(--text)}
.card .more svg{width:15px;height:15px}
@media (hover:none){.card .more{opacity:1}}

/* 紧凑视图：小药丸按钮 */
.pillview{display:flex;flex-wrap:wrap;gap:9px;transform:translateZ(0)}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  max-width:100%;padding:11px 16px;border-radius:999px;
  background:var(--bg-2);border:1px solid var(--line);box-shadow:var(--shadow);
  color:var(--text);font-size:13.5px;font-weight:600;letter-spacing:-.01em;
  transition:transform .12s,box-shadow .16s;
  text-align:left;
}
.pill:hover{box-shadow:var(--shadow-lg)}
.pill:active{transform:scale(.96)}
.pill .sz{font-size:11px;color:var(--text-3);font-weight:550;font-variant-numeric:tabular-nums}
.pill .more{position:static;width:22px;height:22px;border-radius:999px;display:grid;place-items:center;
  color:var(--text-3);background:transparent;opacity:1;flex:none}
.pill .more svg{width:13px;height:13px}
.pill.ref{border-style:dashed}

/* 文件夹行 */
.folder-wrap{display:flex;gap:8px;align-items:flex-start;padding:2px 0 10px}
.folder-wrap .editf{flex:none;align-self:center}
.folder-row{display:flex;gap:8px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.folder-row::-webkit-scrollbar{display:none}
.fchip{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--bg-2);border:1px solid var(--line);color:var(--text-2);box-shadow:var(--shadow);
  transition:.15s;white-space:nowrap;
}
.fchip.on{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.fchip .fx{width:16px;height:16px;border-radius:999px;display:grid;place-items:center;color:inherit;opacity:.6}
.fchip .fx:hover{opacity:1}
.fchip .cnt{min-width:17px;height:17px;padding:0 5px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.fchip .cnt.zero{background:var(--bg-3);color:var(--text-3)}
.ordbtns{position:absolute;top:7px;left:7px;display:flex;flex-direction:row;gap:4px;z-index:3}
.pill{position:relative}
.pill .ordbtns{top:50%;transform:translateY(-50%);left:6px;gap:4px}

.ordb{width:20px;height:20px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text-2);box-shadow:var(--shadow)}
/* 整理模式：图标按钮 + 拖动 */
.fchip.editf{padding:8px 11px}
.fchip.organizing{padding-left:10px;padding-right:10px;gap:5px;touch-action:pan-x}
body.organizing .card,body.organizing .pill,body.organizing .fchip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;opacity:.92;transform:scale(1.03);box-shadow:0 14px 34px -8px rgba(0,0,0,.3)}
.dragging{opacity:.35}
.fchip.newf{color:var(--brand)}
.fchip svg{width:13px;height:13px}

/* 多选 */
body.selecting{padding-bottom:calc(88px + var(--safe-b))}
.selbar{
  position:fixed;z-index:75;left:12px;right:12px;bottom:calc(14px + var(--safe-b));
  display:none;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--bg-2) 92%,transparent);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-lg);
  padding:10px 12px 10px 18px;
}
.selbar.on{display:flex}
.selbar .cnt{flex:1;font-size:14px;font-weight:650}
.selbar .cnt b{color:var(--brand)}
.selbar .btn-ghost{height:40px;padding:0 15px;box-shadow:none}
.selbar .btn-primary{height:40px;padding:0 16px}
.ckmark{
  position:absolute;top:12px;left:12px;width:24px;height:24px;border-radius:999px;
  border:2px solid var(--line-2);background:var(--bg-2);z-index:5;
  display:none;place-items:center;transition:.15s;
}
.ckmark svg{width:13px;height:13px;opacity:0;color:#fff}
body.selecting .ckmark{display:grid}
body.selecting .card .more{display:none}
body.selecting .card .meta{padding-left:50px}
body.selecting .card .name{padding-right:8px}
.card.selected{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.card.selected .ckmark{background:var(--brand);border-color:var(--brand)}
.card.selected .ckmark svg{opacity:1}
body.selecting .pill{padding-left:40px;position:relative}
body.selecting .pill .ckmark{display:grid;top:50%;transform:translateY(-50%)}
body.selecting .pill.selected{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
body.selecting .pill.selected .ckmark{background:var(--brand);border-color:var(--brand)}
body.selecting .pill.selected .ckmark svg{opacity:1}
body.selecting .pill .more{display:none}

/* 拖拽区 */
.dropzone{
  border:1.5px dashed color-mix(in srgb,var(--brand) 35%,transparent);border-radius:var(--r);
  padding:28px 18px;text-align:center;color:var(--text-3);

}

.empty{

}

.empty h2{margin:0 0 6px;font-size:18px;color:var(--text);font-weight:700;letter-spacing:-.02em}

.btn-ghost{
  height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line);

  box-shadow:var(--shadow);
  display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s,transform .12s;
}
.btn-ghost:hover{background:var(--bg-3);color:var(--text)}
.btn-ghost:active{transform:scale(.97)}
.btn-ghost svg{width:16px;height:16px}

/* ============ 查看器 ============ */
.viewer{position:fixed;inset:0;z-index:60;background:var(--bg-2);display:none;flex-direction:column}
.viewer.on{display:flex;animation:viewIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.viewer iframe{flex:1;width:100%;border:0;background:#fff;display:block}

.vbar{

}

.vback{

  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);

}

.vname{

  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);color:var(--text-2);box-shadow:var(--shadow)}
.vmore svg{width:17px;height:17px}
.viewer .frame-wrap{flex:1;position:relative;padding-top:0;display:flex;overflow:hidden}

/* ============ 弹层 ============ */

.sheet{

}

.menu{position:fixed;z-index:90;min-width:190px;background:var(--bg-2);border:1px solid var(--line);

/* ============ Toast ============ */
.toasts{position:fixed;z-index:100;left:50%;transform:translateX(-50%);

@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .18s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.97)}}

function showErrBar(msg){
  try{
    // 同类错误 30 秒内只弹一次，避免刷屏
    var now=Date.now();
    if(showErrBar._last&&showErrBar._last.msg===msg&&now-showErrBar._last.t<30000)return;
    showErrBar._last={msg:msg,t:now};
    var bar=document.getElementById("errbar");
    if(!bar){
      bar=document.createElement("div");
      bar.id="errbar";
      bar.style.cssText="position:fixed;left:8px;right:8px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:99999;background:#b3261e;color:#fff;font:12px/1.5 -apple-system,sans-serif;padding:10px 14px;border-radius:12px;max-height:38vh;overflow:auto;white-space:pre-wrap;word-break:break-all;box-shadow:0 6px 24px rgba(0,0,0,.3)";
      var closeB=document.createElement("span");
      closeB.textContent="✕ 忽略";
      closeB.style.cssText="float:right;margin-left:10px;padding:0 6px;cursor:pointer;opacity:.85;font-weight:700";
      closeB.onclick=function(){ bar.remove(); showErrBar._muted=showErrBar._muted||{}; showErrBar._muted[msg.split(" @")[0]]=1; };
      bar.appendChild(closeB);
      var txt=document.createElement("span");
      txt.id="errbar-txt";
      bar.appendChild(txt);
      (document.body||document.documentElement).appendChild(bar);
    }
    if(bar._closed)return;
    // 用户点过「忽略」的错误类型不再打扰
    var key=(msg||"").split(" @")[0];
    showErrBar._muted=showErrBar._muted||{};
    if(showErrBar._muted[key])return;
    var t=document.getElementById("errbar-txt");
    if(t)t.textContent=APP_VER+" 错误："+msg;
  }catch(e){}
}

  if((m==="Script error."||m==="Script error")&&!e.filename&&!e.lineno)return;
  if(m.indexOf("Script error")===0)return;
  showErrBar(m+" @"+(e.filename?"行"+e.lineno:""));

/* ---------------------- 存储 ---------------------- */
function stripItem(it){
  // 内容(html)不进 localStorage（体积大），只保留元数据；内容存 IndexedDB
  var o=Object.assign({},it);delete o.html;delete o._url;return o;
}
/* ---- IndexedDB 内容仓：容量远大于 localStorage ---- */
var CDB_NAME="htmlbox-db",CDB_STORE="html";
function cdb(){
  return new Promise(function(res,rej){
    try{
      var r=indexedDB.open(CDB_NAME,1);
      r.onupgradeneeded=function(){ try{r.result.createObjectStore(CDB_STORE)}catch(e){} };
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error)};
    }catch(e){rej(e)}
  });
}
function cdbPutAll(map){
  if(!Object.keys(map).length)return Promise.resolve(true);
  return cdb().then(function(db){ return new Promise(function(res,rej){
    try{
      var tx=db.transaction(CDB_STORE,"readwrite"),st=tx.objectStore(CDB_STORE);
      Object.keys(map).forEach(function(k){ st.put(map[k],k) });
      tx.oncomplete=function(){res(true)}; tx.onerror=function(){rej(tx.error)};
    }catch(e){rej(e)}
  })});
}
function cdbAll(){ return cdb().then(function(db){ return new Promise(function(res){
  try{
    var tx=db.transaction(CDB_STORE,"readonly"),st=tx.objectStore(CDB_STORE),out={};
    var q=st.openCursor();
    q.onsuccess=function(){ var c=q.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); };
    q.onerror=function(){res({})};
  }catch(e){res({})}
})}).catch(function(){return {}}); }
function cdbDel(ids){
  if(!ids||!ids.length)return Promise.resolve(false);
  return cdb().then(function(db){ return new Promise(function(res){
    try{
      var tx=db.transaction(CDB_STORE,"readwrite"),st=tx.objectStore(CDB_STORE);
      ids.forEach(function(k){ try{st.delete(k)}catch(e){} });
      tx.oncomplete=function(){res(true)}; tx.onerror=function(){res(false)};
    }catch(e){res(false)}
  })}).catch(function(){return false});
}
function save(){
  // localStorage 只存元数据（很小，基本不会超配额）；内容异步写入 IndexedDB
  var okLS=false;
  try{
    var data={v:2,items:DB.items.map(stripItem),settings:DB.settings};
    localStorage.setItem(LS_KEY,JSON.stringify(data));
    okLS=true;
  }catch(e){ console.warn("save meta failed",e); }
  var map={};
  DB.items.forEach(function(it){ if(it.type==="embed"&&it.html)map[it.id]=it.html });
  cdbPutAll(map).then(function(){
    // 清理已删除工具的内容
    var keep={};DB.items.forEach(function(it){keep[it.id]=1});
    return cdbAll().then(function(all){
      var dead=Object.keys(all).filter(function(k){return !keep[k]});
      return cdbDel(dead);
    });
  }).catch(function(){
    if(okLS)toast("内容缓存失败，请导出单文件保存",2600);
    else toast("存储空间不足，保存失败——请导出单文件保存",3200);
  });
}
function hydrate(){
  // 启动时把 IndexedDB 里存的内容填回各工具
  return cdbAll().then(function(all){
    var changed=false;
    DB.items.forEach(function(it){
      if(!it.html&&all[it.id]){ it.html=all[it.id]; changed=true; }
    });
    if(changed){ render(); forceRepaint(); }
    return changed;
  }).catch(function(){});
}
function load(){
  var seeded=null;
  try{ seeded=JSON.parse($("#seed-data").textContent||"null") }catch(e){}
  var stored=null;
  try{ stored=JSON.parse(localStorage.getItem(LS_KEY)||"null") }catch(e){}
  var fromSeed=[];
  if(seeded&&seeded.items&&seeded.items.length){ fromSeed=seeded.items.map(normalize) }
  var fromStore=[];
  if(stored&&Array.isArray(stored.items)){ fromStore=stored.items.map(normalize) }
  if(seeded&&seeded.settings){ DB.settings=Object.assign(DB.settings,seeded.settings) }
  if(stored&&stored.settings){ DB.settings=Object.assign(DB.settings,stored.settings) }

  // 合并：store 的条目优先（用户在现场编辑/删除过），seed 里被删掉的要记住
  var removed=DB.settings.removedSeed||[];
  var map={};
  fromStore.forEach(function(it){map[it.id]=it});
  var list=[];
  fromSeed.forEach(function(it){
    // seed 内嵌内容体积大，不进 localStorage；若 store 有同名记录则合并元数据
    if(map[it.id]){
      var m=Object.assign({},it,map[it.id]);
      if(it.html){m.html=it.html}       // 内容以 seed 为准（最新构建）
      m._url=null;
      list.push(m);
    }else if(removed.indexOf(it.id)<0){
      list.push(it);
    }
  });
  fromStore.forEach(function(it){ if(!list.some(function(x){return x.id===it.id})){ it._url=null; list.push(it) } });
  DB.items=list;
}
function normalize(it){
  it=Object.assign({
    id:uid(), name:"未命名", desc:"", tags:[], type:"embed",
    html:"", path:"", builtin:false, addedAt:Date.now(), color:""
  },it);
  // 兼容历史/异常数据：类型不对时强制修正，避免渲染崩溃
  if(typeof it.name!=="string")it.name=String(it.name==null?"":it.name);
  if(typeof it.desc!=="string")it.desc=String(it.desc==null?"":it.desc);
  if(typeof it.path!=="string")it.path=String(it.path||"");
  if(typeof it.html!=="string")it.html=String(it.html||"");
  if(!Array.isArray(it.tags)){
    it.tags=typeof it.tags==="string"?it.tags.split(/[,，]/):[];
  }
  it.tags=it.tags.filter(function(t){return typeof t==="string"});
  it.size=Number(it.size)||0;
  if(it.folder!=null&&typeof it.folder!=="string")it.folder=String(it.folder);
  return it;
}

/* 取色工具：hex 混合 / 明暗判断 */
function _hx(c){c=String(c||"").replace("#","");if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];return [parseInt(c.slice(0,2),16)||0,parseInt(c.slice(2,4),16)||0,parseInt(c.slice(4,6),16)||0]}
function _rh(a){return "#"+a.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return v.toString(16).padStart(2,"0")}).join("")}
function mixHex(a,b,t){var x=_hx(a),y=_hx(b);return _rh([x[0]+(y[0]-x[0])*t,x[1]+(y[1]-x[1])*t,x[2]+(y[2]-x[2])*t])}
function isDark(hex){var c=_hx(hex);return (c[0]*299+c[1]*587+c[2]*114)/1000<130}
function isHex(v){return /^#[0-9a-fA-F]{6}$/.test(String(v||""))}
/* 注意：DB.settings.theme 存的是主题 key；custom 主题的下标是 custom-0/1/2 */
function applyTheme(){
  var t=DB.settings.theme||"auto";
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  // 先清掉上一次自定义主题留下的行内变量，避免串色
  ["--bg","--bg-2","--bg-3","--text","--text-2","--text-3","--brand","--brand-2","--brand-soft"].forEach(function(k){
    document.documentElement.style.removeProperty(k);
  });
  var dark;
  var ci=customIndex(t);
  if(ci>=0){
    var ct=customList()[ci];
    var cfg=skinVars(ct.bg,ct.brand);
    Object.keys(cfg).forEach(function(k){document.documentElement.style.setProperty(k,cfg[k])});
    dark=cfg.__dark;
    document.documentElement.setAttribute("data-theme",ct.dark?"custom-dark":"custom-light");
  }else{
    dark=DARK_SKINS.indexOf(t)>=0||(t==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);
    document.documentElement.removeAttribute("data-custom");
  }
  document.body.classList.toggle("dark",dark);
  var cs=getComputedStyle(document.documentElement);
  var bg=cs.getPropertyValue("--bg").trim()||(dark?"#12141f":"#eceffb");
  document.documentElement.style.setProperty("--theme-color",bg);
  // 状态栏 / 浏览器标签色：统一取当前主题底色，不再硬编码深色主题的突兀色值
  var mt=document.querySelectorAll('meta[name="theme-color"]');
  for(var i=0;i<mt.length;i++)mt[i].setAttribute("content",bg);
}
/* 由「底色 + 强调色」推导整套变量 */
function skinVars(bg,brand){
  if(!isHex(bg))bg="#eceffb";
  if(!isHex(brand))brand=isDark(bg)?"#8fa6f5":"#5a5fd8";
  var dark=isDark(bg);
  bg=bg.toLowerCase();brand=brand.toLowerCase();
  var to=dark?"#ffffff":"#000000";
  var brandMix=function(t){return mixHex(brand,to,t)};
  var o={
    "--bg":bg,
    "--bg-2":mixHex(bg,dark?"#ffffff":"#ffffff",dark?0.07:0.72),
    "--bg-3":mixHex(bg,dark?"#ffffff":"#000000",dark?0.13:0.07),
    "--brand":brand,
    "--brand-2":brandMix(dark?0.18:0.16),
    "--brand-soft":mixHex(bg,brand,dark?0.28:0.16),
    "--text":mixHex(dark?"#ffffff":"#101322",bg,dark?0.05:0.06),
    "--text-2":mixHex(bg,dark?"#ffffff":"#101322",dark?0.62:0.62),
    "--text-3":mixHex(bg,dark?"#ffffff":"#101322",dark?0.44:0.44),
    "--line":dark?"rgba(210,218,255,.14)":"rgba(60,70,110,.11)",
    "--line-2":dark?"rgba(210,218,255,.22)":"rgba(60,70,110,.18)"
  };
  o.__dark=dark;
  return o;
}

function customList(){

function customIndex(t){
  var m=/^custom-(\d+)$/.exec(String(t||""));
  if(!m)return -1;
  var i=+m[1];return i<customList().length?i:-1;
}
function skinHTML(){
  var cur=DB.settings.theme||"auto";
  // 夜航蓝虽是深色，但排在紫蓝系里更顺手；这里仍归到深色组，靠 key 过滤
  // 按色系排序：中性米白 → 暖色（粉/红/黄）→ 绿 → 青 → 蓝 → 紫 → 深色
  var GROUPS=[
    {t:"浅色",   keys:["sand","tea","cocoa","sakuragray","cream","blush","guava","matchberr","hongxian","junlan","amber","creamblue","butter","qingmei","pond","honeydew","celadon","manbo","choco","wine","mutedteal","blilac","lilac","indigo","twilight","bluepink","grape","zhusha","fluortea","heqing"]},
    {t:"深色",   keys:DARK_SKINS}
  ];
  var byKey={};SKINS.forEach(function(x){byKey[x.v]=x});
  var used={};
  var groups=[{t:"",list:SKINS.slice(0,1)}];
  GROUPS.forEach(function(g){
    var list=g.keys.map(function(k){return byKey[k]}).filter(Boolean);
    list.forEach(function(x){used[x.v]=1});
    if(list.length)groups.push({t:g.t,list:list});
  });
  var rest=SKINS.slice(1).filter(function(x){return !used[x.v]});
  if(rest.length)groups.push({t:"其他",list:rest});
  var html='<div class="skins">';
  groups.forEach(function(g){
    if(g.t&&g.list.length)html+='<div class="grp">'+g.t+"</div>";
    g.list.forEach(function(s){
      var on=(cur===s.v);
      html+='<button class="swatch'+(on?" on":"")+'" data-act="skin" data-v="'+s.v+'" title="'+s.name+'">'+
        '<span class="dot"><i class="a" style="background:'+s.c1+'"></i><i class="b" style="background:'+s.c2+'"></i></span>'+
        '<span class="nm">'+s.name+'</span>'+(on?'<span class="ck">✓</span>':"")+'</button>';
    });
  });
  html+="</div>";
  // 自定义主题
  var cl=customList();

  if(cl.length){
    cl.forEach(function(c,i){

}

  ["#fdf3f3","#d98f88"],["#1a2036","#8fa6f5"],["#2b2b2b","#c9d6a0"]
];
function showCustomSkin(i){
  var cl=customList();
  var base=(i!=null&&cl[i])?cl[i]:{bg:"#eceffb",brand:"#5a5fd8"};
  cusDraft={idx:(i!=null&&cl[i])?i:null,bg:base.bg,brand:base.brand};
  renderCusSheet();
}
function renderCusSheet(){
  var d=cusDraft,cl=customList();
  var body='<div class="doc"><p class="hint" style="margin-top:0">选一个底色，再选一个强调色。文字、卡片、边框的深浅会自动跟着算，不用自己配。</p>'+
    '<div class="pickers">'+
      '<label>底色<input type="color" id="cusBg" value="'+d.bg+'"></label>'+
      '<label>强调色<input type="color" id="cusBrand" value="'+d.brand+'"></label>'+
      '<label>快速套用<select class="input" id="cusPreset" style="height:44px"><option value="">选择…</option>'+
        PRESET_PAIRS.map(function(p,i){return '<option value="'+i+'">'+p[0].toUpperCase()+" / "+p[1].toUpperCase()+"</option>"}).join("")+
      '</select></label>'+
    '</div>'+
    '<h2>预览</h2>'+
    '<div style="border-radius:16px;padding:14px;border:1px solid #ddd" id="cusPrev"></div>'+
    '<p class="hint">最多保存 '+CUSTOM_MAX+' 个配色，可随时回来编辑或删除。</p>'+
    '</div>';
  openSheet(d.idx==null?"新建自定义配色":"编辑自定义配色",body,
    '<button class="btn-ghost" data-act="skin">返回主题</button>'+
    (d.idx!=null?'<button class="btn-ghost" data-act="custom-del" style="max-width:96px">删除</button>':"")+
    '<button class="btn-primary" style="width:auto;padding:0 16px" data-act="custom-save">保存</button>');
  var bg=$("#cusBg"),br=$("#cusBrand"),pr=$("#cusPreset");
  function drawPrev(){
    var v=skinVars(bg.value,br.value);
    var p=$("#cusPrev");
    if(!p)return;
    p.style.background=v["--bg"];
    p.style.borderColor=v["--line-2"];
    p.innerHTML='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'+
      '<span style="width:34px;height:34px;border-radius:12px;background:'+v["--brand"]+'"></span>'+
      '<b style="color:'+v["--text"]+';font-size:15px">收纳盒</b>'+
      '<span style="margin-left:auto;background:'+v["--brand"]+';color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px">添加</span></div>'+
      '<div style="background:'+v["--bg-2"]+';border:1px solid '+v["--line"]+';border-radius:12px;padding:11px 12px">'+
      '<div style="color:'+v["--text"]+';font-size:13.5px;font-weight:650">计算器</div>'+
      '<div style="color:'+v["--text-3"]+';font-size:11.5px;margin-top:2px">支持键盘的四则运算 · 已打包</div></div>';
  }
  bg.addEventListener("input",function(){cusDraft.bg=this.value;drawPrev()});
  br.addEventListener("input",function(){cusDraft.brand=this.value;drawPrev()});
  pr.addEventListener("change",function(){
    if(this.value==="")return;
    var p=PRESET_PAIRS[+this.value];bg.value=p[0];br.value=p[1];
    cusDraft.bg=p[0];cusDraft.brand=p[1];drawPrev();
  });
  drawPrev();
}
function saveCustomSkin(){
  var d=cusDraft;if(!d)return;
  var cl=customList();
  var rec={bg:d.bg,brand:d.brand,dark:isDark(d.bg)};
  if(d.idx!=null)cl[d.idx]=rec;
  else{
    if(cl.length>=CUSTOM_MAX){toast("最多保存 "+CUSTOM_MAX+" 个配色，先编辑或删除一个",2400);return}
    cl.push(rec);
  }
  DB.settings.theme="custom-"+(d.idx!=null?d.idx:cl.length-1);
  customList(cl);save();applyTheme();forceRepaint();
  cusDraft=null;showSkinSheet();
  toast("已应用自定义配色",1600);
}
function delCustomSkin(){
  var d=cusDraft;if(!d||d.idx==null)return;
  var cl=customList();cl.splice(d.idx,1);
  var cur=customIndex(DB.settings.theme);
  if(cur>=cl.length||cur===d.idx)DB.settings.theme="light";
  save();applyTheme();forceRepaint();
  cusDraft=null;showSkinSheet();
}

function visibleItems(){
  var q=state.q.trim().toLowerCase();
  return DB.items.filter(function(it){
    if(state.folder==="__none__"){ if(it.folder)return false }
    else if(state.folder&&(it.folder||"")!==state.folder)return false;
    if(state.filter==="embed"&&it.type!=="embed")return false;
    if(state.filter==="ref"&&it.type!=="ref")return false;
    if(!q)return true;
    var hay=(it.name+" "+(it.tags||[]).join(" ")+" "+(it.path||"")).toLowerCase();
    return hay.indexOf(q)>=0;
  }).sort(function(a,b){
    if(!!b.pinned!==!!a.pinned)return b.pinned?1:-1;
    // 顺序固定：按手动排序值（没有则用导入时间），打开不会改变位置
    var oa=a.ord!=null?a.ord:(a.addedAt||0), ob=b.ord!=null?b.ord:(b.addedAt||0);
    return oa-ob;
  });
}

  if(it.type==="embed"&&!it.html)chips+='<span class="chip warn">缺内容 · 请重新导入</span>';

  var ck='<span class="ckmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span>';
  var ordBtns=state.folderEdit

    :"";
  return '<article class="card'+(selSet[it.id]?" selected":"")+'" data-id="'+it.id+'">'+ck+ordBtns+
    '<button class="more" data-act="menu" aria-label="更多操作" data-id="'+it.id+'">'+
      '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>'+
    '</button>'+
    '<div class="meta"><div class="name">'+esc(it.name)+'</div>'+
      (it.desc?'<div class="desc">'+esc(it.desc)+'</div>':"")+

function pillHTML(it){

    ?'<span class="ordbtns"><span class="ordb" data-ord-l="'+it.id+'" title="前移"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg></span><span class="ordb" data-ord-r="'+it.id+'" title="后移"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg></span></span>'

function renderBody(){

  $("#modeTag").textContent = (inFile ? "本地文件模式" : "网页模式") + " · " + APP_VER;

    box.innerHTML='<div class="empty">'+

      '<h2>收纳盒是空的</h2>'+
      '<p>把你平时用的那些 HTML 小工具拖进来，它们会被打包进这一个文件，以后只打开这一页就够了。</p>'+
      '<div class="acts"><button class="btn-primary" style="width:auto;padding:0 16px;height:46px" data-act="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>&nbsp;添加工具</button>'+
      '<button class="btn-ghost" data-act="help">使用说明</button></div></div>';

  }

    box.innerHTML='<div class="empty"><h2>没有匹配的结果</h2><p>换个关键词，或切回「全部」。</p></div>';
    return;
  }
  var html=items.map(function(it){
    try{ return viewMode()==="compact"?pillHTML(it):cardHTML(it) }
    catch(e){ // 单个条目渲染出错时降级为极简按钮，不影响其他条目
      try{ console.warn("render item failed",e) }catch(_e){}
      return '<button class="pill" data-id="'+esc(it&&it.id)+'"><span class="nm">'+esc(it&&it.name||"（条目数据异常）")+'</span></button>';

  });

function render(){
  applyTheme();
  renderBody();

}

/* ---------------------- 打开 / 关闭 ---------------------- */
var currentId=null, currentUrl=null;
// 优先用 srcdoc 直接注入内容——不依赖 blob: 地址，App 内置浏览器/iOS 预览也能显示
function loadFrame(it){
  var f=$("#frame");
  f.setAttribute("sandbox","allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-downloads allow-pointer-lock allow-orientation-lock allow-presentation allow-top-navigation-by-user-activation");
  if(it.type==="embed"&&it.html){
    f.removeAttribute("src");
    try{ f.srcdoc=it.html }catch(e){ f.srcdoc=it.html }
    return true;
  }
  if(it.type==="ref"&&it.path){
    // 关键：必须先移除 srcdoc，否则 srcdoc(空文档) 优先于 src，页面会一直白屏
    f.removeAttribute("srcdoc");
    f.src=it.path;
    return true;
  }
  return false;
}
function isWebLink(it){return it.type==="ref"&&/^https?:\/\//i.test(it.path||"")}
function openItem(id){
  var it=DB.items.find(function(x){return x.id===id});
  if(!it){toast("找不到这个工具");return}
  // 网页链接：在查看器里内嵌打开（保留返回按钮）；被目标站拒绝内嵌时用户可点「新窗口打开」兜底
  if(isWebLink(it)){
    // 禁内嵌网站记忆：用户点过 ↗ 的域名，以后直接新窗口打开（不再内嵌白屏）
    function skipHost(u){ try{ return (JSON.parse(localStorage.getItem("hb.embedSkip")||"{}"))[u.replace(/^https?:\/\/([^\/]+).*/i,"$1")] }catch(e){ return false } }
    function markSkip(u){ try{
      var m=JSON.parse(localStorage.getItem("hb.embedSkip")||"{}");
      m[u.replace(/^https?:\/\/([^\/]+).*/i,"$1")]=1;
      localStorage.setItem("hb.embedSkip",JSON.stringify(m));
    }catch(e){} }
    var host=it.path.replace(/^https?:\/\/([^\/]+).*/i,"$1");
    if(skipHost(it.path)){
      it.lastOpen=Date.now();save();
      try{window.open(it.path,"_blank","noopener")}catch(e){}
      toast("该网站禁止内嵌，已在新窗口打开（以后自动跳转）",2400);
      return;
    }
    $("#btnVOpen").style.display="grid";
    $("#btnVOpen").onclick=function(){
      markSkip(it.path);
      toast("已记住：这个网站以后直接在新窗口打开",2200);
      try{window.open(it.path,"_blank","noopener")}catch(e){}
    };
    $("#viewer").classList.add("on");
    $("#vbar").style.display="flex";
    $("#vName").textContent=it.name;
    document.body.style.overflow="hidden";
    var _l2=document.getElementById("appList");if(_l2)_l2.style.visibility="hidden";
    currentId=id;
    it.lastOpen=Date.now();
    save();
    try{history.pushState({boxViewer:id},"","#"+"tool="+encodeURIComponent(id))}catch(e){}
    if(!loadFrame(it)){
      closeViewer(true);
      toast("链接无效，已复制到剪贴板",2400);
      try{navigator.clipboard&&navigator.clipboard.writeText(it.path)}catch(e){}
    }
    return;
  }
  if(!loadFrame(it)){
    if(it.type==="ref")toast("这是外链条目，没法在这里直接打开");
    else toast("这个条目没有内容，请重新导入");
    return;
  }
  $("#btnVOpen").style.display="none";
  $("#viewer").classList.add("on");
  $("#vbar").style.display="flex";
  $("#vName").textContent=it.name;
  document.body.style.overflow="hidden";
  // 性能：iframe 全屏时冻结列表绘制，减轻 WKWebView 合成压力
  var _list=document.getElementById("appList");
  if(_list)_list.style.visibility="hidden";
  var _grid=document.querySelector(".grid");
  if(_grid)_grid.style.visibility="hidden";
  var _pill=document.querySelector(".pillview");
  if(_pill)_pill.style.visibility="hidden";
  currentId=id;
  it.lastOpen=Date.now();
  save();
  try{history.pushState({boxViewer:id},"","#"+"tool="+encodeURIComponent(id))}catch(e){}
}
function closeViewer(skipHistory){
  if(currentId===null)return;
  var f=$("#frame");
  f.removeAttribute("srcdoc");
  f.src="about:blank";
  $("#viewer").classList.remove("on");
  $("#vbar").style.display="none";
  document.body.style.overflow="";
  // 恢复列表绘制
  var _l2=document.getElementById("appList");
  if(_l2)_l2.style.visibility="";
  var _g2=document.querySelector(".grid");
  if(_g2)_g2.style.visibility="";
  var _p2=document.querySelector(".pillview");
  if(_p2)_p2.style.visibility="";
  setTimeout(forceRepaint,30);
  currentId=null;
  if(!skipHistory){
    if(location.hash.indexOf("#tool=")===0)history.back();
  }
  render();
}
window.addEventListener("popstate",function(){
  if(currentId!==null)closeViewer(true);
});

/* ---------------------- 导入 ---------------------- */
var pending=[],pendingFolders=[];
function restorePendingFolders(){
  if(!pendingFolders||!pendingFolders.length)return;
  var added=0;
  pendingFolders.forEach(function(fo){
    if(fo&&fo.id&&!folders().some(function(x){return x.id===fo.id})){
      folders().push({id:fo.id,name:fo.name||"未命名"});added++;
    }
  });
  pendingFolders=[];
  if(added)toast("已恢复 "+added+" 个文件夹",2200);
}
function guessName(html,filename){
  var m=html.match(/<title[^>]*>([\s\S]{1,120}?)<\/title>/i);
  if(m&&m[1].trim())return m[1].trim().replace(/\s+/g," ");
  var n=filename.replace(/\.html?$/i,"");
  return n||"未命名工具";
}
function guessDesc(html){
  var m=html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']{1,160})["']/i)
       || html.match(/<meta[^>]+content=["']([^"']{1,160})["'][^>]+name=["']description["']/i);
  return m?m[1].trim():"";
}
function readFiles(files){
  var list=Array.prototype.slice.call(files).filter(function(f){return /\.html?$/i.test(f.name)||f.type==="text/html"});
  if(!list.length){toast("请选择 .html 或 .htm 文件");return}
  toast(list.length>1?("正在解析 "+list.length+" 个文件…"):"正在解析文件，大文件需要几秒…",1800);
  Promise.all(list.map(function(f){
    return new Promise(function(res){
      var r=new FileReader();
      r.onload=function(){
        var html=String(r.result||"");
        // 收纳盒备份文件：不是工具，拆出里面内嵌的工具逐个导入
        // 特征检测放宽：seed-data 标签 / 版本号变量 / 标题，兼容旧版导出格式
        var isShelf = html.indexOf('id="seed-data"')>=0 || html.indexOf('seed-data')>=0 && html.indexOf('appList')>=0 || html.indexOf("__hbver")>=0;
        var isShelf = html.indexOf('id="seed-data"')>=0 || html.indexOf('seed-data')>=0 && html.indexOf('appList')>=0 || html.indexOf("__hbver")>=0;
        var legacyShelf = !isShelf && html.indexOf('id="appList"')>=0 && /收纳盒/.test(html.slice(0,4000));
        if(legacyShelf){
          res({file:f,html:"",name:f.name,desc:"",size:f.size,shelfEmpty:true,legacy:true,
            reason:"这是老版本的收纳盒文件（工具数据存在浏览器缓存里，文件内没有工具）"});
          return;
        }
        if(isShelf){
          var boxItems=null, parseFail=null;
          try{
            var m2=html.match(/<script[^>]*id="seed-data"[^>]*>([\s\S]*?)<\/script>/);
            if(!m2){parseFail="文件里找不到数据段"}
            else{
              var seed=JSON.parse(m2[1]);
              // 全类型拆分：embed 带内容，ref/url 只恢复元数据
              var raw=(seed&&seed.items)||[];
              boxItems=raw.map(function(x){
                return {file:{name:f.name},html:x.type==="embed"?(x.html||""):"",
                  name:x.name||"未命名",desc:x.desc||"",size:x.size||0,boxItem:x};
              });
              if(!raw.length)parseFail="备份里的工具列表是空的";
            }
          }catch(e){ parseFail="数据解析失败（"+String(e&&e.message||e).slice(0,40)+"）" }
          if(parseFail||!boxItems||!boxItems.length){
            res({file:f,html:"",name:f.name,desc:"",size:f.size,shelfEmpty:true,legacy:legacyShelf,reason:legacyShelf?"这是老版本的收纳盒文件（工具数据存在浏览器缓存里，文件内没有工具）":(parseFail||"备份里没有工具")});
            return;
          }
          res({file:f,boxList:boxItems,folderList:(seed.settings&&seed.settings.folders)||[]});
          return;
        }
        res({file:f,html:html,name:guessName(html,f.name),desc:guessDesc(html),size:f.size});
      };
      r.onerror=function(){res({file:f,html:"",name:f.name,desc:"",size:f.size,err:true})};
      r.readAsText(f,"utf-8");
    });
  })).then(function(rows){
    // 展开备份文件拆出的工具列表
    var all=[], emptyShelves=[];pendingFolders=[];
    rows.forEach(function(r){
      if(r.boxList){all.push.apply(all,r.boxList);if(r.folderList)pendingFolders=pendingFolders.concat(r.folderList)}
      else if(r.shelfEmpty){emptyShelves.push(r)}

    pending=all.filter(function(r){return !r.err});
    var failed=rows.filter(function(r){return r.err}).length;

    if(!failed&&!emptyShelves.length&&rows.some(function(r){return r.boxList})){

          '<p class="hint">如果这是之前导出的备份，说明当时导出的版本较老或数据不完整——工具内容可能存在浏览器缓存里而没写进文件。当前设备上的工具不受影响。</p>',
          '<button class="btn-primary" style="width:auto;padding:0 16px" data-act="sheet-cancel">知道了</button>');
      },10);
    }

  });
}

function doImport(){
  var mode=$("#impMode")?$("#impMode").value:"embed";
  var n=0,total=0;
  pending.forEach(function(r){
    // 去重：同名同大小已存在则跳过
    if(r.boxItem){
      var b=r.boxItem;
      var exist2=DB.items.find(function(x){return x.name===b.name&&(x.size||0)===(b.size||0)&&x.type===b.type});
      if(exist2)return;
      var copy=Object.assign({},b);delete copy._url;
      DB.items.push(normalize(copy));
      n++;total+=b.size||0;
      return;
    }
    var exist=DB.items.find(function(x){return x.name===r.name&&x.size===r.size&&x.type===mode});
    if(exist)return;
    if(mode==="embed"){
      DB.items.push(normalize({
        id:uid(),name:r.name,desc:r.desc,type:"embed",html:r.html,size:r.size,
        addedAt:Date.now(),tags:["导入"],
      }));
      total+=r.size;
    }else{
      DB.items.push(normalize({
        id:uid(),name:r.name,desc:r.desc,type:"ref",path:r.file.name,size:r.size,
        addedAt:Date.now(),tags:["链接"],
      }));
    }
    n++;
  });
  restorePendingFolders();
  save();render();closeSheet();pending=[];
  if(!n){toast("都已存在，未重复添加");return}
  toast("已导入 "+n+" 个工具"+(mode==="embed"?("，共 "+bytes(total)):""));
  // 网页模式：数据存在站点空间里，无需导出；本地文件模式：尝试静默覆盖，失败才提醒导出
  if(!inFile){ return }
  try{
    var fresh=buildSelfContained();
    if(fresh)tryAutoOverwrite(fresh).then(function(ok){
      if(ok)return;
      setTimeout(function(){
        openSheet("已导入到当前页面",
          '<div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><div>为了以后只打开一个文件就能用，建议现在导出一次<strong>自包含 HTML</strong>。浏览器本地缓存容量有限，大文件不导出的话刷新后可能丢失。</div></div>'+
          '<p class="hint">导出后你会得到一个包含全部工具的新 HTML 文件，覆盖原来那个收纳盒即可。</p>',
          '<button class="btn-ghost" data-act="sheet-cancel">稍后</button>'+
          '<button class="btn-primary" style="width:auto;padding:0 16px" data-act="export">立即导出单文件</button>');
      },420);
    });
  }catch(e){}
}

/* ---------------------- 导出单文件 ---------------------- */
function buildSelfContained(){
  var seed={items:DB.items.map(function(it){
    var o=Object.assign({},it);
    delete o._url;delete o.lastOpen;
    if(o.type!=="embed")delete o.html;
    return o;
  }),settings:{theme:DB.settings.theme||"auto",customTheme:DB.settings.customTheme||[],folders:DB.settings.folders||[],removedSeed:DB.settings.removedSeed||[]}};
  var json=JSON.stringify(seed).replace(/</g,"\\u003c");
  var html=document.documentElement.outerHTML;
  // 找到模板自身的 seed-data 并替换（原件通常是空/旧数据）
  var re=new RegExp('<script id="seed-data" type="application/json">[\\s\\S]*?<\\/script>');
  if(!re.test(html)){ toast("模板损坏，无法导出"); return null }
  // 必须用函数式替换：字符串替换会把工具代码里的 $'、$& 等当作特殊符号，破坏导出文件
  html=html.replace(re,function(){ return '<'+'script id="seed-data" type="application/json">'+json+'<'+'/script>'; });
  // 清掉运行时状态：弹层/查看器/toast/菜单都不能带进导出文件
  var sheetBlock='<div class="sheet-mask" id="mask">'+
    '<div class="sheet" id="sheet" role="dialog" aria-modal="true">'+
    '<div class="sheet-head"><h3 id="sheetTitle"></h3><button class="close" id="sheetClose" aria-label="关闭">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'+
    '</button></div><div class="sheet-body" id="sheetBody"></div>'+
    '<div class="sheet-foot" id="sheetFoot"></div></div></div><div class="menu" id="menu">';
  html=html.replace(/<div class="sheet-mask[^>]*>[\s\S]*?<div class="menu" id="menu">/,sheetBlock);
  html=html.replace(/class="viewer on"/g,'class="viewer"');
  html=html.replace(/id="vbar" style="display:flex"/g,'id="vbar" style="display:none"');
  html=html.replace(/(<div id="appList">)[\s\S]*?(<\/div>\s*<\/main>)/,'$1$2');
  html=html.replace(/(<div class="toasts" id="toasts">)[\s\S]*?(<\/div>\s*<input type="file")/,'$1$2');
  return "<!DOCTYPE html>\n"+html;
}
/* ============ 文件句柄：选一次文件，之后导入自动覆盖 ============ */
var fsHandle=null;
function fsIdb(){
  return new Promise(function(res,rej){
    try{
      var r=indexedDB.open("htmlbox-fs",1);
      r.onupgradeneeded=function(){ try{r.result.createObjectStore("h")}catch(e){} };
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error)};
    }catch(e){rej(e)}
  });
}
function fsStore(h){ try{ fsIdb().then(function(db){ var tx=db.transaction("h","readwrite"); tx.objectStore("h").put(h,"handle"); }).catch(function(){}) }catch(e){} }
function fsLoad(){ return fsIdb().then(function(db){ return new Promise(function(res){
  try{ var tx=db.transaction("h","readonly"); var q=tx.objectStore("h").get("handle"); q.onsuccess=function(){res(q.result||null)}; q.onerror=function(){res(null)}; }catch(e){res(null)}
}) }).catch(function(){return null}); }
function fsWrite(h,html){ return h.createWritable().then(function(w){ return w.write(new Blob([html],{type:"text/html"})).then(function(){ return w.close() }); }); }
// 若已授权过文件句柄，静默写回；成功返回 true
function tryAutoOverwrite(html){
  return fsLoad().then(function(h){
    if(!h||!h.queryPermission)return false;
    return h.queryPermission({mode:"readwrite"}).then(function(st){
      if(st==="granted")return true;
      return h.requestPermission({mode:"readwrite"}).then(function(s){return s==="granted"}).catch(function(){return false});
    }).then(function(ok){
      if(!ok)return false;
      return fsWrite(h,html).then(function(){ fsHandle=h; toast("已自动覆盖保存到原文件",2200); return true; },
        function(){ return false });
    });
  }).catch(function(){ return false });
}

function downloadText(text,filename){
  var blob=new Blob([text],{type:"text/html;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download=filename;a.rel="noopener";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},8000);
}
function doExport(){
  var html=buildSelfContained();
  if(!html)return;
  // 固定文件名：分享/保存到「文件」时选同一位置，iOS 会提示"替换"，实现覆盖
  var fn="收纳盒.html";
  closeSheet();
  // 优先：已授权过的文件句柄，静默覆盖
  try{
    var done=tryAutoOverwrite(html).then(function(ok){
      if(ok)return;
      doExportFallback(html,fn);
    });
    return;
  }catch(e){}
  doExportFallback(html,fn);
}
function doExportFallback(html,fn){
  // 支持文件系统 API：弹出保存选择器，选同一个文件即可覆盖，并记住句柄
  try{
    if(window.showSaveFilePicker){
      window.showSaveFilePicker({suggestedName:fn,types:[{description:"HTML",accept:{"text/html":[".html",".htm"]}}]})
      .then(function(h){ return fsWrite(h,html).then(function(){ fsStore(h); fsHandle=h; toast("已保存，之后导入会自动覆盖这个文件",2600); }); })
      .catch(function(err){ if(err&&err.name==="AbortError")return; shareExport(html,fn); });
      return;
    }
  }catch(e){}
  shareExport(html,fn);
}
function shareExport(html,fn){
  // iOS 优先用系统分享面板：内置 WebView 里 a[download] 会卡死触摸事件
  try{
    var file=new File([html],fn,{type:"text/html"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).then(function(){  // 不带 title：iOS 会把标题存成一个多余的小文本文件
        toast("已通过分享面板导出");
      }).catch(function(err){
        if(err&&err.name==="AbortError")return;
        downloadText(html,fn);
        showExportSheet(fn);
      });
      return;
    }
  }catch(e){}
  downloadText(html,fn);
  showExportSheet(fn);
}
function showExportSheet(fn){
  openSheet("已开始下载",
      '<div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><div>如果浏览器没有自动保存：点地址栏左边的 <strong>aA / 分享按钮</strong> →「下载」，或长按本页链接选择「下载链接文件」。文件会存到「文件」App 的「下载」里。</div></div>'+
      '<p class="hint">以后直接打开这个新文件，所有工具都在里面。</p>',
      '<button class="btn-primary" style="width:auto;padding:0 16px" data-act="sheet-cancel">知道了</button>');

function saveManifest(){
  var raw=$("#mf").value.trim();
  var arr;
  try{ arr=JSON.parse(raw||"[]") }catch(e){toast("JSON 格式有误："+e.message,3200);return}
  if(!Array.isArray(arr)){toast("清单必须是数组");return}
  var byName={};
  DB.items.forEach(function(it){byName[(it.name||"")+"|"+(it.path||it.id)]=it});
  var next=[];
  arr.forEach(function(row,i){
    if(!row||typeof row!=="object")return;
    var exist=DB.items[i]&&DB.items[i].type==="ref"?null:null;
    // 按 name+file 匹配原条目
    var found=DB.items.find(function(x){
      return x.name===(row.name||"")&&((x.path||"")===(row.file||row.url||"")||x.type==="embed");
    });
    if(row.type==="ref"||row.file||row.url){
      next.push(normalize({
        id:(found&&found.id)||uid(),name:row.name||"未命名",
        desc:row.desc||"",type:"ref",path:row.file||row.url||"",size:row.size||0,
        tags:["链接"],addedAt:(found&&found.addedAt)||Date.now(),builtin:!!row.builtin
      }));
    }else if(found){
      next.push(found);
    }else{
      next.push(normalize({id:uid(),name:row.name||"未命名",desc:row.desc||"",type:"embed",html:"",tags:["清单"],addedAt:Date.now()}));
    }
  });
  // 把未出现在清单里的内嵌条目也算作删除
  DB.items=next;save();render();closeSheet();toast("清单已保存");

    else toast("内嵌工具在收纳盒内打开即可");
  }
  if(act==="rename"){ showEdit(id) }
  if(act==="pin"){ it.pinned=!it.pinned;save();render();toast(it.pinned?"已置顶":"已取消置顶") }
  if(act==="move"){ selSet={};selSet[id]=true;showMoveSheet() }
  if(act==="copylink"){
    var cu=b.getAttribute("data-url");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(cu).then(function(){toast("链接已复制",2200)}).catch(function(){toast("复制失败")});
    }else toast("此环境不支持复制");
  }
  if(act==="del"){ showDelete(id) }
});

/* ============ 事件委托（主交互层） ============ */
document.addEventListener("click",function(e){
  var t=e.target;

  // 卡片菜单按钮
  var more=t.closest('[data-act="menu"]');
  if(more){
    e.preventDefault();e.stopPropagation();
    var r=more.getBoundingClientRect();
    showMenu(r.right-8,r.bottom+6,more.getAttribute("data-id"),"card");
    return;
  }
  // 点灰色标签快速编辑
  var tagchip=t.closest(".chip[data-tagchip]");
  if(tagchip&&!selMode){
    var tc=tagchip.closest("[data-id]");
    if(tc){showEdit(tc.getAttribute("data-id"));return}
  }
  var odl=t.closest("[data-ord-l]"),odr=t.closest("[data-ord-r]");
  if(odl||odr){
    var oid=(odl||odr).getAttribute(odl?"data-ord-l":"data-ord-r");
    var vis=visibleItems(),vi=vis.findIndex(function(x){return x.id===oid});
    var vj=odl?vi-1:vi+1;
    if(vi>=0&&vj>=0&&vj<vis.length){
      var A=vis[vi],B=vis[vj];
      var oa=A.ord!=null?A.ord:(A.addedAt||0), ob=B.ord!=null?B.ord:(B.addedAt||0);
      A.ord=ob;B.ord=oa;save();render();
    }
    return;
  }
  var card=t.closest(".card");
  if(card&&!t.closest(".more")){
    if(selMode){toggleSel(card.getAttribute("data-id"));return}
    openItem(card.getAttribute("data-id"));
    return;
  }
  var pill=t.closest(".pill");
  if(pill&&!t.closest(".more")){
    if(selMode){toggleSel(pill.getAttribute("data-id"));return}
    openItem(pill.getAttribute("data-id"));
    return;
  }
  // 文件夹行
  var fde=t.closest("[data-fold-edit]");
  if(fde){state.folderEdit=!state.folderEdit;document.body.classList.toggle("organizing",state.folderEdit);render();return}
  var fdl=t.closest("[data-fold-l]"),fdr=t.closest("[data-fold-r]");
  if(fdl||fdr){
    var fid=(fdl||fdr).getAttribute(fdl?"data-fold-l":"data-fold-r");
    var arr=folders(),i=arr.findIndex(function(x){return x.id===fid});
    var j=fdl?i-1:i+1;
    if(i>=0&&j>=0&&j<arr.length){var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;save();render()}
    return;
  }
  var fdx=t.closest("[data-fold-del]");
  if(fdx){showDelFolder(fdx.getAttribute("data-fold-del"));return}
  var fdn=t.closest("[data-fold-new]");
  if(fdn){showNewFolder();return}
  var fd=t.closest("[data-fold]");
  if(fd){
    var fvid=fd.getAttribute("data-fold");
    if(state.folderEdit&&fvid&&fvid!=="__none__"){showRenameFolder(fvid);return}
    state.folder=fvid;render();return;
  }
  // 多选条
  if(t.closest('[data-act="sel-all"]')){
    var vis=visibleItems();
    var all=vis.length>0&&vis.every(function(it){return selSet[it.id]});
    selSet={};
    if(!all)vis.forEach(function(it){selSet[it.id]=true});
    $("#selCnt").textContent=Object.keys(selSet).length;
    syncSelAll();
    render();return;
  }
  if(t.closest('[data-act="sel-exit"]')){exitSelect();return}
  if(t.closest('[data-act="sel-del"]')){selDelete();return}
  if(t.closest('[data-act="sel-move"]')){showMoveSheet();return}
  var mvb=t.closest("[data-move-to]");
  if(mvb){closeSheet();moveToFolder(mvb.getAttribute("data-move-to"));return}
  var cl=t.closest('[data-act="copy-link"]');
  if(cl){
    var u1=cl.getAttribute("data-url");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(u1).then(function(){toast("已复制，去 Safari 粘贴打开",2600);closeSheet()})
      .catch(function(){toast("复制失败",2000)});
    }else toast("此环境不支持复制");
    return;
  }
  var nl=t.closest('[data-act="nav-link"]');
  if(nl){location.href=nl.getAttribute("data-url");return}
  var vb=t.closest("#btnSel");
  if(vb){enterSelect();return}
  var vb2=t.closest("#btnView");
  if(vb2){ setView(viewMode()==="compact"?"card":"compact"); return }
  if(t.closest("#dropTail")){
    showAddSheet();
    return;
  }

  var btn=t.closest("[data-act]");
  if(!btn)return;
  var act=btn.getAttribute("data-act");
  switch(act){
    case "add": showAddSheet(); break;
    case "pick-file": $("#filePick").click(); break;
    case "paste-import": showPasteImport(); break;
    case "confirm-paste": doPasteImport(); break;
    case "add-link": showLinkAdd(); break;
    case "confirm-link": doLinkAdd(); break;
    case "confirm-folder": confirmNewFolder(); break;
    case "confirm-folder-del": confirmDelFolder($("#sheetFoot").lastElementChild.dataset.foldDelId); break;
    case "confirm-folder-rename": confirmRenameFolder($("#sheetFoot").lastElementChild.dataset.foldRenameId); break;
    case "confirm-sel-del": selDeleteConfirm(); break;
    case "show-add": showAddSheet(); break;
    case "notice-read": try{localStorage.setItem("hb.notice.v2","read")}catch(e){} closeSheet(); break;
    case "sheet-cancel": closeSheet(); break;
    case "confirm-import": doImport(); break;
    case "save-manifest": saveManifest(); break;
    case "save-edit": saveEdit(); break;
    case "export": doExport(); break;
    case "copy": copySelfContained(); break;
    case "confirm-del": deleteItem(btn.dataset.delId); break;
    case "help": showHelp(); break;
    case "skin": setSkin(btn.getAttribute("data-v")||"auto"); break;
    case "skin-open": showSkinSheet(); break;
    case "custom-new": showCustomSkin(null); break;
    case "custom-edit": e.stopPropagation(); showCustomSkin(+btn.getAttribute("data-i")); break;
    case "custom-save": saveCustomSkin(); break;
    case "custom-del": delCustomSkin(); break;
    case "restore-builtin": restoreBuiltin(); break;
  }
});

function deleteItem(id){
  var idx=DB.items.findIndex(function(x){return x.id===id});
  if(idx<0){closeSheet();return}
  var it=DB.items[idx];
  if(it.builtin){
    DB.settings.removedSeed=(DB.settings.removedSeed||[]);
    if(DB.settings.removedSeed.indexOf(it.builtinId||it.id)<0)DB.settings.removedSeed.push(it.builtinId||it.id);
  }
  DB.items.splice(idx,1);
  save();render();closeSheet();toast("已删除");
}
function restoreBuiltin(){
  DB.settings.removedSeed=[];
  save();closeSheet();
  toast("已恢复，刷新页面后出现内置示例",2600);
}

function selDeleteConfirm(){
  Object.keys(selSet).forEach(function(id){
    var it=DB.items.find(function(x){return x.id===id});
    if(it&&it.builtin){
      DB.settings.removedSeed=(DB.settings.removedSeed||[]);
      if(DB.settings.removedSeed.indexOf(it.builtinId||it.id)<0)DB.settings.removedSeed.push(it.builtinId||it.id);

/* ---------------------- 长按拖动排序（整理模式） ---------------------- */
var drag=null;
document.addEventListener("pointerdown",function(e){
  if(!state.folderEdit||selMode||drag)return;
  if(e.pointerType==="mouse"&&e.button!==0)return;
  var t=e.target;
  if(t.closest(".ordb,.fx,.more,.ckmark,[data-fold-edit],[data-fold-new]"))return;
  var el=t.closest('.card,.pill,.fchip[data-fold]');
  if(!el)return;
  var fid=el.getAttribute?el.getAttribute("data-fold"):null;
  if(el.classList.contains("fchip")&&(!fid||fid==="__none__"))return;
  drag={el:el,started:false,sx:e.clientX,sy:e.clientY,
    timer:setTimeout(function(){beginDrag(e)},320)};
});
function beginDrag(e){
  if(!drag)return;
  drag.started=true;
  var r=drag.el.getBoundingClientRect();
  drag.ox=e.clientX-r.left;drag.oy=e.clientY-r.top;
  var g=drag.el.cloneNode(true);
  g.classList.add("drag-ghost");
  g.style.width=r.width+"px";
  document.body.appendChild(g);
  drag.ghost=g;
  drag.el.classList.add("dragging");
  try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}
}
document.addEventListener("pointermove",function(e){
  if(!drag||!drag.started)return;
  e.preventDefault();
  drag.ghost.style.left=(e.clientX-drag.ox)+"px";
  drag.ghost.style.top=(e.clientY-drag.oy)+"px";
  var under=document.elementFromPoint(e.clientX,e.clientY);
  var tgt=under&&under.closest?under.closest('.card,.pill,.fchip[data-fold]'):null;
  if(!tgt||tgt===drag.el)return;
  if(tgt.tagName!==drag.el.tagName||tgt.parentNode!==drag.el.parentNode)return;
  var r=tgt.getBoundingClientRect();
  var before=drag.el.classList.contains("fchip")
    ?(e.clientX<r.left+r.width/2)
    :(e.clientY<r.top+r.height/2);
  tgt.parentNode.insertBefore(drag.el,before?tgt:tgt.nextSibling);
},{passive:false});
function endDrag(){
  if(!drag)return;
  clearTimeout(drag.timer);
  if(drag.started){
    if(drag.ghost)drag.ghost.remove();
    drag.el.classList.remove("dragging");
    commitDrag(drag.el);
  }
  drag=null;
}
document.addEventListener("pointerup",endDrag);
document.addEventListener("pointercancel",endDrag);
document.addEventListener("touchmove",function(e){if(drag&&drag.started)e.preventDefault()},{passive:false});
function commitDrag(el){
  if(el.classList.contains("fchip")){
    var ids=[].slice.call(document.querySelectorAll('#folderRow .fchip[data-fold]'))
      .map(function(b){return b.getAttribute("data-fold")})
      .filter(function(id){return id&&id!=="__none__"});
    folders().sort(function(a,b){return ids.indexOf(a.id)-ids.indexOf(b.id)});
    save();render();
  }else{
    var nodes=[].slice.call(document.querySelectorAll('#appList [data-id].card,#appList [data-id].pill'));
    var vis=nodes.map(function(n){return DB.items.find(function(x){return x.id===n.getAttribute("data-id")})}).filter(Boolean);
    if(vis.length<2)return render();
    var ords=vis.map(function(it){return it.ord!=null?it.ord:(it.addedAt||0)})
      .sort(function(a,b){return a-b});
    vis.forEach(function(it,i){it.ord=ords[i]});
    save();render();
  }
}
function showDelFolder(fid){
  var f=folders().find(function(x){return x.id===fid});if(!f)return;
  var n=DB.items.filter(function(x){return x.folder===fid}).length;
  openSheet("删除文件夹「"+f.name+"」？",

function doLinkAdd(){
  var url=$("#link-url").value.trim();
  if(!url){toast("请输入网址");return}
  if(!/^https?:\/\//i.test(url)){
    if(/^[\w-]+(\.[\w-]+)+/.test(url))url="https://"+url;
    else{toast("网址格式不对，要像 example.com 这样");return}
  }
  var name=$("#link-name").value.trim();
  if(!name){
    try{name=new URL(url).hostname.replace(/^www\./,"")}catch(e){name=url}
  }
  var exist=DB.items.find(function(x){return x.type==="ref"&&x.path===url});
  if(exist){toast("这个链接已经收藏过了");return}
  DB.items.push(normalize({
    id:uid(),name:name,desc:url,type:"ref",path:url,
    tags:[],addedAt:Date.now()
  }));
  save();render();closeSheet();
  toast("已收藏「"+name+"」");
}

/* ============ PWA：manifest / 图标 / SW 全部内联 ============ */
(function setupPWA(){
  // 图标：内联 SVG data URI（iOS 需要 png，SVG 会退化为截图，这里用 canvas 生成 png）
  function drawIcon(size,inset){
    var c=document.createElement("canvas");c.width=c.height=size;
    var x=c.getContext("2d");
    var g=x.createLinearGradient(0,0,size,size);
    g.addColorStop(0,"#3b6cff");g.addColorStop(1,"#8a5bff");
    x.fillStyle=g;
    var r=size*0.22,pad=size*inset*0.5||0;
    // 圆角矩形
    x.beginPath();
    if(x.roundRect){ x.roundRect(pad,pad,size-pad*2,size-pad*2,r) } else { x.rect(pad,pad,size,size) }
    x.fill();
    // 三层盒子线条
    x.strokeStyle="rgba(255,255,255,.95)";x.lineWidth=size*0.045;
    x.lineJoin="round";x.lineCap="round";
    var cx=size/2, w=size*0.26, h=size*0.13, y0=size*0.36;
    for(var i=0;i<3;i++){
      var cy=y0+i*h*1.55;
      x.beginPath();
      x.moveTo(cx-w,cy-h*0.18);
      x.lineTo(cx,cy-h*0.95);
      x.lineTo(cx+w,cy-h*0.18);
      x.lineTo(cx,cy+h*0.6);
      x.closePath();
      x.globalAlpha=i===0?1:(i===1?0.6:0.35);
      x.stroke();
    }
    x.globalAlpha=1;
    return c;
  }
  var icon192=drawIcon(192,0.16).toDataURL("image/png");
  var icon512=drawIcon(512,0.16).toDataURL("image/png");
  var iconApple=drawIcon(180,0.02).toDataURL("image/png");
  var iconMask=drawIcon(512,0.24).toDataURL("image/png");
  $("#app-icon").setAttribute("href",iconApple);

  // manifest：blob URL（file:// 下 Safari 不认 blob manifest，所以只在 http 下挂）
  try{
    var mf={
      name:"收纳盒 · HTML 工作台",short_name:"收纳盒",
      start_url:location.pathname+location.search,
      display:"standalone",background_color:"#eceffb",theme_color:"#5a5fd8",
      orientation:"any",lang:"zh-CN",
      icons:[
        {src:icon192,sizes:"192x192",type:"image/png",purpose:"any"},
        {src:icon512,sizes:"512x512",type:"image/png",purpose:"any"},
        {src:iconMask,sizes:"512x512",type:"image/png",purpose:"maskable"}
      ]
    };
    var blob=new Blob([JSON.stringify(mf)],{type:"application/manifest+json"});
    if(location.protocol!=="file:"){
      $("#app-manifest").setAttribute("href",URL.createObjectURL(blob));
    }else{
      $("#app-manifest").setAttribute("href","data:application/manifest+json;charset=utf-8,"+encodeURIComponent(JSON.stringify(mf)));
    }
  }catch(e){}

  // service worker：网络优先（避免更新后一直读旧缓存白屏），断网才用缓存（仅 http/https）
  if("serviceWorker" in navigator&&location.protocol!=="file:"){
    var swCode=[
      "const C='htmlbox-v2';",
      "self.addEventListener('install',e=>{self.skipWaiting()});",
      "self.addEventListener('activate',e=>{",
      "  e.waitUntil((async()=>{",
      "    const keys=await caches.keys();",
      "    await Promise.all(keys.filter(k=>k!==C).map(k=>caches.delete(k)));",
      "    await self.clients.claim();",
      "  })())});",
      "self.addEventListener('fetch',e=>{",
      "  const req=e.request;if(req.method!=='GET')return;",
      "  if(req.mode==='navigate'){",
      "    e.respondWith((async()=>{",
      "      try{const res=await fetch(req);",
      "        const c=await caches.open(C);c.put(location.pathname,res.clone());return res}",
      "      catch(err){const c=await caches.open(C);",
      "        const f=await c.match(location.pathname);",
      "        if(f)return f;throw err}})());return}",
      "  e.respondWith((async()=>{",
      "    try{const res=await fetch(req);",
      "      if(res&&res.ok&&new URL(req.url).origin===location.origin){const c=await caches.open(C);c.put(req,res.clone())}",
      "      return res}",
      "    catch(err){const c=await caches.open(C);",
      "      const hit=await c.match(req,{ignoreSearch:true});",
      "      if(hit)return hit;throw err}})());",
      "});"
    ].join("\n");
    var swUrl=URL.createObjectURL(new Blob([swCode],{type:"text/javascript"}));
    navigator.serviceWorker.register(swUrl,{scope:"./"}).catch(function(){ /* 忽略 */ });
  }
})();
