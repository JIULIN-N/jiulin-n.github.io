/* ============ 主题变量 ============ */
:root{
  --bg:#eceffb; --bg-2:#f6f7fd; --bg-3:#e2e6f4;
  --text:#1d2030; --text-2:#5c6178; --text-3:#9297ac;
  --line:rgba(93,98,160,.10); --line-2:rgba(93,98,160,.16);
  --brand:#5a5fd8; --brand-2:#767bef; --brand-soft:#e5e6fb;
  --danger:#e0525f; --danger-soft:#fdeaec;
  --ok:#2fa46b;
  --shadow:0 2px 6px rgba(90,95,180,.06),0 14px 34px -14px rgba(90,95,180,.16);
  --shadow-lg:0 18px 60px -16px rgba(70,74,150,.30);
  --r:24px; --r-sm:14px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12141f; --bg-2:#1a1d2c; --bg-3:#232739;
    --text:#eceef8; --text-2:#a3a9c2; --text-3:#737a96;
    --line:rgba(160,168,220,.12); --line-2:rgba(160,168,220,.2);
    --brand:#7c81f2; --brand-2:#979bfa; --brand-soft:#252a4a;
    --danger:#ff6b78; --danger-soft:#33202a;
    --ok:#43c98a;
    --shadow:0 2px 8px rgba(0,0,0,.25),0 16px 40px -16px rgba(0,0,0,.5);
    --shadow-lg:0 22px 64px -16px rgba(0,0,0,.7);
  }
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ============ 主题选择器 ============ */
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 6px}
.skins .grp{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--text-3);letter-spacing:.06em;margin:10px 0 -2px}
.skins .grp:first-child{margin-top:0}
.swatch{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--bg-2);border:1.5px solid var(--line);
  border-radius:14px;padding:9px 3px 7px;position:relative;transition:transform .12s,border-color .15s}
.swatch:active{transform:scale(.95)}
.swatch.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.swatch .dot{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);position:relative;overflow:hidden}
.swatch .dot i{position:absolute;inset:0}
.swatch .dot i.a{clip-path:polygon(0 0,100% 0,0 100%)}
.swatch .dot i.b{clip-path:polygon(100% 0,100% 100%,0 100%)}
.swatch .nm{font-size:10.5px;font-weight:650;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatch .ck{position:absolute;top:3px;right:4px;color:var(--brand);font-weight:800;font-size:10.5px}
/* 自定义取色行 */
.cusrow{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:10px 12px;border-radius:14px;
  background:var(--bg-2);border:1.5px solid var(--line)}
.cusrow.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.cusrow .prev{width:34px;height:34px;border-radius:50%;flex:none;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.cusrow .prev i{position:absolute;inset:0}
.cusrow .prev i.a{clip-path:polygon(0 0,100% 0,0 100%)}
.cusrow .prev i.b{clip-path:polygon(100% 0,100% 100%,0 100%)}
.cusrow .tt{flex:1;min-width:0}
.cusrow .tt b{display:block;font-size:13px;font-weight:700}
.cusrow .tt span{display:block;font-size:10.5px;color:var(--text-3);font-family:ui-monospace,Menlo,monospace}
.cusrow .go{height:32px;padding:0 14px;border-radius:999px;background:var(--brand);color:#fff;font-size:12.5px;font-weight:700;flex:none}
.pickers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 4px}
.pickers label{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:650;color:var(--text-2)}
.pickers input[type=color]{width:100%;height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg-2);
  padding:3px;cursor:pointer;-webkit-appearance:none;appearance:none}
.pickers input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.pickers input[type=color]::-webkit-color-swatch{border:0;border-radius:9px}
.cusacts{display:flex;gap:8px;margin-top:10px}
.cusacts button{flex:1;height:42px;border-radius:12px;font-size:13px;font-weight:650;
  background:var(--bg-2);border:1px solid var(--line);color:var(--text-2)}
.cusacts button.pri{background:var(--brand);color:#fff;border-color:transparent}

html{background:var(--bg,#eceffb)}
html,body{margin:0;padding:0;height:100%}
/* 关闭滚动锚定：打开弹层 / 导入文件导致 DOM 重排时，浏览器不会误调主页面滚动位置 */
html{overflow-anchor:none}
body{overflow-anchor:none}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  font-feature-settings:"tnum" 0;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brand);text-decoration:none}
::selection{background:color-mix(in srgb,var(--brand) 28%,transparent)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ============ 顶部栏 ============ */
.topbar{
  position:sticky; top:0; z-index:30;
  padding:calc(var(--safe-t) + 16px) calc(20px + var(--safe-r)) 14px calc(20px + var(--safe-l));
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px); backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid transparent; transition:border-color .2s;
}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{
  width:40px;height:40px;border-radius:14px;flex:none;
  background:var(--brand);
  display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--brand) 55%,transparent);
  transition:background .2s;
}
/* 灰青主题下 logo 用奶黄（该主题强调色为亮黄，logo 单独调柔和） */
html[data-theme="mutedteal"] .logo{
  background:#f2dd9d;
  box-shadow:0 8px 20px -6px color-mix(in srgb,#f2dd9d 55%,transparent);
}
.logo svg{width:21px;height:21px}
.brand h1{font-size:21px;font-weight:750;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:11px;color:var(--text-3);margin-top:0;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.iconbtn{
  width:44px;height:44px;border-radius:16px;display:grid;place-items:center;flex:none;
  color:var(--text-2);background:var(--bg-2);border:1px solid var(--line);
  box-shadow:var(--shadow);
  transition:transform .12s,background .15s,color .15s;
}
@media (hover:hover) and (pointer:fine){.iconbtn:hover{color:var(--text);background:var(--bg-3)}}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:19px;height:19px}
.btn-primary{
  height:46px;padding:0 20px;border-radius:999px;flex:none;
  background:linear-gradient(160deg,var(--brand),var(--brand-2));color:#fff;font-weight:650;font-size:14.5px;
  display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 10px 24px -8px color-mix(in srgb,var(--brand) 75%,transparent);
  transition:transform .12s,filter .15s;
}
.btn-primary:hover{filter:brightness(1.07)}
.btn-primary:active{transform:scale(.96)}
.btn-primary svg{width:17px;height:17px}
.btn-primary .lbl-txt{display:inline}

/* ============ 主体 ============ */
.wrap{max-width:1040px;margin:0 auto;padding:0 calc(16px + var(--safe-r)) calc(40px + var(--safe-b)) calc(16px + var(--safe-l))}
.toolbar{display:flex;gap:10px;align-items:center;padding:16px 0 10px}
/* 独立一行的三个入口：带文字的大按钮 */
.entry-row{display:flex;gap:10px;margin:2px 0 10px}
.entbtn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg-2);color:var(--text);font-size:13.5px;font-weight:680;cursor:pointer;box-shadow:var(--shadow);transition:.15s;padding:0 6px}
.entbtn:active{transform:scale(.96)}
.entbtn svg{width:19px;height:19px;color:var(--brand);flex:none}
.entbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;
  height:48px;padding:0 16px;border-radius:999px;background:var(--bg-2);
  border:1px solid var(--line);box-shadow:var(--shadow);
  transition:border-color .15s,box-shadow .15s;
}
.search.has-q .pgsearch-clear{display:flex}

.search:focus-within{border-color:color-mix(in srgb,var(--brand) 45%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 12%,transparent)}
.search svg{width:17px;height:17px;color:var(--text-3);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.search input::placeholder{color:var(--text-3)}
@media (max-width:700px){
  .toolbar{flex-wrap:wrap;row-gap:10px;gap:6px}
  .search{flex:1 1 100%;width:100%}
  .seg{order:2;padding:3px;gap:2px}
  .seg button{padding:8px 8px;font-size:12.5px}
  #btnView,#btnSel{order:3;width:30px;height:30px;border-radius:9px}
  #btnView svg,#btnSel svg{width:15px;height:15px}
  .entbtn{font-size:12.5px;height:42px;gap:6px}
}
.seg{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex:none;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:9px 14px;border-radius:999px;font-size:13.5px;color:var(--text-2);font-weight:560;white-space:nowrap;transition:.15s}
.seg button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);font-weight:680}
.extbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2);font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;flex:none;box-shadow:var(--shadow);white-space:nowrap;transition:.15s}
.extbtn svg{width:15px;height:15px;flex:none}
.extbtn.on{background:var(--brand-soft);color:var(--brand);border-color:transparent}
/* 独立整页：进度条库 / 盒中盒 */
.extpage{position:fixed;inset:0;z-index:70;background:var(--bg-2);display:none;flex-direction:column}
.extpage.on{display:flex;animation:viewIn .22s cubic-bezier(.2,.8,.2,1)}
/* 库页之间互切（进度条库↔星标页等）：跳过入场动画，避免整个页面淡入淡出产生的“闪一下” */
.extpage.on.pg-swap{animation:none}
/* 搜索栏（进度条库） */
.pg-search{flex:none;display:flex;align-items:center;gap:8px;margin:8px 14px 0;padding:0 12px;height:38px;border:1px solid var(--line);border-radius:999px;background:var(--bg-1,var(--bg));box-shadow:var(--shadow)}
.pg-search svg{width:16px;height:16px;flex:none;color:var(--text-3)}
.pg-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:13.5px;font-family:inherit;-webkit-appearance:none;appearance:none}
.pg-search input::-webkit-search-cancel-button{display:none}
.pgsearch-clear{flex:none;width:22px;height:22px;border:0;border-radius:999px;background:var(--bg-3);color:var(--text-3);font-size:16px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
.pgsearch-clear svg{display:block;width:13px;height:13px}
.pg-search.has-q .pgsearch-clear{display:grid}
/* 分组筛选弹层 */
.gfrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.gfrow:last-child{border-bottom:0}
.gfpick{flex:1;min-width:0;text-align:left;border:0;background:transparent;color:var(--text);font-size:13.5px;font-weight:620;padding:9px 10px;border-radius:9px;cursor:pointer;font-family:inherit}
/* 触屏点过一行后 :hover 会粘住，形成一块浅白圆角「选中」底；只在真鼠标设备启用 hover 反馈 */
@media (hover:hover){.gfpick:hover{background:var(--bg-2)}}
.gfpick.on{background:var(--brand-soft);color:var(--brand)}
.gfpick .n{font-size:11px;color:var(--text-3);font-weight:500;margin-left:6px}

#pgPage .extpage-bar #pgStar{width:30px;height:30px;border-radius:10px;box-shadow:none;margin-left:-4px}
#pgPage .extpage-bar #pgStar svg{width:16px;height:16px}

/* ===== 星标角标：仅已收藏时显示在卡片角上，纯状态、不可点、跟随主题色 ===== */
.starbadge{position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:999px;
  display:grid;place-items:center;background:var(--bg-2);border:1px solid var(--line);
  color:var(--brand);z-index:5;pointer-events:none;box-shadow:var(--shadow)}
.starbadge svg{width:11px;height:11px;fill:var(--brand);stroke:var(--brand)}
body.esel .starbadge{display:none}
.solidstar{display:inline-flex;vertical-align:-2px;width:14px;height:14px;color:var(--brand);margin:0 1px}
.solidstar svg{width:14px;height:14px;fill:currentColor;display:block}
/* ===== 流动胶囊排列：胶囊宽度随文字长度走，自动换行 ===== */
.flowview{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;transform:translateZ(0)}
.flowview .pill{max-width:100%;padding:11px 16px;gap:7px}
.flowview .pill .nm{flex:0 1 auto;min-width:0;max-width:min(58vw,300px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 流动胶囊带自定义标签：标签在剩余空间内自动换行（名称由 #mineList.flowview 规则保持完整） */
.flowview .pill .pgtags{flex:1 1 auto;min-width:0}
.flowview .pill .kindtag{flex:none;font-size:10px;color:var(--text-3);border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-weight:600}
.flowview .pill .more{margin-left:0}
.flowview .pill .sz{display:none}
body.esel .flowview .pill{padding-left:38px}
body.esel .flowview .ckmark{display:grid}
/* 我的工具 · 单行列表（与盒中盒一致：名称 + 类型标签 + ⋯） */
#mineList.boxrows{gap:18px}
#mineList.boxrows .boxrow{padding:14px 34px 14px 13px}
/* ===== 分组筛选弹层 · 编辑态（重命名 / 删除 / 拖动排序） ===== */
.gfhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.gfhead .lbl{font-size:12px;color:var(--text-3);font-weight:600}
.gfedit-btn{flex:none;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg-2);color:var(--text-2);font-size:12px;font-weight:650;cursor:pointer;font-family:inherit}
.gfedit-btn.on{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.gfrow.gfedit{gap:6px}
.gfdrag{flex:none;width:26px;height:32px;display:grid;place-items:center;color:var(--text-3);cursor:grab;touch-action:none;font-size:15px;line-height:1;user-select:none;-webkit-user-select:none}
.gfmini{flex:none;width:30px;height:30px;border:1px solid var(--line);border-radius:9px;background:var(--bg-2);color:var(--text-2);display:grid;place-items:center;font-size:13px;cursor:pointer;font-family:inherit;padding:0}
.gfmini.danger{color:var(--danger)}
.gfrow.gf-dragging{opacity:.35}
.gf-ghost{position:fixed;z-index:200;pointer-events:none;opacity:.94;box-shadow:var(--shadow-lg);border-radius:10px;background:var(--bg-2);border:1px solid var(--brand);padding:9px 12px;font-size:13.5px;font-weight:650;color:var(--text)}
/* ===== 查看器顶栏收藏按钮 ===== */
.vstar.on{color:var(--brand)}
.vstar.on svg{fill:var(--brand)}

.star-tip{flex:1;min-width:0;font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (hover:none){.card .more{opacity:1}}

/* 置顶卡片：与主题统一的品牌色强调，便于和未置顶区分（左侧品牌色块 + 浅品牌底） */
.card.pinned,.boxcard.pinned,.pgcard.pinned,.pill.pinned,.boxrow.pinned,.pgpill.pinned{
  border-color:color-mix(in srgb,var(--brand) 68%,var(--line));
  border-width:1.6px;
  background:color-mix(in srgb,var(--brand-soft) 88%,var(--bg-2));
  box-shadow:inset 4px 0 0 0 var(--brand),var(--shadow);
}
/* 置顶卡片上的类型胶囊（已打包 / 进度条 / 网页 / 链接 / 盒中盒）：品牌色填充，和普通灰胶囊区分；
   警示色(warn)、大小(sizechip)等语义标签不受影响，保持原色 */
.card.pinned .chip.embed,.card.pinned .chip.progress,.card.pinned .chip.ref,
.pill.pinned .chip.embed,.pill.pinned .chip.progress,.pill.pinned .chip.ref,
.boxrow.pinned .chip.embed,.boxrow.pinned .chip.progress,.boxrow.pinned .chip.ref,
.boxcard.pinned .chip.embed,.boxcard.pinned .chip.progress,.boxcard.pinned .chip.ref,
.pgcard.pinned .chip.embed,.pgcard.pinned .chip.progress,.pgcard.pinned .chip.ref,
.pgpill.pinned .chip.embed,.pgpill.pinned .chip.progress,.pgpill.pinned .chip.ref,
.card.pinned .kindtag,.pill.pinned .kindtag,.boxrow.pinned .kindtag,
.boxcard.pinned .kindtag,.pgcard.pinned .kindtag,.pgpill.pinned .kindtag{
  background:color-mix(in srgb,var(--brand) 20%,var(--bg-2));
  border-color:color-mix(in srgb,var(--brand) 50%,var(--line));
  color:var(--brand);font-weight:700;
}
/* 置顶卡片内·用户自定义标签：卡片底色本身即品牌浅色，标签沿用 --brand-soft 会与背景融合，
   改为近白底 + 品牌色描边 + 加粗文字，形成清晰边界（主页面 / 我的工具 / 进度条库 / 星标页各视图通用） */
.pgcard.pinned .pgtag,.boxrow.pinned .pgtag,.pgpills .pgpill.pinned .pgtag,.pgflowview .pgflow.pinned .pgtag,.flowview .pill.pinned .pgtag{
  background:color-mix(in srgb,var(--brand) 10%,var(--bg-2));
  border:1px solid color-mix(in srgb,var(--brand) 52%,var(--line));
  color:var(--brand);font-weight:700;
}
/* 置顶卡片内的制作者标签：改用品牌实底白字——普通标签（无论是否置顶）都不会是实底，置顶下也能一眼区分 */
.pgcard.pinned .pgtag.mkr,.boxrow.pinned .pgtag.mkr,.pgpills .pgpill.pinned .pgtag.mkr,.pgflowview .pgflow.pinned .pgtag.mkr,.flowview .pill.pinned .pgtag.mkr{
  background:var(--brand);border-color:var(--brand);color:#fff;
}

#q::-webkit-search-cancel-button{display:none}

/* 紧凑视图：小药丸按钮 */
.pillview{display:flex;flex-wrap:wrap;gap:14px;transform:translateZ(0)}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  max-width:100%;padding:11px 16px;border-radius:999px;
  background:var(--bg-2);border:1px solid var(--line);box-shadow:var(--shadow);
  color:var(--text);font-size:13.5px;font-weight:600;letter-spacing:-.01em;
  transition:transform .12s,box-shadow .16s;
  text-align:left;
}
.pill:hover{box-shadow:var(--shadow-lg)}
.pill:active{transform:scale(.96)}
.pill .sz{font-size:11px;color:var(--text-3);font-weight:550;font-variant-numeric:tabular-nums}
.pill .more{position:relative;width:22px;height:22px;border-radius:999px;display:grid;place-items:center;
  color:var(--text-3);background:transparent;opacity:1;flex:none}
/* 扩大 ⋯ 的触摸热区，避免手指点偏落到名称上误打开（尤其网页链接） */
.pill .more::before{content:"";position:absolute;left:-8px;right:-8px;top:-12px;bottom:-12px;border-radius:999px}
.pill .more svg{width:13px;height:13px;pointer-events:none}
.pill.ref{border-style:dashed}
/* 我的工具 · 紧凑列表：一行一排铺满整行，行距加大，不显示体积数字 */
#mineList.pillview{gap:18px}
#mineList.pillview .pill{width:100%;justify-content:flex-start;padding:13px 14px}
#mineList .pill .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mineList .pill .more{margin-left:auto}
#mineList .pill .sz,#mineList .sizechip{display:none}
/* 我的工具 · 流动胶囊：与主页面 / 盒中盒完全一致（ID 权重需显式覆盖） */
#mineList.flowview{column-gap:14px;row-gap:14px}
#mineList.flowview .pill{width:auto;max-width:100%;justify-content:flex-start;padding:11px 16px}
#mineList.flowview .pill .nm{flex:0 0 auto;max-width:min(58vw,300px)}
#mineList.flowview .pill .more{margin-left:0}

/* 文件夹行 */
.folder-wrap{display:flex;gap:8px;align-items:flex-start;padding:2px 0 10px}
.folder-wrap .editf{flex:none;align-self:center}
.folder-row{display:flex;gap:8px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.folder-row::-webkit-scrollbar{display:none}
.fchip{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--bg-2);border:1px solid var(--line);color:var(--text-2);box-shadow:var(--shadow);
  transition:.15s;white-space:nowrap;position:relative;
}
.fchip.on{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.fchip .fx{width:16px;height:16px;border-radius:999px;display:grid;place-items:center;color:inherit;opacity:.6}
.fchip .fx:hover{opacity:1}
.fchip .cnt{min-width:17px;height:17px;padding:0 5px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.fchip .cnt.zero{background:var(--bg-3);color:var(--text-3)}
/* ---- 面包屑 + 子文件夹行（只出现在打开的文件夹视图内） ---- */
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;padding:2px 2px 8px;font-size:12px;color:var(--text-3)}
.crumb{border:0;background:none;color:var(--text-3);font:inherit;display:inline-flex;align-items:center;gap:4px;padding:3px 5px;border-radius:8px;cursor:pointer}
button.crumb:hover{background:var(--bg-2);color:var(--text-2)}
.crumb.cur{color:var(--text);font-weight:600;cursor:default}
.csep{color:var(--text-3);opacity:.6;margin:0 1px}
.subrow{display:flex;flex-wrap:wrap;gap:8px;padding:0 2px 12px}
.subf{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);background:var(--bg-2);color:var(--text-2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;position:relative}
.subf>svg{color:var(--text-3);flex:none}
.subf .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:700;display:grid;place-items:center}
.subf .cnt.zero{background:var(--bg-3);color:var(--text-3)}
.subf .fx{display:grid;place-items:center;width:20px;height:20px;border-radius:999px;color:var(--text-3);cursor:pointer}
.subf .fx:hover{background:var(--bg-3);color:var(--danger)}
.subf .fx[data-fold-move]:hover{background:var(--brand-soft);color:var(--brand)}
.subf.organizing{border-style:solid;padding-left:9px}
.subf-empty{font-size:12px;color:var(--text-3);padding:6px 2px}
.subf.dragging{opacity:.35}
/* ---- 进度条卡片 ---- */
.pthumb{margin:10px 12px 0;border-radius:12px;background-color:#f6f7f9;background-image:linear-gradient(45deg,#e9edf2 25%,transparent 25%),linear-gradient(-45deg,#e9edf2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e9edf2 75%),linear-gradient(-45deg,transparent 75%,#e9edf2 75%);background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0;border:1px solid #e7ebf1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:56px;overflow:hidden}
.pthumb img{max-width:100%;max-height:72px;display:block}
.chip.progress{background:color-mix(in srgb,#bf8a56 16%,transparent);color:color-mix(in srgb,#bf8a56 72%,var(--text))}
.ordbtns{position:absolute;top:7px;left:7px;display:flex;flex-direction:row;gap:4px;z-index:3}
.pill{position:relative}
.pill .ordbtns{top:50%;transform:translateY(-50%);left:6px;gap:4px}
body.organizing .card .meta{padding-top:26px}
body.organizing .pill{padding-left:56px}
.ordb{width:20px;height:20px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text-2);box-shadow:var(--shadow)}
/* 整理模式：图标按钮 + 拖动 */
.fchip.editf{padding:8px 11px}
.fchip.organizing{padding-left:10px;padding-right:10px;gap:5px;touch-action:pan-x}
body.organizing .card,body.organizing .pill,body.organizing .fchip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;opacity:.92;transform:scale(1.03);box-shadow:0 14px 34px -8px rgba(0,0,0,.3)}
.dragging{opacity:.35}
.fchip.newf{color:var(--brand)}
/* ============ 文件夹导航（切换到文件夹导航模式时启用）============ */
.fnav{display:flex;flex-direction:column;gap:8px;padding:2px 0 10px}
.fnav-hd{display:flex;flex-direction:column;gap:2px;padding:2px 2px 6px}
.fnav-hd b{font-size:15px}
.fnav-hd span{font-size:12px;color:var(--text-3)}
.fnav-row{display:flex;align-items:center;gap:6px;width:100%;min-height:52px;padding:0 8px 0 14px;border:1px solid var(--line);background:var(--bg-2);border-radius:14px;color:var(--text);font-size:15px;font-weight:620;box-shadow:var(--shadow)}
.fnav-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;height:52px;padding:0;background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.fnav-row svg{width:20px;height:20px;flex:none;color:var(--brand)}
.fnav-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnav-sub{flex:none;font-size:11px;color:var(--text-3)}
.fnav-toggle{flex:none;width:30px;height:30px;display:grid;place-items:center;padding:0;border:1px solid var(--line);background:var(--bg-3);border-radius:999px;color:var(--text-3);font-size:12px;line-height:1;cursor:pointer}
.fnav-toggle.on{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.fnav-unc{background:var(--brand-soft);border-color:transparent}
.fnav-lv1{margin-left:20px;width:calc(100% - 20px);background:var(--bg-3);border-color:transparent;min-height:46px;font-size:14px}
.fnav-lv2{margin-left:40px;width:calc(100% - 40px);background:transparent;border-style:dashed;min-height:42px;font-size:13.5px}
.fnav-lv1 .fnav-main{height:46px}
.fnav-lv2 .fnav-main{height:42px}
.fnav-lv1 svg,.fnav-lv2 svg{width:17px;height:17px}
.fnav-empty{padding:16px;text-align:center;color:var(--text-3);font-size:13px}
.fnav-acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
/* 导航模式：隐藏顶部类型筛选选项行与文件夹行（即「全部选项」） */
body.homeNav .seg,body.homeNav .folder-wrap{display:none}
.fchip svg{width:13px;height:13px}
.orgbtn.on{background:var(--brand-soft);color:var(--brand);border-color:transparent}
body.extorg .extpage.on #pgList>*,body.extorg .extpage.on #mineList>*,body.extorg .extpage.on #boxList>*,body.extorg .extpage.on #iconList .pgcard{outline:1px dashed color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
body.extorg .extpage.on #pgList>*,body.extorg .extpage.on #mineList>*,body.extorg .extpage.on #boxList>*,body.extorg .extpage.on #iconList .pgcard{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.chip.srcbadge{background:var(--brand-soft);color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 28%,transparent)}
/* 主页面搜索：盒中盒内部命中结果 */
.boxhits{margin:2px 0 16px;padding:12px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line)}
.boxhits-hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--brand);margin-bottom:10px}
.boxhits-hd svg{width:15px;height:15px;flex:none}
.boxhits-tip{font-size:11px;font-weight:500;color:var(--text-3)}
.boxhits-in{display:flex;flex-direction:column;gap:8px}
.boxhit{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.boxhit-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:650}
.boxhit-from{flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--text-3)}
.boxhits-more{margin-top:8px;font-size:11px;color:var(--text-3)}
.pgthumb img,.icthumb img,.pthumb img{-webkit-user-drag:none;user-select:none;pointer-events:none}

/* 多选 */
body.selecting{padding-bottom:calc(130px + var(--safe-b))}
.selbar{
  position:fixed;z-index:75;left:12px;right:12px;bottom:calc(14px + var(--safe-b));
  display:none;flex-direction:column;align-items:stretch;gap:9px;
  background:color-mix(in srgb,var(--bg-2) 92%,transparent);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);
  padding:11px 12px;
}
.selbar.on{display:flex}
.selbar .cnt{flex:1;font-size:13.5px;font-weight:650}
.selbar .cnt b{color:var(--brand)}
.sel-top{display:flex;align-items:center;gap:10px}
.sel-ops{display:flex;gap:8px}
.sel-ops .btn-ghost{flex:1;min-width:0;height:38px;padding:0 4px;font-size:13px;box-shadow:none;justify-content:center;white-space:nowrap}
.selbar .btn-primary{height:38px;width:auto;padding:0 18px;font-size:13.5px;justify-content:center}
.ckmark{
  position:absolute;top:12px;left:12px;width:24px;height:24px;border-radius:999px;
  border:2px solid var(--line-2);background:var(--bg-2);z-index:5;
  display:none;place-items:center;transition:.15s;
}
.ckmark svg{width:13px;height:13px;opacity:0;color:#fff}
body.selecting .ckmark{display:grid}
body.selecting .card .more{display:none}
body.selecting .card .meta{padding-left:50px}
body.selecting .card .name{padding-right:8px}
.card.selected{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.card.selected .ckmark{background:var(--brand);border-color:var(--brand)}
.card.selected .ckmark svg{opacity:1}
/* 多选时文件夹 / 子文件夹也可勾选 */
body.selecting .fchip.selable{padding-left:38px}
body.selecting .subf{padding-left:38px}
body.selecting .fchip .ckmark,body.selecting .subf .ckmark{top:50%;left:8px;width:22px;height:22px;transform:translateY(-50%)}
.fchip.selected,.subf.selected{border-color:transparent;background:var(--brand-soft);color:var(--brand)}
.fchip.selected .ckmark,.subf.selected .ckmark{background:var(--brand);border-color:var(--brand)}
.fchip.selected .ckmark svg,.subf.selected .ckmark svg{opacity:1}
/* 设置 · 查重 */
.dupgrp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg-2)}
.duphead{font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px}
.dupsnippet{font-weight:500;font-size:11px;color:var(--text-3);word-break:break-all;flex:1 1 100%}
.duprow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}
.duprow:first-of-type{border-top:0}
.dupck{width:17px;height:17px;accent-color:var(--brand);flex:none;margin:0}
.dupnm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duploc{margin-left:auto;flex:none;font-size:11px;color:var(--text-3);max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.selecting .pill{padding-left:40px;position:relative}
body.selecting .pill .ckmark{display:grid;top:50%;transform:translateY(-50%)}
body.selecting .pill.selected{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
body.selecting .pill.selected .ckmark{background:var(--brand);border-color:var(--brand)}
body.selecting .pill.selected .ckmark svg{opacity:1}
body.selecting .pill .more{display:none}

/* 拖拽区 */
.dropzone{
  border:1.5px dashed color-mix(in srgb,var(--brand) 35%,transparent);border-radius:var(--r);
  padding:28px 18px;text-align:center;color:var(--text-3);
  background:color-mix(in srgb,var(--bg-2) 55%,transparent);
  transition:border-color .15s,background .15s,color .15s;
  cursor:pointer;width:100%;
}
.dropzone:active{transform:scale(.99)}
.dropzone.hot{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.dropzone .dz-ico{width:36px;height:36px;margin:0 auto 8px;color:inherit;opacity:.85}
.dropzone p{margin:0;font-size:13.5px}
.dropzone .dz-sub{font-size:12px;margin-top:4px;opacity:.8}

.empty{
  text-align:center;padding:52px 20px 60px;color:var(--text-3);
}
.empty .art{
  width:88px;height:88px;margin:0 auto 18px;border-radius:28px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand-soft),var(--bg-2));color:var(--brand);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.empty .art svg{width:38px;height:38px}
.empty h2{margin:0 0 6px;font-size:18px;color:var(--text);font-weight:700;letter-spacing:-.02em}
.empty p{margin:0 auto 20px;font-size:13.5px;max-width:340px;line-height:1.7}
.empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* 库页空状态：脱离网格列，整行铺满后文字才真正居中、不再挤成窄条 */
.extpage-body .empty{width:100%;grid-column:1/-1;grid-row:auto}
.btn-ghost{
  height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg-2);color:var(--text-2);font-size:14px;font-weight:600;
  box-shadow:var(--shadow);
  display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s,transform .12s;
}
@media (hover:hover) and (pointer:fine){.btn-ghost:hover{background:var(--bg-3);color:var(--text)}}
.btn-ghost:active{transform:scale(.97);background:var(--bg-3);color:var(--text)}
.btn-ghost svg{width:16px;height:16px}
/* 移动弹层：每个含子文件夹的文件夹行右侧自带展开 / 收起按钮 */
.mvrow{position:relative;width:100%}
.mvrow>.btn-ghost{width:100%}
.mvrow>.btn-ghost.has-toggle{padding-right:62px}
/* 主文件夹是亮色卡片；子 / 孙文件夹略淡一档，展开后不会和主文件夹混在一起 */
.mvrow.mv-root>.btn-ghost{background:var(--bg-2);border-color:var(--line-2);color:var(--text)}
.mvrow.mv-sub>.btn-ghost{background:color-mix(in srgb,var(--bg-2) 55%,var(--bg-3));border-color:var(--line);color:var(--text-2)}
.mvrow.mv-root>.btn-ghost:active,.mvrow.mv-sub>.btn-ghost:active{background:var(--bg-3);color:var(--text)}
.mvrow-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);z-index:1;
  width:40px;min-width:40px;height:32px;padding:0;border-radius:999px;
  border:1px solid var(--line);background:var(--bg-2);color:var(--text-3);
  font-family:inherit;font-size:14px;font-weight:700;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap}
.mvrow-toggle .arw{font-size:15px;line-height:1}
.mvrow-toggle.on{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 35%,transparent);background:var(--brand-soft)}
.mvrow-toggle:active{transform:translateY(-50%) scale(.93)}

/* ============ 查看器 ============ */
.viewer{position:fixed;inset:0;z-index:75;background:var(--bg-2);display:none;flex-direction:column}
.viewer.on{display:flex;animation:viewIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.viewer iframe{flex:1;width:100%;border:0;background:#fff;display:block}
html[data-theme="dark"] .viewer iframe{background:#12141f}
.vbar{
  position:fixed;z-index:78;top:calc(var(--safe-t) + 10px);left:calc(var(--safe-l) + 10px);
  display:flex;gap:8px;align-items:center;pointer-events:none;
  max-width:calc(100vw - 20px - var(--safe-l) - var(--safe-r));
}
.vbar > *{pointer-events:auto}
.vback{
  height:44px;padding:0 18px 0 14px;border-radius:999px;
  display:inline-flex;align-items:center;gap:6px;
  background:color-mix(in srgb,var(--bg-2) 88%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);
  color:var(--text);font-size:14px;font-weight:650;box-shadow:var(--shadow);
  transition:transform .12s,background .15s;
}
.vback:active{transform:scale(.95)}
.vback svg{width:17px;height:17px}
.vname{
  font-size:12.5px;color:var(--text-2);font-weight:600;padding:8px 13px;border-radius:999px;
  background:color-mix(in srgb,var(--bg-2) 82%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  max-width:min(46vw,300px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.vmore{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bg-2) 88%,transparent);backdrop-filter:blur(18px);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);color:var(--text-2);box-shadow:var(--shadow)}
.vmore svg{width:17px;height:17px}
.viewer .frame-wrap{flex:1;position:relative;padding-top:0;display:flex;overflow:hidden}
.viewer .vbar-spacer{height:calc(var(--safe-t) + 62px);flex:none;background:var(--bg-2)}

/* ============ 弹层 ============ */
.sheet-mask{position:fixed;inset:0;z-index:80;background:rgba(10,12,18,.5);display:none;align-items:flex-end;justify-content:center}
.sheet-mask.on{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:560px;max-height:88vh;max-height:min(88vh,calc(100dvh - 12px));background:var(--bg);border-radius:28px 28px 0 0;
  box-shadow:0 -8px 48px -8px rgba(40,44,110,.35);display:flex;flex-direction:column;
  padding-bottom:calc(8px + var(--safe-b));
  animation:sheetUp .24s cubic-bezier(.2,.8,.2,1);
}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;flex:none}
.sheet-head h3{margin:0;font-size:16px;font-weight:640;flex:1;letter-spacing:-.01em}
.sheet-body{padding:0 18px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
/* 键盘弹起：把遮罩本身收缩成键盘上方的可视矩形（top/height 都跟 visualViewport），
   弹层在这个矩形里贴顶排布。不用 dvh 减 overlap（会二次扣键盘高度把弹层压扁），
   也不拿 offsetTop 去做 margin（body 被 fixed 锁住后 offsetTop 语义在真机会变，把弹层推到半空）。
   遮罩位置/高度由 JS 按 vv 实测写入 --vv-top / --vv-h，位置稳定。 */
.sheet-mask.kb-open,.sheet-mask.on.kb-open.gf-flow{align-items:flex-start}
.sheet-mask.kb-open{top:var(--vv-top,0px);height:var(--vv-h,100dvh);bottom:auto}
.sheet-mask.on.kb-open>.sheet{
  margin-top:8px;
  max-height:calc(var(--vv-h,100dvh) - 16px);
  border-radius:18px;
  animation:none;
}
/* 提高特异性覆盖分组筛选弹层给 sheet-body 写的 max-height，让内容在键盘上方单层滚动 */
.sheet-mask.on.kb-open>.sheet>.sheet-body{flex:1 1 auto;min-height:0;max-height:none}
/* 分组筛选流程：弹层顶部固定、高度完全交给内容决定（height:auto）。
   列表 ⇄ 新建 / 重命名 / 删除切换时顶边不动；JS 不再写死像素高度——
   之前在部分 iOS WebView 里「切换内容那一帧量到旧布局」导致弹层被锁死压扁，
   显式高度 + 校准都治标不治本，自适应布局从机制上不可能锁死。
   内容区给一个视口上限：分组特别多时列表内部滚动，底部按钮仍然贴着弹层底边 */
.sheet-mask.gf-flow{--gf-top:clamp(88px,18vh,168px);align-items:flex-start}
.sheet-mask.gf-flow>.sheet{
  margin-top:var(--gf-top);
  max-height:calc(100vh - var(--gf-top) - 12px);
  max-height:calc(100dvh - var(--gf-top) - 12px);
  border-radius:22px;
}
.sheet-mask.gf-flow>.sheet>.sheet-body{flex:0 1 auto;min-height:0;
  max-height:calc(100vh - var(--gf-top) - 175px);
  max-height:calc(100dvh - var(--gf-top) - 175px)}
/* 弹层固定头部的操作区（分组流程放「编辑 / 完成」）与固定底部的主操作按钮 */
#sheetHeadSlot{display:flex;align-items:center;gap:8px;flex:none}
.sheet-foot .gf-foot-main{margin-right:auto}
/* 固定底部与可滚动列表之间给一条淡分隔，长列表滚到底时边界更清楚 */
.sheet-mask.gf-flow>.sheet>.sheet-foot{border-top:1px solid var(--line)}
.sheet-foot{padding:10px 18px calc(14px + var(--safe-b));display:flex;gap:9px;justify-content:flex-end;flex:none;flex-wrap:wrap}
.sheet-foot .btn-ghost,.sheet-foot .btn-primary{height:46px}
.sheet .close{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text-3)}
.sheet .close:hover{background:var(--bg-3);color:var(--text)}
.sheet .close svg{width:16px;height:16px}
@media (min-width:640px){
  .sheet-mask{align-items:center}
  .sheet{border-radius:18px;max-height:82vh}
  @keyframes sheetUp{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
}

.field{margin:12px 0}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
/* 导入源码框标题行：清空按钮靠右，和标题同一行 */
.iclabelrow{display:flex;align-items:center;justify-content:space-between}
.iclabelrow label{margin-bottom:6px}
.svgimp-clear{border:0;background:var(--bg-2);color:var(--text-2);font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px;margin-bottom:6px;min-height:26px;cursor:pointer}
.svgimp-clear:hover{background:var(--brand-soft);color:var(--brand)}
/* 导入 SVG：识别结果用小字放在标签行，三个按钮等宽不换行 */
.svgimp-hint{font-size:11.5px;font-weight:500;color:var(--text-3);margin-left:6px}
.svgimp-kinds{display:flex;gap:8px}
.svgimp-kinds .btn-ghost{flex:1;min-width:0;height:42px;padding:0 6px;font-size:13px;white-space:nowrap;justify-content:center}
.svgimp-kinds .btn-ghost.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:700}
.svgimp-preview{position:relative;margin-top:10px;min-height:66px;max-height:170px;overflow:auto;border:1px dashed var(--line);border-radius:12px;background:#faf9f6;display:flex;align-items:center;justify-content:center;padding:10px}
.svgimp-preview.pv-light{background:#faf9f6}
.svgimp-preview.pv-dark{background:#1f2937}
.svgimp-preview .pv-inner{display:flex;align-items:center;justify-content:center;width:100%;min-width:0;max-height:148px}
.svgimp-preview img{display:block;max-width:100%;width:auto;height:auto;max-height:148px;object-fit:contain}
/* 切换底色只改变预览背景，主体（图标/进度条）保持原样，不做反色 */
.svgimp-preview .pv-ph{font-size:11.5px;color:var(--text-3)}
.svgimp-preview.pv-dark .pv-ph{color:#9aa6b6}
/* 预览底色切换按钮：贴在预览区右上角 */
.pv-bgbtn{position:absolute;top:6px;right:6px;z-index:2;height:26px;padding:0 9px;border-radius:8px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--text-2);font-size:11px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.pv-bgbtn:active{transform:scale(.96)}
.input,.textarea,.select{
  width:100%;border:1px solid var(--line-2);background:var(--bg-2);
  border-radius:14px;padding:11px 13px;font-size:14.5px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.input:focus,.textarea:focus,.select:focus{border-color:color-mix(in srgb,var(--brand) 45%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 12%,transparent)}
.textarea{resize:vertical;min-height:84px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.hint{font-size:11.5px;color:var(--text-3);margin-top:6px;line-height:1.6}
.hint code{background:var(--bg-3);padding:1px 6px;border-radius:6px;font-size:11px}

.import-list{display:flex;flex-direction:column;gap:9px;max-height:38vh;overflow-y:auto;margin-top:10px}
.imp-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:16px;background:var(--bg-2);box-shadow:var(--shadow)}
.imp-row .ico{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:700}
.imp-row .txt{flex:1;min-width:0}
.imp-row .t1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-row .t2{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-row .sz{font-size:11.5px;color:var(--text-3);flex:none;font-variant-numeric:tabular-nums}

.menu{position:fixed;z-index:90;min-width:190px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow-lg);padding:6px;display:none;animation:fadeIn .12s}
.menu.on{display:block}
/* 菜单打开时让查看器 iframe 不截获点击：iframe(sandbox) 内部点击不冒泡到父文档，
   否则点进度条区域无法关闭 ⋯ 菜单。穿透后由 document 的 click 监听统一收起菜单 */
body.menu-open .viewer iframe{pointer-events:none}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border-radius:11px;font-size:13.5px;color:var(--text);text-align:left}
.menu button:hover{background:var(--bg-3)}
.menu button.danger{color:var(--danger)}
.menu button svg{width:15px;height:15px;color:var(--text-3);flex:none}
.menu button.danger svg{color:var(--danger)}
.menu .sep{height:1px;background:var(--line);margin:4px 8px}

/* ============ Toast ============ */
.toasts{position:fixed;z-index:100;left:50%;transform:translateX(-50%);
  bottom:calc(22px + var(--safe-b));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{
  background:color-mix(in srgb,var(--text) 92%,transparent);color:var(--bg);
  padding:9px 14px;border-radius:11px;font-size:13px;font-weight:520;
  box-shadow:var(--shadow-lg);animation:toastIn .22s cubic-bezier(.2,.8,.2,1);
  max-width:100%;text-align:center;line-height:1.45;
}
html[data-theme="dark"] .toast,body.dark .toast{background:color-mix(in srgb,#eef1f6 94%,transparent);color:#141821}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .18s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.97)}}

/* 说明页 */
.doc{max-width:720px}
.doc h2{font-size:15px;margin:22px 0 8px;font-weight:640}
.doc h2:first-child{margin-top:4px}
.doc p,.doc li{font-size:13.5px;color:var(--text-2);line-height:1.7}
.doc ol,.doc ul{padding-left:20px;margin:6px 0}
.doc li{margin:3px 0}
.doc .kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--bg-3);border:1px solid var(--line);font-size:11.5px;color:var(--text-2);font-family:ui-monospace,Menlo,monospace}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:var(--brand-soft);color:var(--text-2);font-size:12.5px;line-height:1.65;margin:10px 0}
.note svg{width:15px;height:15px;flex:none;color:var(--brand);margin-top:2px}

@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,1fr);column-gap:10px;row-gap:0}
  .card .meta{padding:13px 12px}
  .card .name{font-size:14px;padding-right:24px}
  .card .more{top:10px;right:10px}
  .brand .sub{display:none}
  .btn-primary .lbl-txt{display:none}
  .btn-primary{padding:0;width:38px;justify-content:center}
  .seg button{padding:6px 9px;font-size:12.5px}
  .statline{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>
      </div>
      <div style="min-width:0">
        <div class="sub" id="brandSub">HTMLBOX · 单文件工作台</div>
        <h1>收纳盒</h1>
      </div>
    </div>
    <button class="iconbtn" id="btnSkin" title="切换主题" aria-label="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.1 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-4-4-7.3-9-7.3Z"/><circle cx="7.5" cy="11.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="10.5" cy="7.8" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="8.5" r="1.2" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="iconbtn" id="btnSettings" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.35a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09c0 .68.4 1.3 1.03 1.56a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.63.88 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03Z"/></svg>
    </button>
    <button class="iconbtn" id="btnExport" title="导出备份" aria-label="导出备份">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
    </button>
    <button class="btn-primary" id="btnAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="lbl-txt">添加</span>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <label class="search">

<script>

function showErrBar(msg){
  try{
    // 同类错误 30 秒内只弹一次，避免刷屏
    var now=Date.now();
    if(showErrBar._last&&showErrBar._last.msg===msg&&now-showErrBar._last.t<30000)return;
    showErrBar._last={msg:msg,t:now};
    var bar=document.getElementById("errbar");
    if(!bar){
      bar=document.createElement("div");
      bar.id="errbar";

      var closeB=document.createElement("span");

      closeB.onclick=function(){ bar.remove(); showErrBar._muted=showErrBar._muted||{}; showErrBar._muted[msg.split(" @")[0]]=1; };
      bar.appendChild(closeB);

      txt.id="errbar-txt";
      bar.appendChild(txt);
      (document.body||document.documentElement).appendChild(bar);
    }

    var key=(msg||"").split(" @")[0];

    if(showErrBar._muted[key])return;

}

/* ---------------------- 基础工具 ---------------------- */
var $=function(s,r){return (r||document).querySelector(s)};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* ---------------------- 存储 ---------------------- */
function stripItem(it){
  // 内容(html/svg)不进 localStorage（体积大），只保留元数据；内容存 IndexedDB
  var o=Object.assign({},it);delete o.html;delete o.svg;delete o._url;delete o.cover;

/* 盒中盒内部文件在 IndexedDB 里的键：包id::内部id */
function innerKey(bid,iid){return bid+"::"+iid}
/* ---- IndexedDB 内容仓：容量远大于 localStorage ---- */
var CDB_NAME="htmlbox-db",CDB_STORE="html";
function cdb(){
  return new Promise(function(res,rej){
    try{
      var r=indexedDB.open(CDB_NAME,1);
      r.onupgradeneeded=function(){ try{r.result.createObjectStore(CDB_STORE)}catch(e){} };
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error)};
    }catch(e){rej(e)}
  });
}
function cdbPutAll(map){
  if(!Object.keys(map).length)return Promise.resolve(true);
  return cdb().then(function(db){ return new Promise(function(res,rej){
    try{
      var tx=db.transaction(CDB_STORE,"readwrite"),st=tx.objectStore(CDB_STORE);
      Object.keys(map).forEach(function(k){ st.put(map[k],k) });
      tx.oncomplete=function(){res(true)}; tx.onerror=function(){rej(tx.error)};
    }catch(e){rej(e)}
  })});
}
function cdbAll(){ return cdb().then(function(db){ return new Promise(function(res){
  try{
    var tx=db.transaction(CDB_STORE,"readonly"),st=tx.objectStore(CDB_STORE),out={};
    var q=st.openCursor();
    q.onsuccess=function(){ var c=q.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); };
    q.onerror=function(){res({})};
  }catch(e){res({})}
})}).catch(function(){return {}}); }
function cdbDel(ids){
  if(!ids||!ids.length)return Promise.resolve(false);
  return cdb().then(function(db){ return new Promise(function(res){
    try{
      var tx=db.transaction(CDB_STORE,"readwrite"),st=tx.objectStore(CDB_STORE);
      ids.forEach(function(k){ try{st.delete(k)}catch(e){} });
      tx.oncomplete=function(){res(true)}; tx.onerror=function(){res(false)};
    }catch(e){res(false)}
  })}).catch(function(){return false});
}
function save(){
  // localStorage 只存元数据（很小，基本不会超配额）；内容异步写入 IndexedDB

    localStorage.setItem(LS_KEY,JSON.stringify(data));
    okLS=true;
  }catch(e){ console.warn("save meta failed",e); }
  var map={};
  DB.items.forEach(function(it){
    if(it.type==="embed"&&it.html)map[it.id]=it.html;
    if(it.type==="progress"&&it.svg)map[it.id]=it.svg;
    if(it.type==="icon"&&it.svg)map[it.id]=it.svg;
    if((it.type==="progress"||it.type==="icon")&&it.cover)map[it.id+"@cover"]=it.cover;   /* 自定义封面也是大字段，走 IndexedDB */
    if(it.type==="bundle"&&Array.isArray(it.items)){
      it.items.forEach(function(x){
        var c=x.type==="progress"||x.type==="icon"?x.svg:x.html;
        if(x&&x.id&&c)map[innerKey(it.id,x.id)]=c;
      });
    }
  });

      if(it.type==="bundle"&&Array.isArray(it.items))it.items.forEach(function(x){if(x&&x.id)keep[innerKey(it.id,x.id)]=1});
    });

      var dead=Object.keys(all).filter(function(k){return !keep[k]});

function hydrate(){
  // 启动时把 IndexedDB 里存的内容填回各工具（含盒中盒的内部文件）
  return cdbAll().then(function(all){
    var changed=false;
    DB.items.forEach(function(it){
      if(!it.html&&all[it.id]){ it.html=all[it.id]; changed=true; }
      if(!it.svg&&all[it.id]&&(it.type==="progress"||it.type==="icon")){ it.svg=all[it.id]; changed=true; }
      if(!it.cover&&(it.type==="progress"||it.type==="icon")&&all[it.id+"@cover"]){ it.cover=all[it.id+"@cover"]; changed=true; }
      if(it.type==="bundle"&&Array.isArray(it.items)){
        it.items.forEach(function(x){
          if(!x||!x.id)return;
          var c=all[innerKey(it.id,x.id)];
          if(c==null)return;
          if((x.type==="progress"||x.type==="icon")&&!x.svg){x.svg=c;changed=true}
          else if(x.type!=="progress"&&x.type!=="icon"&&!x.html){x.html=c;changed=true}

    });

  }).catch(function(){});
}
function load(){

  if(seeded&&seeded.items&&seeded.items.length){ fromSeed=seeded.items.map(normalize) }
  var fromStore=[];
  if(stored&&Array.isArray(stored.items)){ fromStore=stored.items.map(normalize) }
  if(seeded&&seeded.settings){ DB.settings=Object.assign(DB.settings,seeded.settings) }
  if(stored&&stored.settings){ DB.settings=Object.assign(DB.settings,stored.settings) }

  // 合并：store 的条目优先（用户在现场编辑/删除过），seed 里被删掉的要记住
  var removed=DB.settings.removedSeed||[];
  var map={};
  fromStore.forEach(function(it){map[it.id]=it});
  var list=[];
  fromSeed.forEach(function(it){
    // seed 内嵌内容体积大，不进 localStorage；若 store 有同名记录则合并元数据
    if(map[it.id]){
      var m=Object.assign({},it,map[it.id]);
      if(it.html){m.html=it.html}       // 内容以 seed 为准（最新构建）
      m._url=null;
      list.push(m);
    }else if(removed.indexOf(it.id)<0){
      list.push(it);
    }
  });
  fromStore.forEach(function(it){ if(!list.some(function(x){return x.id===it.id})){ it._url=null; list.push(it) } });

function normalize(it){
  it=Object.assign({
    id:uid(), name:"未命名", desc:"", tags:[], type:"embed",

  },it);

  if(typeof it.name!=="string")it.name=String(it.name==null?"":it.name);
  if(typeof it.desc!=="string")it.desc=String(it.desc==null?"":it.desc);
  if(typeof it.path!=="string")it.path=String(it.path||"");
  if(typeof it.html!=="string")it.html=String(it.html||"");
  if(!Array.isArray(it.tags)){
    it.tags=typeof it.tags==="string"?it.tags.split(/[,，]/):[];
  }
  it.tags=it.tags.filter(function(t){return typeof t==="string"});
  /* 制作者：单个名字字符串，空值删除字段 */
  if(it.maker!=null){it.maker=String(it.maker).trim().slice(0,20);if(!it.maker)delete it.maker}

  if(it.type==="progress"){ if(it.scope!=="chapter"&&it.scope!=="full"&&it.scope!=="deco")it.scope="full" }
  else if(it.scope!=null)delete it.scope;
  it.size=Number(it.size)||0;
  if(it.type==="bundle"&&!Array.isArray(it.items))it.items=[];
  if(it.folder!=null&&typeof it.folder!=="string")it.folder=String(it.folder);
  return it;
}

/* ---------------------- 主题 ---------------------- */
/* 取色工具：hex 混合 / 明暗判断 */
function _hx(c){c=String(c||"").replace("#","");if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];return [parseInt(c.slice(0,2),16)||0,parseInt(c.slice(2,4),16)||0,parseInt(c.slice(4,6),16)||0]}
function _rh(a){return "#"+a.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return v.toString(16).padStart(2,"0")}).join("")}
function mixHex(a,b,t){var x=_hx(a),y=_hx(b);return _rh([x[0]+(y[0]-x[0])*t,x[1]+(y[1]-x[1])*t,x[2]+(y[2]-x[2])*t])}
function isDark(hex){var c=_hx(hex);return (c[0]*299+c[1]*587+c[2]*114)/1000<130}
function isHex(v){return /^#[0-9a-fA-F]{6}$/.test(String(v||""))}
/* 注意：DB.settings.theme 存的是主题 key；custom 主题的下标是 custom-0/1/2 */
function applyTheme(){
  var t=DB.settings.theme||"auto";
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  // 先清掉上一次自定义主题留下的行内变量，避免串色
  ["--bg","--bg-2","--bg-3","--text","--text-2","--text-3","--brand","--brand-2","--brand-soft"].forEach(function(k){
    document.documentElement.style.removeProperty(k);
  });
  var dark;
  var ci=customIndex(t);
  if(ci>=0){
    var ct=customList()[ci];
    var cfg=skinVars(ct.bg,ct.brand);
    Object.keys(cfg).forEach(function(k){document.documentElement.style.setProperty(k,cfg[k])});
    dark=cfg.__dark;
    document.documentElement.setAttribute("data-theme",ct.dark?"custom-dark":"custom-light");
  }else{
    dark=DARK_SKINS.indexOf(t)>=0||(t==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);
    document.documentElement.removeAttribute("data-custom");
  }
  document.body.classList.toggle("dark",dark);
  var cs=getComputedStyle(document.documentElement);
  var bg=cs.getPropertyValue("--bg").trim()||(dark?"#12141f":"#eceffb");
  document.documentElement.style.setProperty("--theme-color",bg);
  // 状态栏 / 浏览器标签色：统一取当前主题底色，不再硬编码深色主题的突兀色值
  var mt=document.querySelectorAll('meta[name="theme-color"]');
  for(var i=0;i<mt.length;i++)mt[i].setAttribute("content",bg);
}
/* 由「底色 + 强调色」推导整套变量 */
function skinVars(bg,brand){
  if(!isHex(bg))bg="#eceffb";
  if(!isHex(brand))brand=isDark(bg)?"#8fa6f5":"#5a5fd8";
  var dark=isDark(bg);
  bg=bg.toLowerCase();brand=brand.toLowerCase();
  var to=dark?"#ffffff":"#000000";
  var brandMix=function(t){return mixHex(brand,to,t)};
  var o={
    "--bg":bg,
    "--bg-2":mixHex(bg,dark?"#ffffff":"#ffffff",dark?0.07:0.72),
    "--bg-3":mixHex(bg,dark?"#ffffff":"#000000",dark?0.13:0.07),
    "--brand":brand,
    "--brand-2":brandMix(dark?0.18:0.16),
    "--brand-soft":mixHex(bg,brand,dark?0.28:0.16),
    "--text":mixHex(dark?"#ffffff":"#101322",bg,dark?0.05:0.06),
    "--text-2":mixHex(bg,dark?"#ffffff":"#101322",dark?0.62:0.62),
    "--text-3":mixHex(bg,dark?"#ffffff":"#101322",dark?0.44:0.44),
    "--line":dark?"rgba(210,218,255,.14)":"rgba(60,70,110,.11)",
    "--line-2":dark?"rgba(210,218,255,.22)":"rgba(60,70,110,.18)"
  };
  o.__dark=dark;
  return o;
}

/* 自定义主题：最多存 5 个，key 为 custom-0 ~ custom-4 */
var CUSTOM_MAX=5;
function customList(){
  if(!Array.isArray(DB.settings.customTheme))DB.settings.customTheme=[];
  return DB.settings.customTheme;
}
function customIndex(t){
  var m=/^custom-(\d+)$/.exec(String(t||""));
  if(!m)return -1;
  var i=+m[1];return i<customList().length?i:-1;
}
function skinHTML(){
  var cur=DB.settings.theme||"auto";
  // 夜航蓝虽是深色，但排在紫蓝系里更顺手；这里仍归到深色组，靠 key 过滤
  // 按色系排序：中性米白 → 暖色（粉/红/黄）→ 绿 → 青 → 蓝 → 紫 → 深色
  var GROUPS=[
    {t:"浅色",   keys:["sand","tea","cocoa","sakuragray","cream","blush","guava","matchberr","hongxian","junlan","amber","creamblue","butter","qingmei","pond","honeydew","celadon","manbo","choco","wine","mutedteal","blilac","lilac","indigo","twilight","bluepink","grape","zhusha","fluortea","heqing"]},
    {t:"深色",   keys:DARK_SKINS}
  ];
  var byKey={};SKINS.forEach(function(x){byKey[x.v]=x});
  var used={};
  var groups=[{t:"",list:SKINS.slice(0,1)}];
  GROUPS.forEach(function(g){
    var list=g.keys.map(function(k){return byKey[k]}).filter(Boolean);
    list.forEach(function(x){used[x.v]=1});
    if(list.length)groups.push({t:g.t,list:list});
  });
  var rest=SKINS.slice(1).filter(function(x){return !used[x.v]});
  if(rest.length)groups.push({t:"其他",list:rest});
  var html='<div class="skins">';
  groups.forEach(function(g){
    if(g.t&&g.list.length)html+='<div class="grp">'+g.t+"</div>";
    g.list.forEach(function(s){
      var on=(cur===s.v);
      html+='<button class="swatch'+(on?" on":"")+'" data-act="skin" data-v="'+s.v+'" title="'+s.name+'">'+
        '<span class="dot"><i class="a" style="background:'+s.c1+'"></i><i class="b" style="background:'+s.c2+'"></i></span>'+
        '<span class="nm">'+s.name+'</span>'+(on?'<span class="ck">✓</span>':"")+'</button>';
    });
  });
  html+="</div>";
  // 自定义主题
  var cl=customList();
  html+='<div class="grp" style="font-size:11.5px;font-weight:700;color:var(--text-3);letter-spacing:.06em;margin:14px 0 0">我的配色</div>';
  if(cl.length){
    cl.forEach(function(c,i){
      var key="custom-"+i,on=(cur===key);
      html+='<div class="cusrow'+(on?" on":"")+'" data-act="skin" data-v="'+key+'" style="margin-top:8px">'+
        '<span class="prev"><i class="a" style="background:'+c.bg+'"></i><i class="b" style="background:'+c.brand+'"></i></span>'+
        '<span class="tt"><b>配色 '+(i+1)+(on?" ✓":"")+'</b><span>'+c.bg.toUpperCase()+" · "+c.brand.toUpperCase()+'</span></span>'+
        '<button class="go" data-act="custom-edit" data-i="'+i+'">编辑</button>'+
        '</div>';
    });
  }
  html+='<div class="cusacts"><button class="pri" data-act="custom-new">+ 新建自定义配色</button></div>';
  return html;
}
function setSkin(v){

    '<p class="hint">最多保存 '+CUSTOM_MAX+' 个配色，可随时回来编辑或删除。</p>'+
    '</div>';
  openSheet(d.idx==null?"新建自定义配色":"编辑自定义配色",body,
    '<button class="btn-ghost" data-act="skin">返回主题</button>'+
    (d.idx!=null?'<button class="btn-ghost" data-act="custom-del" style="max-width:96px">删除</button>':"")+
    '<button class="btn-primary" style="width:auto;padding:0 16px" data-act="custom-save">保存</button>');
  var bg=$("#cusBg"),br=$("#cusBrand"),pr=$("#cusPreset");
  function drawPrev(){
    var v=skinVars(bg.value,br.value);
    var p=$("#cusPrev");
    if(!p)return;
    p.style.background=v["--bg"];
    p.style.borderColor=v["--line-2"];
    p.innerHTML='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'+
      '<span style="width:34px;height:34px;border-radius:12px;background:'+v["--brand"]+'"></span>'+
      '<b style="color:'+v["--text"]+';font-size:15px">收纳盒</b>'+
      '<span style="margin-left:auto;background:'+v["--brand"]+';color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px">添加</span></div>'+
      '<div style="background:'+v["--bg-2"]+';border:1px solid '+v["--line"]+';border-radius:12px;padding:11px 12px">'+
      '<div style="color:'+v["--text"]+';font-size:13.5px;font-weight:650">计算器</div>'+
      '<div style="color:'+v["--text-3"]+';font-size:11.5px;margin-top:2px">支持键盘的四则运算 · 已打包</div></div>';
  }
  bg.addEventListener("input",function(){cusDraft.bg=this.value;drawPrev()});
  br.addEventListener("input",function(){cusDraft.brand=this.value;drawPrev()});
  pr.addEventListener("change",function(){
    if(this.value==="")return;
    var p=PRESET_PAIRS[+this.value];bg.value=p[0];br.value=p[1];
    cusDraft.bg=p[0];cusDraft.brand=p[1];drawPrev();
  });
  drawPrev();
}
function saveCustomSkin(){
  var d=cusDraft;if(!d)return;
  var cl=customList();
  var rec={bg:d.bg,brand:d.brand,dark:isDark(d.bg)};
  if(d.idx!=null)cl[d.idx]=rec;
  else{
    if(cl.length>=CUSTOM_MAX){toast("最多保存 "+CUSTOM_MAX+" 个配色，先编辑或删除一个",2400);return}
    cl.push(rec);
  }
  DB.settings.theme="custom-"+(d.idx!=null?d.idx:cl.length-1);
  customList(cl);save();applyTheme();forceRepaint();
  cusDraft=null;showSkinSheet();
  toast("已应用自定义配色",1600);
}
function delCustomSkin(){
  var d=cusDraft;if(!d||d.idx==null)return;
  var cl=customList();cl.splice(d.idx,1);
  var cur=customIndex(DB.settings.theme);
  if(cur>=cl.length||cur===d.idx)DB.settings.theme="light";
  save();applyTheme();forceRepaint();
  cusDraft=null;showSkinSheet();
}

function folders(){return DB.settings.folders||(DB.settings.folders=[])}
function folderName(id){
  var f=folders().find(function(x){return x.id===id});
  return f?f.name:"";
}
/* ---- 子文件夹层级 ---- p=父文件夹id，undefined/null=根级 ---- */
function rootFolders(){return folders().filter(function(f){return !f.p})}
function childFolders(pid){return folders().filter(function(f){return f.p===pid})}
function folderPath(fid){
  var out=[],f=folders().find(function(x){return x.id===fid}),guard=0;
  while(f&&guard++<12){out.unshift(f);f=folders().find(function(x){return x.id===f.p})}
  return out;
}
function folderDepth(fid){return folderPath(fid).length-1}
function descendantFolderIds(fid){
  var out=[],stack=[fid];
  while(stack.length){
    var cur=stack.shift();
    folders().forEach(function(f){if(f.p===cur){out.push(f.id);stack.push(f.id)}});
  }
  return out;
}
function subCount(fid){
  return DB.items.filter(function(it){return it.folder===fid}).length+childFolders(fid).length;
}
/* 同级内交换文件夹位置（dir=-1 左移 / +1 右移） */
function swapFolder(fid,dir){
  var f=folders().find(function(x){return x.id===fid});if(!f)return;
  var sib=folders().filter(function(x){return (x.p||null)===(f.p||null)});
  var i=sib.indexOf(f),j=i+dir;
  if(i<0||j<0||j>=sib.length)return;
  var tmp=sib[i];sib[i]=sib[j];sib[j]=tmp;
  /* 新顺序写回 folders() 原槽位 */
  var order={};sib.forEach(function(x,k){order[x.id]=k});
  var slots=folders().map(function(x,k){return order[x.id]!=null?k:-1}).filter(function(k){return k>=0});
  slots.forEach(function(gi,k){folders()[gi]=sib[k]});
  save();render();
}
/* 拖拽提交：按 DOM 顺序重排同级文件夹 */
function commitFolderOrder(ids){
  /* ids：DOM 顺序里的文件夹 id 列表（同一容器内） */
  var f0=folders().find(function(x){return x.id===ids[0]});
  if(!f0)return;
  var p=f0.p||null;
  var sib=ids.filter(function(id){
    var f=folders().find(function(x){return x.id===id});
    return f&&(f.p||null)===p;
  });
  if(sib.length<2){save();render();return}
  /* 同级成员按 sib 顺序写回它们在 folders() 里的原有槽位 */
  var order={};sib.forEach(function(id,k){order[id]=k});
  var members=sib.map(function(id){return folders().find(function(x){return x.id===id})});
  var slots=folders().map(function(x,k){return order[x.id]!=null?k:-1}).filter(function(k){return k>=0});
  slots.forEach(function(gi,k){folders()[gi]=members[k]});
  save();render();
}

/* 手动排序值：没有 ord 的用导入时间，保证打开时顺序不变 */
function itemOrd(it){return it.ord!=null?it.ord:(it.addedAt||0)}
/* 置顶项始终排最前，其余按手动顺序；整理模式下不掺入置顶，保证「拖动所见即所得」 */
function sortByOrd(arr){
  var org=typeof extOrgPage!=="undefined"&&!!extOrgPage;
  return arr.slice().sort(function(a,b){
    if(!org){
      if(!!b.pinned!==!!a.pinned)return b.pinned?1:-1;
      if(a.pinned&&b.pinned){var pa=a.pinnedAt||0,pb=b.pinnedAt||0;if(pb!==pa)return pb-pa;}
    }
    return itemOrd(a)-itemOrd(b);
  });
}

function bundleHits(q){
  q=String(q||"").trim().toLowerCase();
  if(!q)return [];
  var out=[];
  DB.items.forEach(function(b){
    if(!b||b.type!=="bundle"||!Array.isArray(b.items))return;
    b.items.forEach(function(x){
      if(!x)return;
      var hay=(String(x.name||"")+" "+(x.tags||[]).join(" ")+" "+String(x.pgroup||"")+" "+
        String(x.path||"")+" "+kindTagText(x)+" "+folderName(x.folder||"")).toLowerCase();
      if(hay.indexOf(q)>=0)out.push({bundle:b,it:x});
    });
  });
  return out;
}

function visibleItems(){
  var q=state.q.trim().toLowerCase();

  if(state.mine){
    /* 我的工具：只显示标记过的，不与分类文件夹混合；支持分组筛选 */
    base=DB.items.filter(function(it){
      if(!it.mine||it.type==="progress"||it.type==="icon")return false;
      if(state.mineGrp==="ug"){ if(String(it.pgroup||"").trim())return false }
      else if(state.mineGrp!=="all"&&String(it.pgroup||"").trim()!==state.mineGrp)return false;
      return true;
    });
  }else{
    base=DB.items.filter(function(it){
      if(it.type==="progress")return false; /* 进度条只显示在进度条库 */
      if(it.type==="icon")return false;     /* 图标只显示在图标库 */
      /* 加入「我的工具」的条目平时不在全部里出现（搜索时仍可搜到） */
      if(it.mine&&!q)return false;
      if(state.folder==="__none__"){ if(it.folder)return false }
      else if(state.folder&&(it.folder||"")!==state.folder)return false;
      if(state.filter==="embed"&&it.type!=="embed")return false;
      if(state.filter==="ref"&&it.type!=="ref")return false;
      if(state.filter==="bundle"&&it.type!=="bundle")return false;
      return true;
    });
  }
  if(q)base=base.filter(function(it){
    var hay=(String(it.name||"")+" "+(it.tags||[]).join(" ")+" "+String(it.pgroup||"")+" "+
      String(it.path||"")+" "+kindTagText(it)+" "+(it.mine?"我的工具":"")+" "+
      folderName(it.folder||"")).toLowerCase();
    return hay.indexOf(q)>=0;
  });
  return base.sort(function(a,b){
    if(!!b.pinned!==!!a.pinned)return b.pinned?1:-1;
    if(a.pinned&&b.pinned){var pa=a.pinnedAt||0,pb=b.pinnedAt||0;if(pb!==pa)return pb-pa;}

  });

/* 瀑布流：按卡片内容高度分配行 span，保持列内行距一致（间隙约 12-15px） */
function layoutMasonry(){
  document.querySelectorAll("#appList .grid, #mineList").forEach(function(g){
    if(!g.classList.contains("grid")||g.classList.contains("grid3"))return;
    var cs=getComputedStyle(g);
    var unit=parseFloat(cs.gridAutoRows)||4;
    var rg=parseFloat(cs.rowGap)||0;
    var step=unit+rg;
    /* 我的工具卡片视图上下留白更宽松，避免两行卡片贴得太紧 */
    var gapPx=(g.id==="mineList")?22:12;
    for(var i=0;i<g.children.length;i++){
      var c=g.children[i];
      var h=c.getBoundingClientRect().height;
      if(h)c.style.gridRowEnd="span "+Math.max(10,Math.ceil((h+gapPx)/step));
    }
  });
}
window.addEventListener("resize",function(){
  if(viewMode()==="card")layoutMasonry();
  layoutPgMasonry();
  if($("#starPage")&&$("#starPage").classList.contains("on"))layoutPgMasonry("starList");
});
/* 通用：记录当前打开的独立页滚动位置，render 重建列表后还原，避免收藏 / 置顶 / 移库等操作后跳回顶部。
   以页面 id 为键存每个 .extpage-body 的 scrollTop；重绘后同步还原一次，瀑布流布局后再补一次。 */
function _snapshotPageScroll(){
  var m={};
  ["pgPage","starPage","minePage","iconPage","boxPage"].forEach(function(pid){
    var pg=document.getElementById(pid);
    if(!pg||!pg.classList.contains("on"))return;
    var b=pg.querySelector(".extpage-body");
    if(b)m[pid]=b.scrollTop;
  });
  return m;
}
function _restorePageScroll(m){
  if(!m)return;
  Object.keys(m).forEach(function(pid){
    var pg=document.getElementById(pid);
    if(!pg||!pg.classList.contains("on"))return;
    var b=pg.querySelector(".extpage-body");
    if(b)b.scrollTop=m[pid];
  });
}
/* 从一个库页切到另一个库页时，目标页跳过 viewIn 入场动画（避免整页淡入淡出的“闪一下”）。
   需在给目标页加 on 之前调用：此时来源页仍带 on。 */
function _swapExtPage(targetId){
  var target=document.getElementById(targetId);if(!target)return;
  var switching=["pgPage","starPage","minePage","iconPage","boxPage"].some(function(pid){
    return pid!==targetId&&document.getElementById(pid)&&document.getElementById(pid).classList.contains("on");
  });
  if(switching)target.classList.add("pg-swap");
  else target.classList.remove("pg-swap");
}
function render(){
  var _scroll=_snapshotPageScroll();   /* 重绘前先存各独立页滚动位置 */
  applyTheme();
  syncExtEntries();
  renderBody();
  syncMainSearchState();
  // 独立页开着时同步刷新内容（例如在页内删除/重命名了进度条）
  if($("#pgPage").classList.contains("on"))renderPgPage();
  if($("#starPage")&&$("#starPage").classList.contains("on"))renderStarPage();
  if($("#boxPage").classList.contains("on")&&curBundle)renderBoxPage();
  if($("#minePage").classList.contains("on"))renderMinePage();
  if($("#iconPage").classList.contains("on"))renderIconPage();
  _restorePageScroll(_scroll);         /* 立即还原；瀑布流重排会改高度，稍后再补一次 */
  setTimeout(function(){ _restorePageScroll(_scroll) },40);
  // WKWebView 偶发不绘制新插入的列表内容，每次渲染后强制触发一次重绘
  setTimeout(forceRepaint,30);
  setTimeout(forceRepaint,300);
  setTimeout(function(){ if(viewMode()==="card")layoutMasonry() },350);
}

// 优先用 srcdoc 直接注入内容——不依赖 blob: 地址，App 内置浏览器/iOS 预览也能显示
function loadFrame(it){
  var f=$("#frame");
  f.setAttribute("sandbox","allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-downloads allow-pointer-lock allow-orientation-lock allow-presentation allow-top-navigation-by-user-activation");
  if(it.type==="embed"&&it.html){
    f.removeAttribute("src");
    try{ f.srcdoc=it.html }catch(e){ f.srcdoc=it.html }
    return true;
  }
  if(it.type==="progress"&&it.svg){
    f.removeAttribute("src");
    try{ f.srcdoc=buildProgressDoc(it) }catch(e){ f.srcdoc=buildProgressDoc(it) }
    return true;
  }
  if(it.type==="ref"&&it.path){
    // 关键：必须先移除 srcdoc，否则 srcdoc(空文档) 优先于 src，页面会一直白屏
    f.removeAttribute("srcdoc");
    f.src=it.path;
    return true;
  }
  return false;
}

  if(isWebLink(it)){

    if(skipHost(it.path)){
      it.lastOpen=Date.now();save();
      try{window.open(it.path,"_blank","noopener")}catch(e){}

/* ============ 进度条库 / 盒中盒 独立整页 ============ */
/* 分组：存放在条目的 pgroup 字段（进度条、图标通用） */
function groupNames(type){
  var seen={},out=[];
  DB.items.forEach(function(x){
    var ok=type==="mine"?(!!x.mine&&x.type!=="progress"&&x.type!=="icon"):x.type===type;
    if(!ok)return;
    var g=String(x.pgroup||"").trim();
    if(g&&!seen[g]){seen[g]=1;out.push(g)}
  });
  return out;
}
/* 置顶分组：只让选中的几个固定显示在页面分段栏，其余收进「展开筛选」弹层。
   DB.settings.pinnedGroups[page] 为数组时生效；没有设置（undefined）则显示全部（默认行为）。 */
function pinnedGroups(page){
  var m=DB.settings.pinnedGroups;
  return (m&&Array.isArray(m[page]))?m[page]:null;
}
/* 用户拖动后的分组顺序：DB.settings.groupOrder[page] */
function groupOrderApply(page,gs){
  var ord=DB.settings.groupOrder&&DB.settings.groupOrder[page];
  if(!Array.isArray(ord)||!ord.length)return gs;
  var seen={},out=[];
  ord.forEach(function(g){if(gs.indexOf(g)>=0&&!seen[g]){seen[g]=1;out.push(g)}});
  gs.forEach(function(g){if(!seen[g]){seen[g]=1;out.push(g)}});
  return out;
}
/* 分组筛选页对应的条目集合（盒中盒取自当前打开的包） */
function gfItems(page){
  if(page==="box")return (curBundle&&Array.isArray(curBundle.items))?curBundle.items:[];
  if(page==="mine")return DB.items.filter(function(x){return x.mine&&x.type!=="progress"&&x.type!=="icon"});
  if(page==="icon")return DB.items.filter(function(x){return x.type==="icon"});
  return DB.items.filter(function(x){return x.type==="progress"});
}
function gfGroups(page){
  var seen={},out=[];
  gfItems(page).forEach(function(x){var g=String(x.pgroup||"").trim();if(g&&!seen[g]){seen[g]=1;out.push(g)}});
  var ex=DB.settings.extraGroups&&DB.settings.extraGroups[page];
  if(Array.isArray(ex))ex.forEach(function(g){g=String(g||"").trim();if(g&&!seen[g]){seen[g]=1;out.push(g)}});
  out=groupOrderApply(page,out);
  if(page==="box"){var _sp=boxSpecialGroups(out);out=out.filter(function(g){return _sp.indexOf(g)<0}).concat(_sp)}
  return out;
}
function gfGetCur(page){
  return page==="mine"?state.mineGrp:page==="icon"?iconState.grp:page==="box"?boxState.grp:pgState.grp;
}
function gfSetCur(page,val){

function gfRerender(page){

  else if(page==="icon")renderIconPage();

}
function grpChipsHTML(type,cur,attr,page){
  var gs=Array.isArray(type)?type:groupNames(type);
  if(page){
    var _ex=DB.settings.extraGroups&&DB.settings.extraGroups[page];
    if(Array.isArray(_ex))_ex.forEach(function(g){if(gs.indexOf(g)<0)gs.push(g)});
    gs=groupOrderApply(page,gs);
    var pin=pinnedGroups(page);
    if(pin&&pin.length){var seen={};gs.forEach(function(g){seen[g]=1});gs=pin.filter(function(g){return seen[g]})}
    /* 盒中盒：进度条 / 图标 特殊分组统一排到所有自定义分组之后（与分组筛选弹层一致） */
    if(page==="box"){var _sp=boxSpecialGroups(gs);gs=gs.filter(function(g){return _sp.indexOf(g)<0}).concat(_sp)}
  }

  h+='<button role="tab" data-'+attr+'="ug" aria-selected="'+(cur==="ug")+'">未分组</button>';
