<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#eceffb; --bg-2:#f6f7fd; --bg-3:#e2e6f4;
  --text:#1d2030; --text-2:#5c6178; --text-3:#9297ac;
  --line:rgba(93,98,160,.10); --line-2:rgba(93,98,160,.16);
  --brand:#5a5fd8; --brand-2:#767bef; --brand-soft:#e5e6fb;
  --danger:#e0525f; --danger-soft:#fdeaec;
  --ok:#2fa46b;
  --shadow:0 2px 6px rgba(90,95,180,.06),0 14px 34px -14px rgba(90,95,180,.16);
  --shadow-lg:0 18px 60px -16px rgba(70,74,150,.30);
  --r:24px; --r-sm:14px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12141f; --bg-2:#1a1d2c; --bg-3:#232739;
    --text:#eceef8; --text-2:#a3a9c2; --text-3:#737a96;
    --line:rgba(160,168,220,.12); --line-2:rgba(160,168,220,.2);
    --brand:#7c81f2; --brand-2:#979bfa; --brand-soft:#252a4a;
    --danger:#ff6b78; --danger-soft:#33202a;
    --ok:#43c98a;
    --shadow:0 2px 8px rgba(0,0,0,.25),0 16px 40px -16px rgba(0,0,0,.5);
    --shadow-lg:0 22px 64px -16px rgba(0,0,0,.7);
  }
}
html[data-theme="light"]{
  --bg:#eceffb; --bg-2:#f6f7fd; --bg-3:#e2e6f4;
  --text:#1d2030; --text-2:#5c6178; --text-3:#9297ac;
  --line:rgba(93,98,160,.10); --line-2:rgba(93,98,160,.16);
  --brand:#5a5fd8; --brand-2:#767bef; --brand-soft:#e5e6fb;
  --danger:#e0525f; --danger-soft:#fdeaec; --ok:#2fa46b;
  --shadow:0 2px 6px rgba(90,95,180,.06),0 14px 34px -14px rgba(90,95,180,.16);
  --shadow-lg:0 18px 60px -16px rgba(70,74,150,.30);
}
html[data-theme="dark"]{
  --bg:#12141f; --bg-2:#1a1d2c; --bg-3:#232739;
  --text:#eceef8; --text-2:#a3a9c2; --text-3:#737a96;
  --line:rgba(160,168,220,.12); --line-2:rgba(160,168,220,.2);
  --brand:#7c81f2; --brand-2:#979bfa; --brand-soft:#252a4a;
  --danger:#ff6b78; --danger-soft:#33202a; --ok:#43c98a;
  --shadow:0 2px 8px rgba(0,0,0,.25),0 16px 40px -16px rgba(0,0,0,.5);
  --shadow-lg:0 22px 64px -16px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  font-feature-settings:"tnum" 0;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brand);text-decoration:none}
::selection{background:color-mix(in srgb,var(--brand) 28%,transparent)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ============ 顶部栏 ============ */
.topbar{
  position:sticky; top:0; z-index:30;
  padding:calc(var(--safe-t) + 16px) calc(20px + var(--safe-r)) 14px calc(20px + var(--safe-l));
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px); backdrop-filter:saturate(180%) blur(24px);
  border-bottom:1px solid transparent; transition:border-color .2s;
}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{
  width:40px;height:40px;border-radius:14px;flex:none;
  background:linear-gradient(140deg,var(--brand),#8f7bf0);
  display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--brand) 65%,transparent);
}
.logo svg{width:21px;height:21px}
.brand h1{font-size:21px;font-weight:750;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:11px;color:var(--text-3);margin-top:0;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.iconbtn{
  width:44px;height:44px;border-radius:16px;display:grid;place-items:center;flex:none;
  color:var(--text-2);background:var(--bg-2);border:1px solid var(--line);
  box-shadow:var(--shadow);
  transition:transform .12s,background .15s,color .15s;
}
.iconbtn:hover{color:var(--text);background:var(--bg-3)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:19px;height:19px}
.btn-primary{
  height:46px;padding:0 20px;border-radius:999px;flex:none;
  background:linear-gradient(160deg,var(--brand),var(--brand-2));color:#fff;font-weight:650;font-size:14.5px;
  display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 10px 24px -8px color-mix(in srgb,var(--brand) 75%,transparent);
  transition:transform .12s,filter .15s;
}
.btn-primary:hover{filter:brightness(1.07)}
.btn-primary:active{transform:scale(.96)}
.btn-primary svg{width:17px;height:17px}
.btn-primary .lbl-txt{display:inline}

/* ============ 主体 ============ */
.wrap{max-width:1040px;margin:0 auto;padding:0 calc(16px + var(--safe-r)) calc(40px + var(--safe-b)) calc(16px + var(--safe-l))}
.toolbar{display:flex;gap:10px;align-items:center;padding:16px 0 10px}
.search{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;
  height:48px;padding:0 16px;border-radius:999px;background:var(--bg-2);
  border:1px solid var(--line);box-shadow:var(--shadow);
  transition:border-color .15s,box-shadow .15s;
}
.search:focus-within{border-color:color-mix(in srgb,var(--brand) 45%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 12%,transparent)}
.search svg{width:17px;height:17px;color:var(--text-3);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.search input::placeholder{color:var(--text-3)}
@media (max-width:700px){
  .toolbar{flex-wrap:wrap;row-gap:10px}
  .search{flex:1 1 100%;width:100%}
  .seg{order:2}
  #btnView,#btnList{order:3}
}
.seg{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex:none;box-shadow:var(--shadow)}
.seg button{padding:9px 14px;border-radius:999px;font-size:13.5px;color:var(--text-2);font-weight:560;white-space:nowrap;transition:.15s}
.seg button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);font-weight:680}

.statline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 12px;color:var(--text-3);font-size:12.5px}
.statline b{color:var(--text-2);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:12px;transform:translateZ(0)}
.card{
  position:relative;display:flex;flex-direction:column;gap:0;
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;text-align:left;box-shadow:var(--shadow);
  transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s;
  
}
@keyframes cardIn{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card:active{transform:scale(.98)}
.card .meta{padding:16px;display:flex;flex-direction:column;gap:4px;background:var(--bg-2)}
.card .name{font-size:15.5px;font-weight:680;line-height:1.35;letter-spacing:-.01em;padding-right:26px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .desc{font-size:12px;color:var(--text-3);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .tagrow{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.chip{font-size:10.5px;line-height:1;padding:5px 8px;border-radius:999px;background:var(--bg-3);color:var(--text-3);font-weight:600;letter-spacing:.02em}
.chip.embed{background:var(--brand-soft);color:var(--brand)}
.chip.ref{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.chip.warn{background:var(--danger-soft);color:var(--danger)}
.card .more{
  position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:999px;
  display:grid;place-items:center;color:var(--text-3);
  background:transparent;
  opacity:0;transition:opacity .15s,background .15s;
}
.card:hover .more,.card:focus-within .more{opacity:1}
.card .more:hover{background:var(--bg-2);color:var(--text)}
.card .more svg{width:15px;height:15px}
@media (hover:none){.card .more{opacity:1}}

/* 紧凑视图：小药丸按钮 */
.pillview{display:flex;flex-wrap:wrap;gap:9px;transform:translateZ(0)}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  max-width:100%;padding:11px 16px;border-radius:999px;
  background:var(--bg-2);border:1px solid var(--line);box-shadow:var(--shadow);
  color:var(--text);font-size:13.5px;font-weight:600;letter-spacing:-.01em;
  transition:transform .12s,box-shadow .16s;
  text-align:left;
}
.pill:hover{box-shadow:var(--shadow-lg)}
.pill:active{transform:scale(.96)}
.pill .sz{font-size:11px;color:var(--text-3);font-weight:550;font-variant-numeric:tabular-nums}
.pill .more{position:static;width:22px;height:22px;border-radius:999px;display:grid;place-items:center;
  color:var(--text-3);background:transparent;opacity:1;flex:none}
.pill .more svg{width:13px;height:13px}
.pill.ref{border-style:dashed}

/* 文件夹行 */
.folder-row{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.folder-row::-webkit-scrollbar{display:none}
.fchip{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--bg-2);border:1px solid var(--line);color:var(--text-2);box-shadow:var(--shadow);
  transition:.15s;white-space:nowrap;
}
.fchip.on{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.fchip .fx{width:16px;height:16px;border-radius:999px;display:grid;place-items:center;color:inherit;opacity:.6}
.fchip .fx:hover{opacity:1}
.fchip.newf{color:var(--brand)}
.fchip svg{width:13px;height:13px}

/* 多选 */
body.selecting{padding-bottom:calc(88px + var(--safe-b))}
.selbar{
  position:fixed;z-index:75;left:12px;right:12px;bottom:calc(14px + var(--safe-b));
  display:none;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--bg-2) 92%,transparent);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-lg);
  padding:10px 12px 10px 18px;
}
.selbar.on{display:flex}
.selbar .cnt{flex:1;font-size:14px;font-weight:650}
.selbar .cnt b{color:var(--brand)}
.selbar .btn-ghost{height:40px;padding:0 15px;box-shadow:none}
.selbar .btn-primary{height:40px;padding:0 16px}
.ckmark{
  position:absolute;top:12px;left:12px;width:24px;height:24px;border-radius:999px;
  border:2px solid var(--line-2);background:var(--bg-2);z-index:5;
  display:none;place-items:center;transition:.15s;
}
.ckmark svg{width:13px;height:13px;opacity:0;color:#fff}
body.selecting .ckmark{display:grid}
body.selecting .card .more{display:none}
body.selecting .card .meta{padding-left:50px}
body.selecting .card .name{padding-right:8px}
.card.selected{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.card.selected .ckmark{background:var(--brand);border-color:var(--brand)}
.card.selected .ckmark svg{opacity:1}
body.selecting .pill{padding-left:40px;position:relative}
body.selecting .pill .ckmark{display:grid;top:50%;transform:translateY(-50%)}
body.selecting .pill.selected{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
body.selecting .pill.selected .ckmark{background:var(--brand);border-color:var(--brand)}
body.selecting .pill.selected .ckmark svg{opacity:1}
body.selecting .pill .more{display:none}

/* 拖拽区 */
.dropzone{
  border:1.5px dashed color-mix(in srgb,var(--brand) 35%,transparent);border-radius:var(--r);
  padding:28px 18px;text-align:center;color:var(--text-3);
  background:color-mix(in srgb,var(--bg-2) 55%,transparent);
  transition:border-color .15s,background .15s,color .15s;
  cursor:pointer;width:100%;
}
.dropzone:active{transform:scale(.99)}
.dropzone.hot{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.dropzone .dz-ico{width:36px;height:36px;margin:0 auto 8px;color:inherit;opacity:.85}
.dropzone p{margin:0;font-size:13.5px}
.dropzone .dz-sub{font-size:12px;margin-top:4px;opacity:.8}

.empty{
  text-align:center;padding:52px 20px 60px;color:var(--text-3);
}
.empty .art{
  width:88px;height:88px;margin:0 auto 18px;border-radius:28px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--brand-soft),var(--bg-2));color:var(--brand);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.empty .art svg{width:38px;height:38px}
.empty h2{margin:0 0 6px;font-size:18px;color:var(--text);font-weight:700;letter-spacing:-.02em}
.empty p{margin:0 auto 20px;font-size:13.5px;max-width:340px;line-height:1.7}
.empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-ghost{
  height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg-2);color:var(--text-2);font-size:14px;font-weight:600;
  box-shadow:var(--shadow);
  display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s,transform .12s;
}
.btn-ghost:hover{background:var(--bg-3);color:var(--text)}
.btn-ghost:active{transform:scale(.97)}
.btn-ghost svg{width:16px;height:16px}

/* ============ 查看器 ============ */
.viewer{position:fixed;inset:0;z-index:60;background:var(--bg-2);display:none;flex-direction:column}
.viewer.on{display:flex;animation:viewIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.viewer iframe{flex:1;width:100%;border:0;background:#fff;display:block}
html[data-theme="dark"] .viewer iframe{background:#12141f}
.vbar{
  position:fixed;z-index:70;top:calc(var(--safe-t) + 10px);left:calc(var(--safe-l) + 10px);
  display:flex;gap:8px;align-items:center;pointer-events:none;
  max-width:calc(100vw - 20px - var(--safe-l) - var(--safe-r));
}
.vbar > *{pointer-events:auto}
.vback{
  height:44px;padding:0 18px 0 14px;border-radius:999px;
  display:inline-flex;align-items:center;gap:6px;
  background:color-mix(in srgb,var(--bg-2) 88%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);
  color:var(--text);font-size:14px;font-weight:650;box-shadow:var(--shadow);
  transition:transform .12s,background .15s;
}
.vback:active{transform:scale(.95)}
.vback svg{width:17px;height:17px}
.vname{
  font-size:12.5px;color:var(--text-2);font-weight:600;padding:8px 13px;border-radius:999px;
  background:color-mix(in srgb,var(--bg-2) 82%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  max-width:min(46vw,300px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.vmore{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bg-2) 88%,transparent);backdrop-filter:blur(18px);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);color:var(--text-2);box-shadow:var(--shadow)}
.vmore svg{width:17px;height:17px}
.viewer .frame-wrap{flex:1;position:relative;padding-top:0;display:flex;overflow:hidden}
.viewer .vbar-spacer{height:calc(var(--safe-t) + 62px);flex:none;background:var(--bg-2)}

/* ============ 弹层 ============ */
.sheet-mask{position:fixed;inset:0;z-index:80;background:rgba(10,12,18,.5);display:none;align-items:flex-end;justify-content:center}
.sheet-mask.on{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:560px;max-height:88vh;background:var(--bg);border-radius:28px 28px 0 0;
  box-shadow:0 -8px 48px -8px rgba(40,44,110,.35);display:flex;flex-direction:column;
  padding-bottom:calc(8px + var(--safe-b));
  animation:sheetUp .24s cubic-bezier(.2,.8,.2,1);
}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;flex:none}
.sheet-head h3{margin:0;font-size:16px;font-weight:640;flex:1;letter-spacing:-.01em}
.sheet-body{padding:0 18px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:10px 18px calc(14px + var(--safe-b));display:flex;gap:9px;justify-content:flex-end;flex:none;flex-wrap:wrap}
.sheet-foot .btn-ghost,.sheet-foot .btn-primary{height:46px}
.sheet .close{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text-3)}
.sheet .close:hover{background:var(--bg-3);color:var(--text)}
.sheet .close svg{width:16px;height:16px}
@media (min-width:640px){
  .sheet-mask{align-items:center}
  .sheet{border-radius:18px;max-height:82vh}
  @keyframes sheetUp{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
}

.field{margin:12px 0}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.input,.textarea,.select{
  width:100%;border:1px solid var(--line-2);background:var(--bg-2);
  border-radius:14px;padding:11px 13px;font-size:14.5px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.input:focus,.textarea:focus,.select:focus{border-color:color-mix(in srgb,var(--brand) 45%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 12%,transparent)}
.textarea{resize:vertical;min-height:84px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.hint{font-size:11.5px;color:var(--text-3);margin-top:6px;line-height:1.6}
.hint code{background:var(--bg-3);padding:1px 6px;border-radius:6px;font-size:11px}

.import-list{display:flex;flex-direction:column;gap:9px;max-height:38vh;overflow-y:auto;margin-top:10px}
.imp-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:16px;background:var(--bg-2);box-shadow:var(--shadow)}
.imp-row .ico{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:700}
.imp-row .txt{flex:1;min-width:0}
.imp-row .t1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-row .t2{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-row .sz{font-size:11.5px;color:var(--text-3);flex:none;font-variant-numeric:tabular-nums}

.menu{position:fixed;z-index:90;min-width:190px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow-lg);padding:6px;display:none;animation:fadeIn .12s}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border-radius:11px;font-size:13.5px;color:var(--text);text-align:left}
.menu button:hover{background:var(--bg-3)}
.menu button.danger{color:var(--danger)}
.menu button svg{width:15px;height:15px;color:var(--text-3);flex:none}
.menu button.danger svg{color:var(--danger)}
.menu .sep{height:1px;background:var(--line);margin:4px 8px}

/* ============ Toast ============ */
.toasts{position:fixed;z-index:100;left:50%;transform:translateX(-50%);
  bottom:calc(22px + var(--safe-b));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{
  background:color-mix(in srgb,var(--text) 92%,transparent);color:var(--bg);
  padding:9px 14px;border-radius:11px;font-size:13px;font-weight:520;
  box-shadow:var(--shadow-lg);animation:toastIn .22s cubic-bezier(.2,.8,.2,1);
  max-width:100%;text-align:center;line-height:1.45;
}
html[data-theme="dark"] .toast,body.dark .toast{background:color-mix(in srgb,#eef1f6 94%,transparent);color:#141821}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .18s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.97)}}

/* 说明页 */
.doc{max-width:720px}
.doc h2{font-size:15px;margin:22px 0 8px;font-weight:640}
.doc h2:first-child{margin-top:4px}
.doc p,.doc li{font-size:13.5px;color:var(--text-2);line-height:1.7}
.doc ol,.doc ul{padding-left:20px;margin:6px 0}
.doc li{margin:3px 0}
.doc .kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--bg-3);border:1px solid var(--line);font-size:11.5px;color:var(--text-2);font-family:ui-monospace,Menlo,monospace}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:var(--brand-soft);color:var(--text-2);font-size:12.5px;line-height:1.65;margin:10px 0}
.note svg{width:15px;height:15px;flex:none;color:var(--brand);margin-top:2px}

@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card .meta{padding:13px 12px}
  .card .name{font-size:14px;padding-right:24px}
  .card .more{top:10px;right:10px}
  .brand .sub{display:none}
  .btn-primary .lbl-txt{display:none}
  .btn-primary{padding:0;width:38px;justify-content:center}
  .seg button{padding:6px 9px;font-size:12.5px}
  .statline{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

\n\u003cmain class=\"layout\">\n\u003csection class=\"stage\" id=\"fullPreview\" tabindex=\"-1\" aria-label=\"预览与导出\">\n  \u003cdiv class=\"stage-bar\">\u003cdiv class=\"stage-title\">\u003cstrong>平台使用标源@山风\u003c/strong>\u003c/div>\u003cdiv class=\"count\" role=\"group\" aria-label=\"图片数量与展板比例\">\u003cbutton data-layout=\"portrait\" data-count=\"2\" aria-pressed=\"true\">两图 3:4\u003c/button>\u003cbutton data-layout=\"landscape\" data-count=\"3\" aria-pressed=\"false\">三图 4:3\u003c/button>\u003cbutton data-layout=\"landscape\" data-count=\"4\" aria-pressed=\"false\">四图 自适应\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv class=\"template-switch\" role=\"group\" aria-label=\"展板样式\">\u003cspan>展板样式\u003c/span>\u003cbutton type=\"button\" data-template=\"paper\" aria-pressed=\"true\">折页标本\u003c/button>\u003cbutton type=\"button\" data-template=\"jelly\" aria-pressed=\"false\">轻透果冻\u003c/button>\u003c/div>\n  \u003cdiv class=\"canvas-wrap\">\u003ccanvas id=\"preview\" role=\"img\" width=\"900\" height=\"1200\" aria-label=\"3比4折页标本，2张图片\">\u003c/canvas>\u003c/div>\n  \u003cdiv class=\"stage-meta\">\u003cspan id=\"previewState\">示意素材 · 上传即可替换\u003c/span>\u003cspan id=\"dimensions\">2400 × 3200 px · 3:4\u003c/span>\u003c/div>\n  \u003cp class=\"status\" id=\"status\" role=\"status\" aria-live=\"polite\">上传图片后，自动完成第一版配色。\u003c/p>\n\u003c/section>\n\u003caside class=\"sidebar\" id=\"settingsArea\" aria-label=\"折页展示设置\">  \u003csection class=\"preview-dock\" id=\"previewDock\" aria-label=\"设置时的固定预览\">\n    \u003cdiv class=\"dock-heading\">\u003cstrong>实时预览 · 滚动时固定\u003c/strong>\u003cdiv class=\"dock-actions\">\u003cbutton id=\"expandDock\" aria-expanded=\"false\" aria-controls=\"previewDock\">放大\u003c/button>\u003cbutton id=\"returnPreview\">回到大图 ↑\u003c/button>\u003c/div>\u003c/div>\n    \u003cdiv class=\"dock-body\">\u003cdiv class=\"dock-canvas-shell\">\u003ccanvas id=\"dockedPreview\" role=\"img\" width=\"450\" height=\"600\" aria-label=\"固定的实时预览\">\u003c/canvas>\u003c/div>\u003cdiv class=\"dock-info\">\u003csmall>调整时预览\u003c/small>\u003cstrong id=\"dockRegionTitle\">修改设置，效果实时更新\u003c/strong>\u003cp id=\"dockRegionHint\">向下滑动设置，预览会留在上方。需要看细节时可放大。\u003c/p>\u003cdiv class=\"dock-regions\" id=\"dockRegions\" role=\"group\" aria-label=\"快速选择渐变区域\" hidden>\u003c/div>\u003c/div>\u003c/div>\n  \u003c/section>\u003cdiv class=\"settings-shell\">\u003cdiv class=\"settings-tabs\" id=\"settingsTabs\" role=\"tablist\" aria-label=\"编辑分类\">\u003cbutton type=\"button\" class=\"settings-tab\" id=\"settingsTabImages\" role=\"tab\" aria-selected=\"true\" aria-controls=\"settingsPanelImages\" tabindex=\"0\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\">\u003crect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/>\u003ccircle cx=\"8\" cy=\"8\" r=\"1.5\"/>\u003cpath d=\"m3 17 5-5 4 4 3-3 6 6\"/>\u003c/svg>\u003cspan>截图\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"settings-tab\" id=\"settingsTabColour\" role=\"tab\" aria-selected=\"false\" aria-controls=\"settingsPanelColour\" tabindex=\"-1\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 3v18M12 3a9 9 0 0 1 0 18\"/>\u003cpath d=\"M15.5 7.5h2M15.5 12h3M15.5 16.5h2\"/>\u003c/svg>\u003cspan>配色\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"settings-tab\" id=\"settingsTabLayout\" role=\"tab\" aria-selected=\"false\" aria-controls=\"settingsPanelLayout\" tabindex=\"-1\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\">\u003crect x=\"3\" y=\"3\" width=\"7\" height=\"18\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"3\" width=\"7\" height=\"11\" rx=\"1.5\"/>\u003cpath d=\"M14 18h7M14 21h4\"/>\u003c/svg>\u003cspan>构图\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"settings-tab\" id=\"settingsTabText\" role=\"tab\" aria-selected=\"false\" aria-controls=\"settingsPanelText\" tabindex=\"-1\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\">\u003cpath d=\"M4 5V3h16v2M12 3v18M8 21h8\"/>\u003c/svg>\u003cspan>文字\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"settings-tab\" id=\"settingsTabGradient\" role=\"tab\" aria-selected=\"false\" aria-controls=\"gradientSection\" tabindex=\"-1\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\">\u003cpath d=\"M12 3C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-12Z\"/>\u003cpath d=\"M8.5 15a3.5 3.5 0 0 0 3.5 3.5\"/>\u003c/svg>\u003cspan>晕染\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"settings-tab\" id=\"settingsTabWatermark\" role=\"tab\" aria-selected=\"false\" aria-controls=\"settingsPanelWatermark\" tabindex=\"-1\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\">\u003cpath d=\"m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z\"/>\u003cpath d=\"m8 12 3 3 5-6\"/>\u003c/svg>\u003cspan>水印\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"settings-tab\" id=\"settingsTabExport\" role=\"tab\" aria-selected=\"false\" aria-controls=\"settingsPanelExport\" tabindex=\"-1\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\">\u003cpath d=\"M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5\"/>\u003c/svg>\u003cspan>导出\u003c/span>\u003c/button>\u003c/div>\u003csection class=\"settings-panel\" id=\"settingsPanelImages\" role=\"tabpanel\" aria-labelledby=\"settingsTabImages\" tabindex=\"0\">    \u003ch2>\u003cem>01\u003c/em>放入你的作品\u003c/h2>\n    \u003clabel class=\"drop\" id=\"dropZone\">\u003cspan class=\"drop-symbol\" aria-hidden=\"true\">↥\u003c/span>\u003cb>选择两张、三张或四张图片\u003c/b>\u003csmall>原比例放入 · JPG / PNG / WebP\u003c/small>\u003cinput id=\"images\" type=\"file\" accept=\"image/png,image/jpeg,image/webp\" multiple aria-label=\"上传两张、三张或四张图片\">\u003c/label>\n    \u003cdiv class=\"thumbs\" id=\"thumbs\">\u003c/div>\u003cdiv class=\"meta-line\">\u003csmall id=\"uploadCount\">当前使用示意素材\u003c/small>\u003cbutton id=\"clearImages\">恢复示意\u003c/button>\u003c/div>\u003cinput class=\"sr-only\" id=\"replaceImage\" type=\"file\" accept=\"image/png,image/jpeg,image/webp\" aria-label=\"替换一张图片\">    \u003cp class=\"hint\">两张自动使用 3:4，三张使用 4:3，四张按原比例适配；单张可继续添加或替换。图像仅在当前设备处理。\u003c/p>\u003c/section>\u003csection class=\"settings-panel\" id=\"settingsPanelColour\" role=\"tabpanel\" aria-labelledby=\"settingsTabColour\" tabindex=\"0\" hidden>\u003ch2>自动取色与配色\u003c/h2>    \u003cdiv class=\"smart-card\">\n      \u003cdiv class=\"smart-heading\">\u003cstrong id=\"paletteHeading\">智能取色 · 已开启\u003c/strong>\u003cdiv class=\"swatches\" id=\"autoSwatches\" aria-label=\"当前设计配色\">\u003c/div>\u003c/div>\n      \u003cp id=\"paletteStatus\">上传后自动搭配主色、辅助色、文字与渐变纸底。\u003c/p>\n      \u003cdiv class=\"palette-options\" role=\"group\" aria-label=\"四套自动配色\">\n        \u003cbutton id=\"paletteSource\" aria-pressed=\"true\">\u003cspan>同色融合\u003c/span>\u003cspan class=\"palette-mini\" id=\"sourceChips\" aria-hidden=\"true\">\u003c/span>\u003c/button>\n        \u003cbutton id=\"paletteDuet\" aria-pressed=\"false\">\u003cspan>双色呼应\u003c/span>\u003cspan class=\"palette-mini\" id=\"duetChips\" aria-hidden=\"true\">\u003c/span>\u003c/button>\n        \u003cbutton id=\"paletteMuted\" aria-pressed=\"false\">\u003cspan>柔和灰调\u003c/span>\u003cspan class=\"palette-mini\" id=\"mutedChips\" aria-hidden=\"true\">\u003c/span>\u003c/button>\n        \u003cbutton id=\"palettePaper\" aria-pressed=\"false\">\u003cspan>色纸拼版\u003c/span>\u003cspan class=\"palette-mini\" id=\"paperChips\" aria-hidden=\"true\">\u003c/span>\u003c/button>\n      \u003c/div>\n      \u003cp class=\"palette-description\" id=\"paletteDescription\">以原图主色统一纸底、框色与文字，辅助色只作少量点缀。\u003c/p>\n      \u003clabel class=\"check panel-tint-check\">\u003cinput id=\"panelTint\" type=\"checkbox\" checked>自动按每张截图微调折页晕染\u003c/label>\n      \u003cbutton id=\"smartDesign\">重新自动设计\u003c/button>\n    \u003c/div>\u003cdiv class=\"subhead\">基础配色\u003c/div>    \u003clabel class=\"check\">\u003cinput id=\"autoPalette\" type=\"checkbox\" checked>基础配色优先自动搭配\u003c/label>\n    \u003cdiv class=\"palette\">\u003clabel>背景\u003cinput id=\"bgColor\" type=\"color\" value=\"#f0f3ec\">\u003c/label>\u003clabel>折页\u003cinput id=\"paperColor\" type=\"color\" value=\"#fafbf8\">\u003c/label>\u003clabel>文字\u003cinput id=\"inkColor\" type=\"color\" value=\"#414a39\">\u003c/label>\u003c/div>\u003c/section>\u003csection class=\"settings-panel\" id=\"settingsPanelLayout\" role=\"tabpanel\" aria-labelledby=\"settingsTabLayout\" tabindex=\"0\" hidden>\u003clabel class=\"field template-field\">\u003cspan>展板样式\u003c/span>\u003cselect id=\"templateStyle\">\u003coption value=\"paper\" selected>折页标本\u003c/option>\u003coption value=\"jelly\">轻透果冻\u003c/option>\u003c/select>\u003c/label>\u003cp class=\"hint template-description\" id=\"templateDescription\">纸面、折印与错落的标本卡片；保留原来的折页设计。\u003c/p>    \u003ch2>\u003cem>02\u003c/em>预览框\u003c/h2>\n    \u003clabel class=\"check\">\u003cinput id=\"autoFrame\" type=\"checkbox\" checked>框色优先跟随截图自动搭配\u003c/label>\n    \u003cdiv class=\"setting-pair\">\u003clabel class=\"field\">\u003cspan class=\"field-label\">框边宽度 \u003coutput id=\"frameWidthValue\">17 px\u003c/output>\u003c/span>\u003cinput id=\"frameWidth\" type=\"range\" min=\"0\" max=\"52\" value=\"17\">\u003c/label>\u003clabel class=\"field\">\u003cspan>框边颜色\u003c/span>\u003cinput id=\"frameColor\" type=\"color\" value=\"#f5f7f1\">\u003c/label>\u003c/div>\n    \u003cdiv class=\"row\">\u003clabel class=\"field\">\u003cspan>排列方式\u003c/span>\u003cselect id=\"arrangement\">\u003coption value=\"staggered\">轻盈错落\u003c/option>\u003coption value=\"aligned\">整齐并排\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"field\">\u003cspan class=\"field-label\">倾斜角度 \u003coutput id=\"tiltValue\">1.5°\u003c/output>\u003c/span>\u003cinput id=\"tilt\" type=\"range\" min=\"0\" max=\"3\" step=\"0.1\" value=\"1.5\">\u003c/label>\u003c/div>\n    \u003clabel class=\"check\">\u003cinput id=\"showTabs\" type=\"checkbox\" checked>\u003cspan id=\"tabsLabel\">侧边索引签\u003c/span>\u003c/label>    \u003clabel class=\"field\">\u003cspan class=\"field-label\">截图大小 \u003coutput id=\"imageScaleValue\">100%\u003c/output>\u003c/span>\u003cinput id=\"imageScale\" type=\"range\" min=\"80\" max=\"150\" value=\"100\">\u003c/label>\u003cdiv class=\"subhead\">纸面质感\u003c/div>\u003clabel class=\"check\">\u003cinput id=\"showTexture\" type=\"checkbox\" checked>\u003cspan id=\"textureLabel\">轻纸纹\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput id=\"showShadow\" type=\"checkbox\" checked>\u003cspan id=\"shadowLabel\">柔和纸影\u003c/span>\u003c/label>\u003c/section>\u003csection class=\"settings-panel\" id=\"settingsPanelText\" role=\"tabpanel\" aria-labelledby=\"settingsTabText\" tabindex=\"0\" hidden>\u003ch2>文字信息\u003csmall id=\"textPlacement\">标题与署名集中在底部\u003c/small>\u003c/h2>    \u003clabel class=\"field\">\u003cspan>主题名称\u003c/span>\u003cinput id=\"title\" value=\"山间有信\" maxlength=\"40\">\u003c/label>\n    \u003clabel class=\"field\">\u003cspan>英文副标题 / 简短介绍（可留空）\u003c/span>\u003cinput id=\"subtitle\" value=\"A LETTER FROM THE QUIET HILLS\" maxlength=\"90\">\u003c/label>\n    \u003clabel class=\"field\">\u003cspan>作者署名\u003c/span>\u003cinput id=\"author\" value=\"玉生烟\" maxlength=\"35\">\u003c/label>\n    \u003clabel class=\"field\">\u003cspan>页首短句（可留空）\u003c/span>\u003cinput id=\"note\" value=\"借一页薄纸，赦免万物的短暂\" maxlength=\"70\">\u003c/label>\n    \u003cdiv class=\"row\">\u003clabel class=\"field\">\u003cspan>第 1 张标签\u003c/span>\u003cinput id=\"caption0\" value=\"BOOKSHELF\" maxlength=\"25\">\u003c/label>\u003clabel class=\"field\">\u003cspan>第 2 张标签\u003c/span>\u003cinput id=\"caption1\" value=\"READING\" maxlength=\"25\">\u003c/label>\u003c/div>\n    \u003clabel class=\"field\" id=\"thirdCaption\" hidden>\u003cspan>第 3 张标签\u003c/span>\u003cinput id=\"caption2\" value=\"DETAILS\" maxlength=\"25\">\u003c/label>\n    \u003clabel class=\"field\" id=\"fourthCaption\" hidden>\u003cspan>第 4 张标签\u003c/span>\u003cinput id=\"caption3\" value=\"EXTRAS\" maxlength=\"25\">\u003c/label>    \u003clabel class=\"field\">\u003cspan>标题与作者字体\u003c/span>\u003cinput id=\"fontFile\" class=\"font-file\" type=\"file\" accept=\".ttf,.otf,.woff,.woff2\">\u003c/label>\u003cdiv class=\"meta-line\">\u003csmall id=\"fontStatus\">当前：系统宋体 / 衬线体\u003c/small>\u003cbutton id=\"resetFont\">恢复默认\u003c/button>\u003c/div>\u003c/section>  \u003cdetails class=\"settings-panel settings-gradient\" id=\"gradientSection\" role=\"tabpanel\" aria-labelledby=\"settingsTabGradient\" hidden>\n    \u003csummary id=\"gradientSummary\" tabindex=\"-1\">渐变纸底\u003csmall id=\"gradientBadge\">自动取色\u003c/small>\u003c/summary>\n    \u003clabel class=\"check\">\u003cinput id=\"autoGradient\" type=\"checkbox\" checked>渐变色优先跟随截图自动搭配\u003c/label>\n    \u003clabel class=\"check\">\u003cinput id=\"washEnabled\" type=\"checkbox\" checked>开启局部色彩晕染\u003c/label>\n    \u003clabel class=\"check\">\u003cinput id=\"showRegionGuides\" type=\"checkbox\" checked>在预览中显示区域编号（不导出）\u003c/label>\n    \u003cdiv class=\"region-tabs\" id=\"regionTabs\" role=\"group\" aria-label=\"渐变区域\">\u003c/div>\n    \u003cp class=\"region-description\" id=\"regionDescription\" role=\"status\" aria-live=\"polite\">\u003c/p>\n    \u003cdiv class=\"row\">\u003clabel class=\"field\">\u003cspan>当前区域颜色\u003c/span>\u003cinput id=\"washColor\" type=\"color\" value=\"#b4c2a1\">\u003c/label>\u003cbutton class=\"compact\" id=\"editPosition\" aria-pressed=\"false\" style=\"align-self:end;margin-bottom:2px\">在图上定位\u003c/button>\u003c/div>\n    \u003cdiv class=\"row\">\u003clabel class=\"field\">\u003cspan class=\"field-label\">横向位置 \u003coutput id=\"washXValue\">83%\u003c/output>\u003c/span>\u003cinput id=\"washX\" type=\"range\" min=\"0\" max=\"100\" value=\"83\">\u003c/label>\u003clabel class=\"field\">\u003cspan class=\"field-label\">纵向位置 \u003coutput id=\"washYValue\">16%\u003c/output>\u003c/span>\u003cinput id=\"washY\" type=\"range\" min=\"0\" max=\"100\" value=\"16\">\u003c/label>\u003c/div>\n    \u003cdiv class=\"row\">\u003clabel class=\"field\">\u003cspan class=\"field-label\">晕染范围 \u003coutput id=\"washRadiusValue\">78%\u003c/output>\u003c/span>\u003cinput id=\"washRadius\" type=\"range\" min=\"10\" max=\"125\" value=\"78\">\u003c/label>\u003clabel class=\"field\">\u003cspan class=\"field-label\">晕染强度 \u003coutput id=\"washOpacityValue\">66%\u003c/output>\u003c/span>\u003cinput id=\"washOpacity\" type=\"range\" min=\"0\" max=\"100\" value=\"66\">\u003c/label>\u003c/div>\n    \u003cp class=\"hint\" id=\"positionHint\">区域是可移动的晕染中心。选择带颜色的位置标签，预览会显示对应编号；点击“在图上定位”可拖动。标记不会导出。\u003c/p>\n    \u003cdiv class=\"subhead\">截图边缘渐隐\u003c/div>\n    \u003cdiv class=\"row\">\u003clabel class=\"field\">\u003cspan>作用于\u003c/span>\u003cselect id=\"fadeTarget\">\u003coption value=\"none\">关闭\u003c/option>\u003coption value=\"all\">全部截图\u003c/option>\u003coption value=\"0\">第 1 张\u003c/option>\u003coption value=\"1\">第 2 张\u003c/option>\u003coption value=\"2\">第 3 张\u003c/option>\u003coption value=\"3\">第 4 张\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"field\">\u003cspan>渐隐方向\u003c/span>\u003cselect id=\"fadeSide\">\u003coption value=\"bottom\">底部\u003c/option>\u003coption value=\"top\">顶部\u003c/option>\u003coption value=\"left\">左侧\u003c/option>\u003coption value=\"right\">右侧\u003c/option>\u003coption value=\"both\">上下两端\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n    \u003cdiv class=\"row\">\u003clabel class=\"field\">\u003cspan class=\"field-label\">渐隐范围 \u003coutput id=\"fadeRangeValue\">25%\u003c/output>\u003c/span>\u003cinput id=\"fadeRange\" type=\"range\" min=\"5\" max=\"80\" value=\"25\">\u003c/label>\u003clabel class=\"field\">\u003cspan class=\"field-label\">渐隐强度 \u003coutput id=\"fadeStrengthValue\">100%\u003c/output>\u003c/span>\u003cinput id=\"fadeStrength\" type=\"range\" min=\"0\" max=\"100\" value=\"100\">\u003c/label>\u003c/div>\n  \u003c/details>\u003csection class=\"settings-panel\" id=\"settingsPanelWatermark\" role=\"tabpanel\" aria-labelledby=\"settingsTabWatermark\" tabindex=\"0\" hidden>\u003ch2>作品水印\u003c/h2>\u003clabel class=\"check\">\u003cinput id=\"showWatermark\" type=\"checkbox\">低透明度署名水印\u003c/label>    \u003clabel class=\"field\">\u003cspan>水印文字\u003c/span>\u003cinput id=\"watermarkText\" type=\"text\" value=\"\" placeholder=\"留空使用作者署名\" maxlength=\"35\">\u003c/label>\n    \u003clabel class=\"check\">\u003cinput id=\"showImageWatermark\" type=\"checkbox\" disabled>内置图片水印 · 覆盖模式\u003c/label>\n    \u003clabel class=\"field\">\u003cspan class=\"field-label\">图片水印强度 \u003coutput id=\"imageWatermarkOpacityValue\">100%\u003c/output>\u003c/span>\u003cinput id=\"imageWatermarkOpacity\" type=\"range\" min=\"0\" max=\"100\" value=\"100\">\u003c/label>\n    \u003cp class=\"hint\" id=\"imageWatermarkStatus\" role=\"status\">正在载入内置水印…\u003c/p>\u003c/section>\u003csection class=\"settings-panel\" id=\"settingsPanelExport\" role=\"tabpanel\" aria-labelledby=\"settingsTabExport\" tabindex=\"0\" hidden>\u003ch2>导出作品\u003c/h2>  \u003cdiv class=\"export-row\">\u003cselect id=\"resolution\" aria-label=\"导出清晰度\">\u003coption value=\"1800\">1800 × 2400\u003c/option>\u003coption value=\"2400\" selected>2400 × 3200\u003c/option>\u003coption value=\"3000\">3000 × 4000\u003c/option>\u003c/select>\u003cbutton class=\"primary\" id=\"exportButton\">导出示意 PNG ↗\u003c/button>\u003c/div>  \u003cdetails class=\"result\" id=\"result\" hidden>\u003csummary>导出原图 · 手机可长按保存\u003c/summary>\u003cdiv class=\"result-links\">\u003ca id=\"downloadPNG\">下载 PNG 原图\u003c/a>\u003cbutton type=\"button\" id=\"sharePNG\" hidden>保存 / 分享原图\u003c/button>\u003c/div>\u003cp class=\"hint\" id=\"saveHint\" role=\"status\">\u003c/p>\u003cimg id=\"exported\" alt=\"导出的3比4折页展示图\">\u003c/details>\u003c/section>\u003c/div>\u003cdiv class=\"memory-bar\" role=\"group\" aria-label=\"自动记忆与清除\">\u003cdiv>\u003cstrong>自动记忆\u003c/strong>\u003csmall id=\"memoryStatus\" role=\"status\" aria-live=\"polite\">正在读取上次设置…\u003c/small>\u003c/div>\u003cbutton class=\"compact\" id=\"clearMemory\" type=\"button\" disabled>清除记忆并恢复默认\u003c/button>\u003c/div>\u003cp class=\"privacy\">两图 3:4 / 三图 4:3 / 四图自适应。设置、文字与字体仅保存在当前浏览器；截图刷新后需重新选择。图片不会上传。框边宽度以设计画布为基准。\u003c/p>\u003c/aside>\n\u003c/main>\n\u003cfooter class=\"foot\">\u003cspan>纸间 / PERSONAL PAPER FOLIO\u003c/span>\u003cspan>让作品被看见，也让留白有分寸。\u003c/span>\u003c/footer>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\u003cscript>\n'use strict';\n(() => {\nconst $=id=>document.getElementById(id);\n// Only this template's preferences and font are stored. Screenshots stay temporary.\nconst MEMORY_KEY='shanfeng.paper-folio.memory.v1',MEMORY_FONT_KEY=MEMORY_KEY+'.font',MEMORY_DB='shanfeng-paper-folio-memory-v1';\nconst memoryFields=[...document.querySelectorAll('input[id]:not([type=\"file\"]),select[id]')];\nlet memoryStarted=false,memoryReady=false,memoryApplying=false,memoryClearing=false,memoryPending=false;\nlet memoryRevision=0,memoryEpoch=0,memoryTimer,memoryDBPromise,memoryQueue=Promise.resolve(),memoryDefaults;\nlet memoryFont=null,memoryFontSavedToken=null,fontRevision=0,memoryCurrentTab='Images';\nfunction memoryStatus(text){$('memoryStatus').textContent=text}\nfunction localMemoryWrite(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}\nfunction localMemoryRead(key){try{const raw=localStorage.getItem(key);return raw&&raw.length\u003c4000000?JSON.parse(raw):null}catch{return null}}\nfunction localMemoryRemove(key){try{localStorage.removeItem(key);return true}catch{return false}}\nfunction openMemoryDB(){\n if(memoryDBPromise)return memoryDBPromise;\n memoryDBPromise=new Promise(resolve=>{\n  let request,settled=false,timer;\n  const finish=db=>{if(settled){if(db)db.close();return}settled=true;clearTimeout(timer);resolve(db)};\n  try{\n   if(!globalThis.indexedDB){finish(null);return}\n   request=indexedDB.open(MEMORY_DB,1);\n   request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.c <script>
(function(){
"use strict";

/* ---------------------- 诊断：版本号 + 错误显示条 ---------------------- */
var APP_VER="v3";
window.__hbver=APP_VER;
function showErrBar(msg){
  try{
    var bar=document.getElementById("errbar");
    if(!bar){
      bar=document.createElement("div");
      bar.id="errbar";
      bar.style.cssText="position:fixed;left:8px;right:8px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:99999;background:#b3261e;color:#fff;font:12px/1.5 -apple-system,sans-serif;padding:10px 14px;border-radius:12px;max-height:38vh;overflow:auto;white-space:pre-wrap;word-break:break-all;box-shadow:0 6px 24px rgba(0,0,0,.3)";
      (document.body||document.documentElement).appendChild(bar);
    }
    bar.textContent=APP_VER+" 错误："+msg;
  }catch(e){}
}
window.addEventListener("error",function(e){ showErrBar((e.message||"未知错误")+" @"+(e.filename?"行"+e.lineno:"") ); });
window.addEventListener("unhandledrejection",function(e){ showErrBar("Promise: "+(e.reason&&e.reason.message||e.reason)); });

/* ---------------------- 基础工具 ---------------------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var DB={items:[],settings:{theme:"auto"}};

function toast(msg,ms){
  var box=$("#toasts");var el=document.createElement("div");
  el.className="toast";el.textContent=msg;box.appendChild(el);
  setTimeout(function(){el.classList.add("out");setTimeout(function(){el.remove()},220)},ms||2000);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function bytes(n){if(!n&&n!==0)return "";if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(n<10240?1:0)+" KB";return (n/1048576).toFixed(n<10485760?1:0)+" MB"}
// 统一色系：全部用靛蓝主色，保持页面干净；数据里自定义的颜色仍可覆盖
function colorOf(item){return item.color||"#5a5fd8"}

/* ---------------------- 存储 ---------------------- */
function stripItem(it){
  // embed 内容不进 localStorage（体积大），只保留元数据
  var o=Object.assign({},it);delete o.html;delete o._url;return o;
}
function save(){
  // 优先连内容一起存（重新打开页面工具仍可用）；超限时降级为只存元数据
  try{
    var data={v:1,items:DB.items.map(function(it){
      var o=Object.assign({},it);delete o._url;return o;
    }),settings:DB.settings};
    localStorage.setItem(LS_KEY,JSON.stringify(data));
    DB.settings._fullSaved=true;
    return;
  }catch(e){}
  try{
    var data2={v:1,items:DB.items.map(stripItem),settings:DB.settings};
    localStorage.setItem(LS_KEY,JSON.stringify(data2));
    toast("缓存空间不足，内容未缓存——请导出单文件保存",2600);
  }catch(e){ console.warn("save failed",e); }
}
function load(){
  var seeded=null;
  try{ seeded=JSON.parse($("#seed-data").textContent||"null") }catch(e){}
  var stored=null;
  try{ stored=JSON.parse(localStorage.getItem(LS_KEY)||"null") }catch(e){}
  var fromSeed=[];
  if(seeded&&seeded.items&&seeded.items.length){ fromSeed=seeded.items.map(normalize) }
  var fromStore=[];
  if(stored&&Array.isArray(stored.items)){ fromStore=stored.items.map(normalize) }
  if(seeded&&seeded.settings){ DB.settings=Object.assign(DB.settings,seeded.settings) }
  if(stored&&stored.settings){ DB.settings=Object.assign(DB.settings,stored.settings) }

  // 合并：store 的条目优先（用户在现场编辑/删除过），seed 里被删掉的要记住
  var removed=DB.settings.removedSeed||[];
  var map={};
  fromStore.forEach(function(it){map[it.id]=it});
  var list=[];
  fromSeed.forEach(function(it){
    // seed 内嵌内容体积大，不进 localStorage；若 store 有同名记录则合并元数据
    if(map[it.id]){
      var m=Object.assign({},it,map[it.id]);
      if(it.html){m.html=it.html}       // 内容以 seed 为准（最新构建）
      m._url=null;
      list.push(m);
    }else if(removed.indexOf(it.id)<0){
      list.push(it);
    }
  });
  fromStore.forEach(function(it){ if(!list.some(function(x){return x.id===it.id})){ it._url=null; list.push(it) } });
  DB.items=list;
}
function normalize(it){
  it=Object.assign({
    id:uid(), name:"未命名", desc:"", tags:[], type:"embed",
    html:"", path:"", builtin:false, addedAt:Date.now(), color:""
  },it);
  // 兼容历史/异常数据：类型不对时强制修正，避免渲染崩溃
  if(typeof it.name!=="string")it.name=String(it.name==null?"":it.name);
  if(typeof it.desc!=="string")it.desc=String(it.desc==null?"":it.desc);
  if(typeof it.path!=="string")it.path=String(it.path||"");
  if(typeof it.html!=="string")it.html=String(it.html||"");
  if(!Array.isArray(it.tags)){
    it.tags=typeof it.tags==="string"?it.tags.split(/[,，]/):[];
  }
  it.tags=it.tags.filter(function(t){return typeof t==="string"});
  it.size=Number(it.size)||0;
  if(it.folder!=null&&typeof it.folder!=="string")it.folder=String(it.folder);
  return it;
}

/* ---------------------- 主题 ---------------------- */
function applyTheme(){
  var t=DB.settings.theme||"auto";
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  var dark=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);
  document.body.classList.toggle("dark",dark);
}

/* ---------------------- 渲染列表 ---------------------- */
var state={q:"",filter:"all",folder:""};

function viewMode(){return DB.settings.view==="compact"?"compact":"card"}

  DB.settings.view=v;save();
  var g=$("#viewIconGrid"),l=$("#viewIconList");
  if(g&&l){g.style.display=v==="compact"?"none":"";l.style.display=v==="compact"?"":"none"}

  if(b)b.title=v==="compact"?"切换为卡片视图":"切换为紧凑视图";
  render();
}
function folders(){return DB.settings.folders||(DB.settings.folders=[])}
function folderName(id){
  var f=folders().find(function(x){return x.id===id});
  return f?f.name:"";
}
function renderFolderRow(){
  var row=$("#folderRow");if(!row)return;
  var html='<button class="fchip'+(state.folder===""?" on":"")+'" data-fold="">全部</button>';
  folders().forEach(function(f){
    html+='<button class="fchip'+(state.folder===f.id?" on":"")+'" data-fold="'+f.id+'">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>'+
      esc(f.name)+
      (state.folder===f.id?'<span class="fx" data-fold-del="'+f.id+'" title="删除文件夹"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>':"")+
      '</button>';
  });
  html+='<button class="fchip newf" data-fold-new="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新建文件夹</button>';
  row.innerHTML=html;
}
function visibleItems(){
  var q=state.q.trim().toLowerCase();
  return DB.items.filter(function(it){
    if(state.folder&&(it.folder||"")!==state.folder)return false;
    if(state.filter==="embed"&&it.type!=="embed")return false;
    if(state.filter==="ref"&&it.type!=="ref")return false;
    if(!q)return true;
    var hay=(it.name+" "+(it.tags||[]).join(" ")+" "+(it.path||"")).toLowerCase();
    return hay.indexOf(q)>=0;
  }).sort(function(a,b){
    if(!!b.pinned!==!!a.pinned)return b.pinned?1:-1;
    return (b.lastOpen||b.addedAt||0)-(a.lastOpen||a.addedAt||0);
  });
}
function cardHTML(it){
  var chips="";
  chips+='<span class="chip '+(it.type==="embed"?"embed":"ref")+'">'+(it.type==="embed"?"已打包":(isWebLink(it)?"网页":"链接"))+"</span>";
  if(it.size)chips+='<span class="chip">'+bytes(it.size)+"</span>";
  if(it.broken)chips+='<span class="chip warn">读取失败</span>';
  if(it.type==="embed"&&!it.html)chips+='<span class="chip warn">缺内容 · 请重新导入</span>';
  (it.tags||[]).slice(0,2).forEach(function(t){
    if(t==="网页"||t==="链接")return;
    chips+='<span class="chip" data-tagchip="1">'+esc(t)+"</span>";
  });
  var fname=folderName(it.folder);
  if(fname)chips+='<span class="chip">'+esc(fname)+"</span>";
  var ck='<span class="ckmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span>';
  return '<article class="card'+(selSet[it.id]?" selected":"")+'" data-id="'+it.id+'">'+ck+
    '<button class="more" data-act="menu" aria-label="更多操作" data-id="'+it.id+'">'+
      '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>'+
    '</button>'+
    '<div class="meta"><div class="name">'+esc(it.name)+'</div>'+
      (it.desc?'<div class="desc">'+esc(it.desc)+'</div>':"")+
      '<div class="tagrow">'+chips+'</div></div></article>';
}
function pillHTML(it){
  var ck='<span class="ckmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span>';
  return '<button class="pill'+((it.type==="ref"&&!isWebLink(it))?" ref":"")+(selSet[it.id]?" selected":"")+'" data-id="'+it.id+'">'+ck+
    '<span class="nm">'+esc(it.name)+'</span>'+
    (it.size?'<span class="sz">'+bytes(it.size)+'</span>':"")+
    '<span class="more" data-act="menu" data-id="'+it.id+'">'+
      '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>'+
    '</span></button>';
}
function renderBody(){
  renderFolderRow();
  var items=visibleItems(), box=$("#appList");
  var total=DB.items.length;
  $("#stat").innerHTML=total?('共 <b>'+total+'</b> 个工具 · 已渲染 <b>'+items.length+'</b>'):"";
  $("#modeTag").textContent = (inFile ? "本地文件模式" : "网页模式") + " · " + APP_VER;

// 优先用 srcdoc 直接注入内容——不依赖 blob: 地址，App 内置浏览器/iOS 预览也能显示
function loadFrame(it){
  var f=$("#frame");
  f.setAttribute("sandbox","allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-downloads allow-pointer-lock allow-orientation-lock allow-presentation allow-top-navigation-by-user-activation");
  if(it.type==="embed"&&it.html){
    f.removeAttribute("src");

  }
  if(it.type==="ref"&&it.path){
    f.srcdoc="";
    f.src=it.path;
    return true;
  }
  return false;
}
function isWebLink(it){return it.type==="ref"&&/^https?:\/\//i.test(it.path||"")}
function openItem(id){
  var it=DB.items.find(function(x){return x.id===id});

  // 网页链接：先试新标签页；被拦截就直接在本页跳转（多数环境会放行）
  if(isWebLink(it)){
    it.lastOpen=Date.now();save();

    try{ location.href=it.path; return }catch(e){}
    // 走到这里说明环境完全禁止跳转，给复制兜底
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(it.path).then(function(){
        toast("此环境禁止跳转，链接已复制——去 Safari 粘贴打开",3200);
      }).catch(function(){ showLinkFallback(it) });

var pending=[];
function guessName(html,filename){
  var m=html.match(/<title[^>]*>([\s\S]{1,120}?)<\/title>/i);
  if(m&&m[1].trim())return m[1].trim().replace(/\s+/g," ");
  var n=filename.replace(/\.html?$/i,"");
  return n||"未命名工具";
}
function guessDesc(html){
  var m=html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']{1,160})["']/i)
       || html.match(/<meta[^>]+content=["']([^"']{1,160})["'][^>]+name=["']description["']/i);
  return m?m[1].trim():"";
}
function readFiles(files){
  var list=Array.prototype.slice.call(files).filter(function(f){return /\.html?$/i.test(f.name)||f.type==="text/html"});
  if(!list.length){toast("请选择 .html 或 .htm 文件");return}
  Promise.all(list.map(function(f){
    return new Promise(function(res){
      var r=new FileReader();
      r.onload=function(){
        var html=String(r.result||"");
        // 收纳盒备份文件：不是工具，拆出里面内嵌的工具逐个导入
        if(html.indexOf('id="seed-data"')>=0){
          try{
            var m2=html.match(/<script id="seed-data" type="application\/json">([\s\S]*?)<\/script>/);
            var seed=JSON.parse(m2[1]);
            var boxItems=(seed.items||[]).filter(function(x){return x.type==="embed"||x.type==="ref"});
            if(boxItems.length){
              // 一个文件对应一个 Promise：打包成数组一次性 resolve（多次 res 只有第一次生效）
              res({file:f,boxList:boxItems.map(function(x){
                return {file:{name:f.name},html:x.type==="embed"?(x.html||""):"",
                  name:x.name||"未命名",desc:x.desc||"",size:x.size||0,boxItem:x};
              })});
              return;
            }
          }catch(e){}
        }
        res({file:f,html:html,name:guessName(html,f.name),desc:guessDesc(html),size:f.size});
      };
      r.onerror=function(){res({file:f,html:"",name:f.name,desc:"",size:f.size,err:true})};
      r.readAsText(f,"utf-8");
    });
  })).then(function(rows){
    // 展开备份文件拆出的工具列表
    var all=[];
    rows.forEach(function(r){
      if(r.boxList){all.push.apply(all,r.boxList)}
      else all.push(r);
    });
    pending=all.filter(function(r){return !r.err});
    var failed=rows.length-pending.filter(function(r){return !r.boxList}).length;
    if(failed)toast(failed+" 个文件读取失败");
    if(!pending.length)return;
    showImportSheet();
  });
}
function showImportSheet(){
  var body='<p class="hint" style="margin-top:0">已读取 '+pending.length+' 个文件。确认后它们会被内嵌进收纳盒，可以再导出一个完整的单文件保存起来。</p><div class="import-list">'+
    pending.map(function(r,i){
      return '<div class="imp-row"><div class="ico">HTML</div><div class="txt">'+
        '<div class="t1">'+esc(r.name)+'</div><div class="t2">'+esc(r.file.name)+'</div></div>'+
        '<div class="sz">'+bytes(r.size)+'</div></div>';
    }).join("")+'</div>'+
    '<div class="field"><label for="impMode">保存方式</label>'+
    '<select class="select" id="impMode">'+
    '<option value="embed">内嵌打包（推荐，单文件自包含）</option>'+
    '<option value="ref">只记录路径（需与其他文件放在同一目录）</option>'+
    '</select>'+
    '<div class="hint" id="impModeHint">内嵌打包：把内容直接写进收纳盒，导出后只带一个文件就能用。</div></div>';
  openSheet("导入 HTML",
    body,
    '<button class="btn-ghost" data-act="sheet-cancel">取消</button>'+
    '<button class="btn-primary" style="width:auto;padding:0 16px" data-act="confirm-import">导入 '+pending.length+' 个</button>');
  $("#impMode").addEventListener("change",function(){
    $("#impModeHint").textContent=this.value==="embed"
      ?"内嵌打包：把内容直接写进收纳盒，导出后只带一个文件就能用。"
      :"只记录路径：不复制内容，iPad/Mac 上把收纳盒和这些文件放同一目录即可；iPhone 的「文件」App 打开本地 html 时常有权限限制，建议用内嵌打包。";
  });
}
function doImport(){
  var mode=$("#impMode")?$("#impMode").value:"embed";
  var n=0,total=0;
  pending.forEach(function(r){
    // 去重：同名同大小已存在则跳过
    if(r.boxItem){
      var b=r.boxItem;
      var exist2=DB.items.find(function(x){return x.name===b.name&&(x.size||0)===(b.size||0)&&x.type===b.type});
      if(exist2)return;
      var copy=Object.assign({},b);delete copy._url;
      DB.items.push(normalize(copy));
      n++;total+=b.size||0;
      return;
    }
    var exist=DB.items.find(function(x){return x.name===r.name&&x.size===r.size&&x.type===mode});
    if(exist)return;
    if(mode==="embed"){
      DB.items.push(normalize({
        id:uid(),name:r.name,desc:r.desc,type:"embed",html:r.html,size:r.size,
        addedAt:Date.now(),tags:["导入"],
      }));
      total+=r.size;
    }else{
      DB.items.push(normalize({
        id:uid(),name:r.name,desc:r.desc,type:"ref",path:r.file.name,size:r.size,
        addedAt:Date.now(),tags:["链接"],
      }));
    }
    n++;
  });
  save();render();closeSheet();pending=[];
  if(!n){toast("都已存在，未重复添加");return}
  toast("已导入 "+n+" 个工具"+(mode==="embed"?("，共 "+bytes(total)):""));
  // 网页模式：数据存在站点空间里，无需导出；本地文件模式：尝试静默覆盖，失败才提醒导出
  if(!inFile){ return }
  try{
    var fresh=buildSelfContained();
    if(fresh)tryAutoOverwrite(fresh).then(function(ok){
      if(ok)return;
      setTimeout(function(){
        openSheet("已导入到当前页面",
          '<div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><div>为了以后只打开一个文件就能用，建议现在导出一次<strong>自包含 HTML</strong>。浏览器本地缓存容量有限，大文件不导出的话刷新后可能丢失。</div></div>'+
          '<p class="hint">导出后你会得到一个包含全部工具的新 HTML 文件，覆盖原来那个收纳盒即可。</p>',
          '<button class="btn-ghost" data-act="sheet-cancel">稍后</button>'+
          '<button class="btn-primary" style="width:auto;padding:0 16px" data-act="export">立即导出单文件</button>');
      },420);
    });
  }catch(e){}
}

/* ---------------------- 导出单文件 ---------------------- */
function buildSelfContained(){
  var seed={items:DB.items.map(function(it){
    var o=Object.assign({},it);
    delete o._url;delete o.lastOpen;
    if(o.type!=="embed")delete o.html;
    return o;
  }),settings:{theme:DB.settings.theme||"auto",folders:DB.settings.folders||[],removedSeed:DB.settings.removedSeed||[]}};
  var json=JSON.stringify(seed).replace(/</g,"\\u003c");
  var html=document.documentElement.outerHTML;
  // 找到模板自身的 seed-data 并替换（原件通常是空/旧数据）
  var re=new RegExp('<script id="seed-data" type="application/json">[\\s\\S]*?<\\/script>');
  if(!re.test(html)){ toast("模板损坏，无法导出"); return null }
  // 必须用函数式替换：字符串替换会把工具代码里的 $'、$& 等当作特殊符号，破坏导出文件
  html=html.replace(re,function(){ return '<'+'script id="seed-data" type="application/json">'+json+'<'+'/script>'; });
  // 清掉运行时状态：弹层/查看器/toast/菜单都不能带进导出文件
  var sheetBlock='<div class="sheet-mask" id="mask">'+
    '<div class="sheet" id="sheet" role="dialog" aria-modal="true">'+
    '<div class="sheet-head"><h3 id="sheetTitle"></h3><button class="close" id="sheetClose" aria-label="关闭">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'+
    '</button></div><div class="sheet-body" id="sheetBody"></div>'+
    '<div class="sheet-foot" id="sheetFoot"></div></div></div><div class="menu" id="menu">';
  html=html.replace(/<div class="sheet-mask[^>]*>[\s\S]*?<div class="menu" id="menu">/,sheetBlock);
  html=html.replace(/class="viewer"/g,'class="viewer"');
  html=html.replace(/id="vbar" style="display:none"/g,'id="vbar" style="display:none"');
  html=html.replace(/(<div id="appList">)[\s\S]*?(<\/div>\s*<\/main>)/,'$1$2');
  html=html.replace(/(<div class="toasts" id="toasts">)[\s\S]*?(<\/div>\s*<input type="file")/,'$1$2');
  return "<!DOCTYPE html>\n"+html;
}
/* ============ 文件句柄：选一次文件，之后导入自动覆盖 ============ */
var fsHandle=null;
function fsIdb(){
  return new Promise(function(res,rej){
    try{
      var r=indexedDB.open("htmlbox-fs",1);
      r.onupgradeneeded=function(){ try{r.result.createObjectStore("h")}catch(e){} };
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error)};
    }catch(e){rej(e)}
  });
}
function fsStore(h){ try{ fsIdb().then(function(db){ var tx=db.transaction("h","readwrite"); tx.objectStore("h").put(h,"handle"); }).catch(function(){}) }catch(e){} }
function fsLoad(){ return fsIdb().then(function(db){ return new Promise(function(res){
  try{ var tx=db.transaction("h","readonly"); var q=tx.objectStore("h").get("handle"); q.onsuccess=function(){res(q.result||null)}; q.onerror=function(){res(null)}; }catch(e){res(null)}
}) }).catch(function(){return null}); }
function fsWrite(h,html){ return h.createWritable().then(function(w){ return w.write(new Blob([html],{type:"text/html"})).then(function(){ return w.close() }); }); }
// 若已授权过文件句柄，静默写回；成功返回 true
function tryAutoOverwrite(html){
  return fsLoad().then(function(h){
    if(!h||!h.queryPermission)return false;
    return h.queryPermission({mode:"readwrite"}).then(function(st){
      if(st==="granted")return true;
      return h.requestPermission({mode:"readwrite"}).then(function(s){return s==="granted"}).catch(function(){return false});
    }).then(function(ok){
      if(!ok)return false;
      return fsWrite(h,html).then(function(){ fsHandle=h; toast("已自动覆盖保存到原文件",2200); return true; },
        function(){ return false });
    });
  }).catch(function(){ return false });
}

function downloadText(text,filename){
  var blob=new Blob([text],{type:"text/html;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download=filename;a.rel="noopener";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},8000);
}
function doExport(){
  var html=buildSelfContained();
  if(!html)return;
  // 固定文件名：分享/保存到「文件」时选同一位置，iOS 会提示"替换"，实现覆盖
  var fn="收纳盒.html";
  closeSheet();
  // 优先：已授权过的文件句柄，静默覆盖
  try{
    var done=tryAutoOverwrite(html).then(function(ok){
      if(ok)return;
      doExportFallback(html,fn);
    });
    return;
  }catch(e){}
  doExportFallback(html,fn);
}
function doExportFallback(html,fn){
  // 支持文件系统 API：弹出保存选择器，选同一个文件即可覆盖，并记住句柄
  try{
    if(window.showSaveFilePicker){
      window.showSaveFilePicker({suggestedName:fn,types:[{description:"HTML",accept:{"text/html":[".html",".htm"]}}]})
      .then(function(h){ return fsWrite(h,html).then(function(){ fsStore(h); fsHandle=h; toast("已保存，之后导入会自动覆盖这个文件",2600); }); })
      .catch(function(err){ if(err&&err.name==="AbortError")return; shareExport(html,fn); });
      return;
    }
  }catch(e){}
  shareExport(html,fn);
}
function shareExport(html,fn){
  // iOS 优先用系统分享面板：内置 WebView 里 a[download] 会卡死触摸事件
  try{
    var file=new File([html],fn,{type:"text/html"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).then(function(){  // 不带 title：iOS 会把标题存成一个多余的小文本文件
        toast("已通过分享面板导出");
      }).catch(function(err){
        if(err&&err.name==="AbortError")return;
        downloadText(html,fn);
        showExportSheet(fn);
      });
      return;
    }
  }catch(e){}
  downloadText(html,fn);
  showExportSheet(fn);
}
function showExportSheet(fn){
  openSheet("已开始下载",
      '<div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><div>如果浏览器没有自动保存：点地址栏左边的 <strong>aA / 分享按钮</strong> →「下载」，或长按本页链接选择「下载链接文件」。文件会存到「文件」App 的「下载」里。</div></div>'+
      '<p class="hint">以后直接打开这个新文件，所有工具都在里面。</p>',
      '<button class="btn-primary" style="width:auto;padding:0 16px" data-act="sheet-cancel">知道了</button>');
}
function copySelfContained(){
  var html=buildSelfContained();if(!html)return;
  navigator.clipboard.writeText(html).then(function(){toast("源码已复制（体积较大，可粘贴到编辑器另存为 .html）",3200)})
  .catch(function(){toast("复制失败，请用导出")});
}

}
function saveManifest(){
  var raw=$("#mf").value.trim();
  var arr;
  try{ arr=JSON.parse(raw||"[]") }catch(e){toast("JSON 格式有误："+e.message,3200);return}
  if(!Array.isArray(arr)){toast("清单必须是数组");return}
  var byName={};
  DB.items.forEach(function(it){byName[(it.name||"")+"|"+(it.path||it.id)]=it});
  var next=[];
  arr.forEach(function(row,i){
    if(!row||typeof row!=="object")return;
    var exist=DB.items[i]&&DB.items[i].type==="ref"?null:null;
    // 按 name+file 匹配原条目
    var found=DB.items.find(function(x){
      return x.name===(row.name||"")&&((x.path||"")===(row.file||row.url||"")||x.type==="embed");
    });
    if(row.type==="ref"||row.file||row.url){
      next.push(normalize({
        id:(found&&found.id)||uid(),name:row.name||"未命名",
        desc:row.desc||"",type:"ref",path:row.file||row.url||"",size:row.size||0,
        tags:["链接"],addedAt:(found&&found.addedAt)||Date.now(),builtin:!!row.builtin
      }));
    }else if(found){
      next.push(found);
    }else{
      next.push(normalize({id:uid(),name:row.name||"未命名",desc:row.desc||"",type:"embed",html:"",tags:["清单"],addedAt:Date.now()}));
    }
  });
  // 把未出现在清单里的内嵌条目也算作删除

}

function hideMenu(){ $("#menu").classList.remove("on"); menuFor=null }
document.addEventListener("click",function(e){
  if(!e.target.closest("#menu"))hideMenu();
});
$("#menu").addEventListener("click",function(e){
  var b=e.target.closest("[data-mact]");if(!b||!menuFor)return;
  var act=b.getAttribute("data-mact"),id=menuFor.id;
  var it=DB.items.find(function(a){return a.id===id});
  hideMenu();
  if(!it)return;
  if(act==="open"){ openItem(id) }
  if(act==="newwin"){
    var u=(it.type==="ref"&&it.path)?it.path:null;
    if(u)window.open(u,"_blank","noopener");

  }

  if(act==="move"){ selSet={};selSet[id]=true;showMoveSheet() }
  if(act==="copylink"){
    var cu=b.getAttribute("data-url");

});

/* ============ 事件委托（主交互层） ============ */
document.addEventListener("click",function(e){
  var t=e.target;

  // 卡片菜单按钮
  var more=t.closest('[data-act="menu"]');
  if(more){
    e.preventDefault();e.stopPropagation();
    var r=more.getBoundingClientRect();
    showMenu(r.right-8,r.bottom+6,more.getAttribute("data-id"),"card");
    return;
  }
  // 点灰色标签快速编辑
  var tagchip=t.closest(".chip[data-tagchip]");
  if(tagchip&&!selMode){
    var tc=tagchip.closest("[data-id]");
    if(tc){showEdit(tc.getAttribute("data-id"));return}
  }
  var card=t.closest(".card");
  if(card&&!t.closest(".more")){
    if(selMode){toggleSel(card.getAttribute("data-id"));return}
    openItem(card.getAttribute("data-id"));
    return;
  }
  var pill=t.closest(".pill");
  if(pill&&!t.closest(".more")){
    if(selMode){toggleSel(pill.getAttribute("data-id"));return}
    openItem(pill.getAttribute("data-id"));
    return;
  }
  // 文件夹行
  var fdx=t.closest("[data-fold-del]");
  if(fdx){showDelFolder(fdx.getAttribute("data-fold-del"));return}
  var fdn=t.closest("[data-fold-new]");
  if(fdn){showNewFolder();return}
  var fd=t.closest("[data-fold]");
  if(fd){
    state.folder=fd.getAttribute("data-fold");render();return;
  }
  // 多选条
  if(t.closest('[data-act="sel-exit"]')){exitSelect();return}
  if(t.closest('[data-act="sel-del"]')){selDelete();return}
  if(t.closest('[data-act="sel-move"]')){showMoveSheet();return}
  var mvb=t.closest("[data-move-to]");
  if(mvb){closeSheet();moveToFolder(mvb.getAttribute("data-move-to"));return}
  var cl=t.closest('[data-act="copy-link"]');
  if(cl){
    var u1=cl.getAttribute("data-url");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(u1).then(function(){toast("已复制，去 Safari 粘贴打开",2600);closeSheet()})
      .catch(function(){toast("复制失败",2000)});
    }else toast("此环境不支持复制");
    return;
  }
  var nl=t.closest('[data-act="nav-link"]');
  if(nl){location.href=nl.getAttribute("data-url");return}
  var vb=t.closest("#btnSel");
  if(vb){enterSelect();return}
  var vb2=t.closest("#btnView");
  if(vb2){ setView(viewMode()==="compact"?"card":"compact"); return }
  if(t.closest("#dropTail")){
    showAddSheet();
    return;
  }

  var btn=t.closest("[data-act]");
  if(!btn)return;
  var act=btn.getAttribute("data-act");
  switch(act){
    case "add": showAddSheet(); break;
    case "pick-file": $("#filePick").click(); break;
    case "paste-import": showPasteImport(); break;
    case "confirm-paste": doPasteImport(); break;
    case "add-link": showLinkAdd(); break;
    case "confirm-link": doLinkAdd(); break;
    case "confirm-folder": confirmNewFolder(); break;
    case "confirm-folder-del": confirmDelFolder($("#sheetFoot").lastElementChild.dataset.foldDelId); break;
    case "confirm-sel-del": selDeleteConfirm(); break;
    case "show-add": showAddSheet(); break;
    case "sheet-cancel": closeSheet(); break;
    case "confirm-import": doImport(); break;
    case "save-manifest": saveManifest(); break;
    case "save-edit": saveEdit(); break;
    case "export": doExport(); break;
    case "copy": copySelfContained(); break;
    case "confirm-del": deleteItem(btn.dataset.delId); break;
    case "help": showHelp(); break;
    case "restore-builtin": restoreBuiltin(); break;
  }
});

function deleteItem(id){
  var idx=DB.items.findIndex(function(x){return x.id===id});
  if(idx<0){closeSheet();return}
  var it=DB.items[idx];
  if(it.builtin){
    DB.settings.removedSeed=(DB.settings.removedSeed||[]);
    if(DB.settings.removedSeed.indexOf(it.builtinId||it.id)<0)DB.settings.removedSeed.push(it.builtinId||it.id);
  }
  DB.items.splice(idx,1);
  save();render();closeSheet();toast("已删除");
}
function restoreBuiltin(){
  DB.settings.removedSeed=[];
  save();closeSheet();
  toast("已恢复，刷新页面后出现内置示例",2600);
}

/* ---------------------- 多选 ---------------------- */
function enterSelect(){
  selMode=true;selSet={};
  document.body.classList.add("selecting");
  $("#selbar").classList.add("on");
  $("#selCnt").textContent="0";
  $("#btnSel").style.background="var(--brand-soft)";
  $("#btnSel").style.color="var(--brand)";
  render();
}
function exitSelect(){
  selMode=false;selSet={};
  document.body.classList.remove("selecting");
  $("#selbar").classList.remove("on");
  $("#btnSel").style.background="";
  $("#btnSel").style.color="";
  render();
}
function toggleSel(id){
  if(selSet[id])delete selSet[id];else selSet[id]=true;
  $("#selCnt").textContent=Object.keys(selSet).length;
  var el=document.querySelector('[data-id="'+id+'"]');
  if(el)el.classList.toggle("selected",!!selSet[id]);
}
function selDelete(){
  var ids=Object.keys(selSet);
  if(!ids.length){toast("先勾选要删除的项目");return}
  openSheet("删除 "+ids.length+" 个项目？",
    '<p class="hint" style="margin-top:0">只从收纳盒移除，不会删除原文件。'+(ids.some(function(id){var it=DB.items.find(function(x){return x.id===id});return it&&it.builtin})?"其中包含内置示例，可在使用说明里恢复。":"")+'</p>',
    '<button class="btn-ghost" data-act="sheet-cancel">取消</button>'+
    '<button class="btn-primary" style="width:auto;padding:0 16px;background:var(--danger);box-shadow:none" data-act="confirm-sel-del">删除</button>');
}
function selDeleteConfirm(){
  Object.keys(selSet).forEach(function(id){
    var it=DB.items.find(function(x){return x.id===id});
    if(it&&it.builtin){
      DB.settings.removedSeed=(DB.settings.removedSeed||[]);
      if(DB.settings.removedSeed.indexOf(it.builtinId||it.id)<0)DB.settings.removedSeed.push(it.builtinId||it.id);
    }
    DB.items=DB.items.filter(function(x){return x.id!==id});
  });
  var n=Object.keys(selSet).length;selSet={};
  save();closeSheet();exitSelect();toast("已删除 "+n+" 个");
}

  save();render();closeSheet();toast("已创建「"+name+"」");
}
function showDelFolder(fid){
  var f=folders().find(function(x){return x.id===fid});if(!f)return;
  var n=DB.items.filter(function(x){return x.folder===fid}).length;
  openSheet("删除文件夹「"+f.name+"」？",

function confirmDelFolder(fid){
  folders().splice(folders().findIndex(function(x){return x.id===fid}),1);

  if(state.folder===fid)state.folder="";

function showMoveSheet(){
  var ids=Object.keys(selSet);

    }).join("")+
    '</div><p class="hint">想把它们放进新文件夹？先取消，去顶部「新建文件夹」。</p>';

    '<button class="btn-ghost" data-act="sheet-cancel">取消</button>');

function moveToFolder(fid){
  Object.keys(selSet).forEach(function(id){
    var it=DB.items.find(function(x){return x.id===id});
    if(it)it.folder=fid;
  });
  save();exitSelect();
  toast(fid?("已移入「"+folderName(fid)+"」"):"已移出文件夹");
}

function doLinkAdd(){
  var url=$("#link-url").value.trim();
  if(!url){toast("请输入网址");return}
  if(!/^https?:\/\//i.test(url)){
    if(/^[\w-]+(\.[\w-]+)+/.test(url))url="https://"+url;
    else{toast("网址格式不对，要像 example.com 这样");return}
  }
  var name=$("#link-name").value.trim();
  if(!name){
    try{name=new URL(url).hostname.replace(/^www\./,"")}catch(e){name=url}
  }
  var exist=DB.items.find(function(x){return x.type==="ref"&&x.path===url});
  if(exist){toast("这个链接已经收藏过了");return}
  DB.items.push(normalize({
    id:uid(),name:name,desc:url,type:"ref",path:url,
    tags:[],addedAt:Date.now()
  }));
  save();render();closeSheet();
  toast("已收藏「"+name+"」");
}

/* ============ PWA：manifest / 图标 / SW 全部内联 ============ */
(function setupPWA(){
  // 图标：内联 SVG data URI（iOS 需要 png，SVG 会退化为截图，这里用 canvas 生成 png）
  function drawIcon(size,inset){
    var c=document.createElement("canvas");c.width=c.height=size;
    var x=c.getContext("2d");
    var g=x.createLinearGradient(0,0,size,size);
    g.addColorStop(0,"#3b6cff");g.addColorStop(1,"#8a5bff");
    x.fillStyle=g;
    var r=size*0.22,pad=size*inset*0.5||0;
    // 圆角矩形
    x.beginPath();
    if(x.roundRect){ x.roundRect(pad,pad,size-pad*2,size-pad*2,r) } else { x.rect(pad,pad,size,size) }
    x.fill();
    // 三层盒子线条
    x.strokeStyle="rgba(255,255,255,.95)";x.lineWidth=size*0.045;
    x.lineJoin="round";x.lineCap="round";
    var cx=size/2, w=size*0.26, h=size*0.13, y0=size*0.36;
    for(var i=0;i<3;i++){
      var cy=y0+i*h*1.55;
      x.beginPath();
      x.moveTo(cx-w,cy-h*0.18);
      x.lineTo(cx,cy-h*0.95);
      x.lineTo(cx+w,cy-h*0.18);
      x.lineTo(cx,cy+h*0.6);
      x.closePath();
      x.globalAlpha=i===0?1:(i===1?0.6:0.35);
      x.stroke();
    }
    x.globalAlpha=1;
    return c;
  }
  var icon192=drawIcon(192,0.16).toDataURL("image/png");
  var icon512=drawIcon(512,0.16).toDataURL("image/png");
  var iconApple=drawIcon(180,0.02).toDataURL("image/png");
  var iconMask=drawIcon(512,0.24).toDataURL("image/png");
  $("#app-icon").setAttribute("href",iconApple);

  // manifest：blob URL（file:// 下 Safari 不认 blob manifest，所以只在 http 下挂）
  try{
    var mf={
      name:"收纳盒 · HTML 工作台",short_name:"收纳盒",
      start_url:location.pathname+location.search,
      display:"standalone",background_color:"#eceffb",theme_color:"#5a5fd8",
      orientation:"any",lang:"zh-CN",
      icons:[
        {src:icon192,sizes:"192x192",type:"image/png",purpose:"any"},
        {src:icon512,sizes:"512x512",type:"image/png",purpose:"any"},
        {src:iconMask,sizes:"512x512",type:"image/png",purpose:"maskable"}
      ]
    };
    var blob=new Blob([JSON.stringify(mf)],{type:"application/manifest+json"});
    if(location.protocol!=="file:"){
      $("#app-manifest").setAttribute("href",URL.createObjectURL(blob));
    }else{
      $("#app-manifest").setAttribute("href","data:application/manifest+json;charset=utf-8,"+encodeURIComponent(JSON.stringify(mf)));
    }
  }catch(e){}

  // service worker：把整页缓存，实现离线（仅 http/https）
  if("serviceWorker" in navigator&&location.protocol!=="file:"){
    var swCode=[
      "const C='htmlbox-v1';",
      "self.addEventListener('install',e=>{self.skipWaiting()});",
      "self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim())});",
      "self.addEventListener('fetch',e=>{",
      "  const req=e.request;if(req.method!=='GET')return;",
      "  e.respondWith((async()=>{",
      "    const c=await caches.open(C);",
      "    const hit=await c.match(req,{ignoreSearch:true});",
      "    if(hit)return hit;",
      "    try{const res=await fetch(req);if(res&&res.ok&&new URL(req.url).origin===location.origin){c.put(req,res.clone())}return res}",
      "    catch(err){const f=await c.match(location.pathname);if(f)return f;throw err}",
      "  })());",
      "});"
    ].join("\n");
    var swUrl=URL.createObjectURL(new Blob([swCode],{type:"text/javascript"}));
    navigator.serviceWorker.register(swUrl,{scope:"./"}).catch(function(){ /* 忽略 */ });
  }
})();
