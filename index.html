/* 分组展开筛选弹层：点选筛选 / 置顶 / 编辑（重命名、删除、拖动排序） */
var gfEdit={};
/* 编辑对象：grp=编辑分组（重命名/删除/置顶/排序）；mk=编辑制作者（重命名/排序）。
   两个对象在筛选弹层顶部直接切换，同一时间只让一种进入可编辑状态 */
var gfEditTarget={};
/* 分组流程专用弹层：顶部固定、高度随内容自适应（不再用 JS 写像素高） */
function gfSheet(title,bodyHTML,footHTML,headHTML){
  openSheet(title,bodyHTML,footHTML,headHTML);          /* 先按普通弹层复位旧状态 */
  $("#mask").classList.add("gf-flow");                  /* 分组流程再启用贴顶自适应布局 */
  /* 高度完全交给 CSS（height:auto + 内容区视口上限）。
     之前用 JS 量内容高度再写死：在部分 iOS WebView 里切换内容那一帧会量到旧布局，
     弹层被锁死压扁、列表只剩一两行，校准 / 收敛循环都只能缓解。
     自适应布局下弹层永远等于内容自然高度，不存在锁死；
     切换时给内容 150ms 轻微淡入，柔化高度变化 */
  var sb=$("#sheetBody");
  if(sb&&sb.animate){try{sb.animate([{opacity:.5},{opacity:1}],{duration:150,easing:"ease-out"})}catch(e){}}
}
/* 制作者显示顺序：settings.makerOrder 里记录的顺序优先，新出现的制作者依次追加在后面 */
function makerOrderApply(page,mks){
  var o=DB.settings.makerOrder&&DB.settings.makerOrder[page];
  if(!Array.isArray(o))return mks;
  var seen={},out=[];
  o.forEach(function(m){if(mks.indexOf(m)>=0&&!seen[m]){seen[m]=1;out.push(m)}});
  mks.forEach(function(m){if(!seen[m]){seen[m]=1;out.push(m)}});
  return out;
}
function showGroupFilter(page){
  var edit=!!gfEdit[page];
  var mkgEdit=edit&&(gfEditTarget[page]||"grp")==="mk";
  var grpEdit=edit&&!mkgEdit;
  var cur=gfGetCur(page),gs=gfGroups(page),pin=pinnedGroups(page);
  var items=gfItems(page);
  var cnt=function(g){return items.filter(function(x){return String(x.pgroup||"").trim()===g}).length};
  /* 排列样式：行式（默认，可重命名 / 删除 / 拖动）/ 流动胶囊（点胶囊筛选，宽度随文字走自动换行）。
     编辑分组时强制行式——重命名、删除、拖动排序都需要完整的一行；编辑制作者时分组只作展示 */
  var pills=DB.settings.gfLayout==="pills"&&!grpEdit;
  /* 「编辑 / 完成」放弹层固定头部，「＋ 新建分组 / 显示全部分组」放固定底部，
     分组再多也不会跟着列表滚走；只有 .gflist 内容随 .sheet-body 单层滚动 */
  var head='<button class="gfedit-btn'+(edit?" on":"")+'" data-act="gf-edit" data-gfpage="'+page+'">'+(edit?"完成":"编辑")+'</button>';
  var layBtn='<button class="gfedit-btn" data-act="gf-layout" data-gfpage="'+page+'">'+(pills?"列表排列":"胶囊排列")+'</button>';
  /* 编辑态：上方直接切换「编辑分组 / 编辑制作者」，避免两种标签的可编辑行混在一起 */
  var tgtBtns=edit?('<span style="display:flex;gap:6px;flex:none">'+
    '<button class="gfedit-btn'+(grpEdit?" on":"")+'" data-act="gf-edittgt" data-v="grp" data-gfpage="'+page+'">编辑分组</button>'+
    '<button class="gfedit-btn'+(mkgEdit?" on":"")+'" data-act="gf-edittgt" data-v="mk" data-gfpage="'+page+'">编辑制作者</button></span>'):"";
  var body='<div class="gfhead"><span class="lbl">'+(edit?(grpEdit?'编辑分组':'编辑制作者'):(pills?'点胶囊筛选 · 右上「编辑」管理分组':'点分组名筛选 · 编辑里管理置顶'))+'</span>'+(edit?tgtBtns:layBtn)+'</div>';
  body+='<div class="gflist'+(pills?" gfpills":"")+'" id="gfList" data-gfpage="'+page+'">';
  var row=function(val,label,extra,on,isGroup){
    /* 默认「全部不置顶」不高亮；真正设置过置顶后才把已置顶行标出来 */
    var hi=!!pin&&on;
    /* 「全部」保留选中高亮；单独选中某个分组不留任何浅色选中态 */
    var onCls=(cur===val&&val==="all")?" on":"";
    if(pills){
      /* 胶囊排列：分组 / 全部 / 未分组都是流动胶囊，点一下直接筛选 */
      return '<button class="gfpillchip'+(hi?" on":"")+onCls+'" data-gfpick="'+esc(val)+'" data-gfpage="'+page+'">'+
        esc(label)+(extra?'<span class="n">'+esc(extra)+'</span>':"")+'</button>';
    }
    var pinBtn='<button class="gfpin'+(on?" on":"")+'" data-gfpin="'+esc(val)+'" data-gfpage="'+page+'">'+(on?"取消置顶":"置顶")+'</button>';
    if(grpEdit&&isGroup){
      return '<div class="gfrow gfedit'+(hi?" gf-pin":"")+'" data-gfname="'+esc(val)+'">'+
        '<span class="gfdrag" title="拖动排序">⠿</span>'+
        '<span class="gfpick" style="flex:1">'+esc(label)+(extra?'<span class="n">'+esc(extra)+'</span>':"")+'</span>'+
        '<button class="gfmini" data-act="gf-rename" data-gfpage="'+page+'" data-gfname="'+esc(val)+'" title="重命名">✎</button>'+
        '<button class="gfmini danger" data-act="gf-del" data-gfpage="'+page+'" data-gfname="'+esc(val)+'" title="删除分组">×</button>'+
        pinBtn+'</div>';
    }
    return '<div class="gfrow'+(hi?" gf-pin":"")+'">'+
      '<button class="gfpick'+onCls+'" data-gfpick="'+esc(val)+'" data-gfpage="'+page+'">'+
      esc(label)+(extra?'<span class="n">'+esc(extra)+'</span>':"")+'</button>'+
      '</div>';
  };
  body+=row("all","全部","",false,false);
  if(!gs.length)body+='<p class="hint" style="padding:10px 4px">还没有分组。在条目的 ⋯ 菜单里点「设置分组」即可创建。</p>';
  else gs.forEach(function(g){body+=row(g,g,cnt(g)+" 个",pin?pin.indexOf(g)>=0:false,true)});
  body+=row("ug","未分组","",false,false);
  body+='</div>';
  /* 进度条库 / 图标库：制作者筛选独立区块。
     「未归类」永远排在最前面，数量为 0 时整个胶囊不显示；
     编辑状态下改成整行，左侧 ⠿ 长按拖动可调整制作者显示顺序（顺序随备份走） */
  if(page==="pg"||page==="icon"){
    var mkSt=page==="pg"?pgState:iconState;
    var mkType=page==="pg"?"progress":"icon";
    var mkSeen={},mks=[],nNone=0;
    DB.items.forEach(function(x){
      if(x.type!==mkType)return;
      var m=String(x.maker||"").trim();
      if(m){if(!mkSeen[m]){mkSeen[m]=1;mks.push(m)}}
      else nNone++;
    });
    mks=makerOrderApply(page,mks);
    /* 漏填的都补上以后「未归类」会消失；若之前正筛选它，顺手清掉避免空列表 */
    if(!nNone&&mkSt.maker==="__none__")mkSt.maker="";
    body+='<div class="gfhead" style="margin-top:14px"><span class="lbl">制作者'+(mkgEdit?'（长按 ⠿ 排序 · ✎ 重命名）':'')+'</span>'+
      (mkSt.maker?'<button class="gfedit-btn" data-act="gf-mk-clear" data-gfpage="'+page+'">清除筛选</button>':"")+'</div>';
    if(!mks.length&&!nNone)body+='<p class="hint" style="padding:6px 4px 0">还没有制作者。导入 SVG 时填写，或在条目 ⋯ 菜单里点「设置制作者」。</p>';
    else if(mkgEdit){
      body+='<div class="gflist" id="gfMakerList" data-gfpage="'+page+'">';
      if(nNone)body+='<div class="gfrow"><span class="gfpick" style="flex:1;padding-left:26px;color:var(--text-3)">未归类<span class="n">'+nNone+'</span></span><span class="gfmini" title="固定排在最前">⇤</span></div>';
      mks.forEach(function(m){
        var n=DB.items.filter(function(x){return x.type===mkType&&String(x.maker||"").trim()===m}).length;
        body+='<div class="gfrow gfedit" data-mkname="'+esc(m)+'">'+
          '<span class="gfdrag" title="长按拖动排序">⠿</span>'+
          '<span class="gfpick" style="flex:1">'+esc(m)+'<span class="n">'+n+'</span></span>'+
          '<button class="gfmini" data-act="gf-mk-rename" data-gfpage="'+page+'" data-mkname="'+esc(m)+'" title="重命名">✎</button>'+
          '</div>';
      });
      body+='</div>';
    }else{
      var mkChips=[];
      if(nNone)mkChips.push('<button class="gfpillchip'+(mkSt.maker==="__none__"?" on":"")+'" data-gfmk="__none__" data-gfpage="'+page+'">未归类<span class="n">'+nNone+'</span></button>');
      mks.forEach(function(m){
        var n=DB.items.filter(function(x){return x.type===mkType&&String(x.maker||"").trim()===m}).length;
        mkChips.push('<button class="gfpillchip'+(mkSt.maker===m?" on":"")+'" data-gfmk="'+esc(m)+'" data-gfpage="'+page+'">'+esc(m)+'<span class="n">'+n+'</span></button>');
      });
      body+='<div class="gflist gfpills">'+mkChips.join("")+'</div>';
    }
  }
  /* 进度条库：进度类型筛选（全文进度 / 章节进度 / 纯装饰），与制作者筛选同款交互 */
  if(page==="pg"&&!edit){
    var nFull=0,nChap=0,nDeco=0;
    DB.items.forEach(function(x){ if(x.type!=="progress")return; var sc=pgScopeOf(x); if(sc==="chapter")nChap++;else if(sc==="deco")nDeco++;else nFull++ });
    body+='<div class="gfhead" style="margin-top:14px"><span class="lbl">进度类型</span>'+
      (pgState.scope?'<button class="gfedit-btn" data-act="gf-sc-clear" data-gfpage="pg">清除筛选</button>':"")+'</div>';
    body+='<div class="gflist gfpills">'+
      '<button class="gfpillchip'+(pgState.scope==="full"?" on":"")+'" data-gfsc="full" data-gfpage="pg">全文进度<span class="n">'+nFull+'</span></button>'+
      '<button class="gfpillchip'+(pgState.scope==="chapter"?" on":"")+'" data-gfsc="chapter" data-gfpage="pg">章节进度<span class="n">'+nChap+'</span></button>'+
      '<button class="gfpillchip'+(pgState.scope==="deco"?" on":"")+'" data-gfsc="deco" data-gfpage="pg">纯装饰<span class="n">'+nDeco+'</span></button>'+
      '</div>';
  }
  body+='<p class="hint" style="margin-top:10px">'+
    (grpEdit?'拖动左侧 ⠿ 调整顺序；「置顶」把常用分组固定到页面顶部；删除分组后，文件会回到「未分组」。':mkgEdit?'拖动制作者左侧 ⠿ 调整显示顺序，点 ✎ 可重命名：该制作者下的全部条目会一起改名，排序位置保留。':(pills?'点胶囊直接筛选；点「列表排列」换回整行样式。已置顶的分组会固定显示在页面顶部。':'点分组名直接筛选；点右上角「编辑」可置顶、重命名、删除分组或调整顺序。已置顶的分组会固定显示在页面顶部。'))+'</p>';
  var foot=((edit&&grpEdit)?'<button class="btn-ghost gf-foot-main" data-act="gf-showall" data-gfpage="'+page+'">显示全部分组</button>':
           (!edit?'<button class="btn-ghost gf-foot-main" style="color:var(--brand);font-weight:700" data-act="gf-new" data-gfpage="'+page+'">＋ 新建分组</button>':""))+
           '<button class="btn-ghost" data-act="gf-close" data-gfpage="'+page+'">关闭</button>';
  gfSheet("分组筛选 · 置顶",body,foot,head);
  if(grpEdit)gfBindDrag(page);
  if(mkgEdit)gfBindMakerDrag(page);
}
function gfSetGroup(page,val){
  /* 点「全部」= 看全部：顺手清掉制作者筛选，不用再手动点「清除筛选」 */
  if(val==="all"){ if(page==="icon")iconState.maker="";else pgState.maker="" }
  gfSetCur(page,val);gfRerender(page);
  gfEdit[page]=false;closeSheet();
}
function gfTogglePin(page,g){
  var m=DB.settings.pinnedGroups||(DB.settings.pinnedGroups={});
  var cur=pinnedGroups(page);
  var arr=cur?cur.slice():[];   /* 默认「全部不置顶」：从空集合开始，点谁置顶谁 */
  var i=arr.indexOf(g);
  if(i>=0)arr.splice(i,1);else arr.push(g);
  m[page]=arr;
  save();gfRerender(page);showGroupFilter(page);
  toast(arr.indexOf(g)>=0?"已置顶到页面":"已从页面收起，可在筛选里找到");
}
function gfShowAll(page){
  var m=DB.settings.pinnedGroups||(DB.settings.pinnedGroups={});
  m[page]=[];   /* 全部不置顶；空数组不参与分段栏过滤，分组仍全部显示 */
  save();gfRerender(page);showGroupFilter(page);
  toast("已显示全部分组，全部不置顶");
}

function gfRenameSheet(page,g){

function gfRenameGo(page,oldN){
  var el=$("#gf-newname"),nw=el?String(el.value||"").trim():"";
  if(!nw){toast("名称不能为空");return}
  if(nw!==oldN){
    if(gfGroups(page).indexOf(nw)>=0){toast("已经有同名分组了");return}
    gfItems(page).forEach(function(x){if(String(x.pgroup||"").trim()===oldN)x.pgroup=nw});
    var m=DB.settings.pinnedGroups;
    if(m&&Array.isArray(m[page]))m[page]=m[page].map(function(g){return g===oldN?nw:g});
    var o=DB.settings.groupOrder;
    if(o&&Array.isArray(o[page]))o[page]=o[page].map(function(g){return g===oldN?nw:g});
    var ex=DB.settings.extraGroups;
    if(ex&&Array.isArray(ex[page]))ex[page]=ex[page].map(function(g){return g===oldN?nw:g});
    if(gfGetCur(page)===oldN)gfSetCur(page,nw);
    if(page==="box")boxSyncSize();
    save();gfRerender(page);
    toast("已改名为「"+nw+"」");
  }
  gfEdit[page]=true;showGroupFilter(page);
}
/* ---- 制作者重命名（编辑制作者态，✎）：该制作者下所有条目一起改名 ---- */
function gfMkRenameSheet(page,oldN){
  gfSheet("重命名制作者",
    '<div class="field"><label for="gf-mk-new">制作者名字</label>'+
    '<input class="input" id="gf-mk-new" maxlength="20" value="'+esc(oldN)+'"></div>'+
    '<p class="hint">保存后，这个制作者下的全部'+((page==="icon")?"图标":"进度条")+'会一起换成新名字，排序位置保留；当前筛选也会跟着更新。</p>',

function gfMkRenameGo(page,oldN){

  if(!nw){toast("名字不能为空");return}

    var exists=gfItems(page).some(function(x){return String(x.maker||"").trim()===nw});

    if(st.maker===oldN)st.maker=nw;

function gfDeleteGo(page,g){
  gfItems(page).forEach(function(x){if(String(x.pgroup||"").trim()===g)delete x.pgroup});
  var m=DB.settings.pinnedGroups;
  if(m&&Array.isArray(m[page]))m[page]=m[page].filter(function(x){return x!==g});
  var o=DB.settings.groupOrder;
  if(o&&Array.isArray(o[page]))o[page]=o[page].filter(function(x){return x!==g});
  var ex=DB.settings.extraGroups;
  if(ex&&Array.isArray(ex[page]))ex[page]=ex[page].filter(function(x){return x!==g});
  if(gfGetCur(page)===g)gfSetCur(page,"all");
  if(page==="box")boxSyncSize();
  save();gfRerender(page);
  gfEdit[page]=true;showGroupFilter(page);
  toast("已删除分组，文件已回到未分组");
}
/* ---- 分组拖动排序（pointer 事件，手机/桌面通用） ---- */
var gfDrag=null;
function gfBindDrag(page){
  var box=$("#gfList");if(!box)return;
  box.addEventListener("pointerdown",function(e){
    var h=e.target.closest(".gfdrag");if(!h)return;
    var row=h.closest(".gfrow");if(!row)return;
    e.preventDefault();
    var r=row.getBoundingClientRect();
    gfDrag={row:row,page:page,ox:e.clientX-r.left,oy:e.clientY-r.top,started:false,ghost:null};
    try{row.setPointerCapture(e.pointerId)}catch(_){}
  });
  box.addEventListener("pointermove",function(e){
    if(!gfDrag||gfDrag.page!==page||!gfDrag.row.isConnected)return;
    if(!gfDrag.started){
      gfDrag.started=true;
      var g=document.createElement("div");g.className="gf-ghost";
      g.textContent=gfDrag.row.getAttribute("data-gfname");
      document.body.appendChild(g);gfDrag.ghost=g;
      gfDrag.row.classList.add("gf-dragging");
    }
    e.preventDefault();
    var gh=gfDrag.ghost;
    gh.style.left=(e.clientX-gfDrag.ox)+"px";
    gh.style.top=(e.clientY-gfDrag.oy)+"px";
    gh.style.display="none";
    var under=document.elementFromPoint(e.clientX,e.clientY);
    gh.style.display="";
    var tgt=under&&under.closest?under.closest(".gfrow.gfedit[data-gfname]"):null;
    if(!tgt||tgt===gfDrag.row||tgt.parentNode!==gfDrag.row.parentNode)return;
    var tr=tgt.getBoundingClientRect();
    tgt.parentNode.insertBefore(gfDrag.row,(e.clientY<tr.top+tr.height/2)?tgt:tgt.nextSibling);
  },{passive:false});
  var end=function(){
    if(!gfDrag)return;
    if(gfDrag.ghost)gfDrag.ghost.remove();
    gfDrag.row.classList.remove("gf-dragging");
    var pg=gfDrag.page;gfDrag=null;
    var names=[].slice.call(document.querySelectorAll("#gfList .gfrow.gfedit[data-gfname]"))
      .map(function(r){return r.getAttribute("data-gfname")});
    if(names.length){
      var o=DB.settings.groupOrder||(DB.settings.groupOrder={});
      o[pg]=names;save();gfRerender(pg);
      toast("分组顺序已保存");
    }
  };
  box.addEventListener("pointerup",end);
  box.addEventListener("pointercancel",end);
}

function importSvgFiles(files,closeAfter){
  var arr=Array.prototype.slice.call(files||[]);
  if(!arr.length)return;
  var bulkMaker=svgimpMakerVal();
  rememberMaker(bulkMaker);
  var left=arr.length,nP=0,nI=0,nBad=0;
  var done=function(){
    save();render();
    if($("#pgPage").classList.contains("on"))renderPgPage();
    if($("#iconPage").classList.contains("on"))renderIconPage();
    if($("#starPage")&&$("#starPage").classList.contains("on"))renderStarPage();
    toast("已导入 "+(nP+nI)+" 个（进度条 "+nP+" / 图标 "+nI+"）"+(nBad?"，"+nBad+" 个文件没找到 SVG":""),2800);
    if(closeAfter)closeSheet();
  };
  var tick=function(){ if(--left===0)done() };
  arr.forEach(function(f){
    var r=new FileReader();
    r.onload=function(){
      var svg=extractSvg(String(r.result||""));
      if(svg){
        var base=String(f.name||"").replace(/\.(txt|svg|text|html?)$/i,"").trim().slice(0,30)||"未命名";
        var k=svgAutoType(svg);
        if(k==="progress")nP++;else nI++;
        var ni={name:base,type:k,svg:svg,size:svg.length};
        if(bulkMaker)ni.maker=bulkMaker;   /* 弹层里填了制作者时，批量导入的全部应用 */
        if(k==="progress"){
          ni.scope=(svgimpScope==="auto")?svgGuessScope(svg):svgimpScope;   /* 进度类型：自动识别或手动指定 */
          if(svgimpScope!=="auto")ni.scopeManual=true;   /* 手动指定的，自愈不覆盖 */
        }
        DB.items.unshift(normalize(ni));
      }else nBad++;
      tick();
    };
    r.onerror=function(){nBad++;tick()};
    r.readAsText(f);
  });
}

function dupOutside(it){
  return DB.items.some(function(x){
    if(x===curBundle)return false;
    if(x.name&&it.name&&x.name===it.name)return true;
    if(isWebLink(it)&&isWebLink(x)){
      var a=String(it.path||"").replace(/\/+$/,"").toLowerCase();
      var b=String(x.path||"").replace(/\/+$/,"").toLowerCase();
      if(a&&b&&a===b)return true;
    }
    return false;
  });
}

/* ---------------------- 弹层 ---------------------- */
var sheetOn=false;
var _sheetScrollY=0;
var _sheetLockCss=null;
function openSheet(title,bodyHTML,footHTML,headHTML){
  var wasOn=sheetOn;
  var sh=document.querySelector(".sheet");
  /* 首次打开：记下底层滚动位置并把 body 固定住，避免 iOS 键盘弹出 / 收起把页面滚走 */
  if(!wasOn){
    var _se=document.scrollingElement||document.documentElement;
    _sheetScrollY=(_se&&_se.scrollTop)||window.scrollY||0;
    var b=document.body;
    _sheetLockCss={position:b.style.position,top:b.style.top,left:b.style.left,right:b.style.right,width:b.style.width,overflow:b.style.overflow};
    b.style.position="fixed";b.style.left="0";b.style.right="0";b.style.width="100%";
    b.style.top=(-_sheetScrollY)+"px";b.style.overflow="hidden";
    document.documentElement.style.overscrollBehavior="none";
  }
  $("#sheetTitle").textContent=title;
  /* 标题行右侧的可选操作区：属于弹层固定头部，不随内容滚动 */
  var hd=document.querySelector(".sheet-head");
  var slot=hd&&hd.querySelector("#sheetHeadSlot");
  if(headHTML){
    if(!slot&&hd){slot=document.createElement("span");slot.id="sheetHeadSlot";hd.insertBefore(slot,$("#sheetClose"));}
    if(slot)slot.innerHTML=headHTML;
  }else if(slot)slot.innerHTML="";
  $("#sheetBody").innerHTML=bodyHTML;
  $("#sheetFoot").innerHTML=footHTML||"";
  /* 普通弹层一律复位「分组筛选」残留的贴顶布局与写死的高度：
     gfSheet 会给遮罩加 gf-flow（align-items:flex-start + margin-top）并给 .sheet 写固定 height，
     同一弹层内换内容时若不清掉，通知 / 信箱 / 使用说明等弹层就会被顶到屏幕上方，
     内容又撑不满那个固定高度，底部便空出一大块。分组流程会在 openSheet 之后重新加回 gf-flow。 */
  $("#mask").classList.remove("gf-flow");
  $("#mask").classList.remove("kb-open");
  $("#mask").style.removeProperty("--vv-top");
  $("#mask").style.removeProperty("--vv-h");
  $("#mask").classList.add("on");
  sheetOn=true;
  if(sh){sh.style.height="";sh.style.minHeight="";sh.style.maxHeight="";sh.classList.remove("stable-short")}
  $("#sheetBody").scrollTop=0;   /* 换内容时弹层内部回到顶部，不继承上一次的滚动位置 */
  // WKWebView 偶发不绘制弹层遮罩：遮罩不可见却拦截全部点击
  setTimeout(forceRepaint,30);
  setTimeout(forceRepaint,400);
}
function closeSheet(){
  $("#mask").classList.remove("on");
  $("#mask").classList.remove("gf-flow");
  $("#mask").classList.remove("kb-open");
  $("#mask").style.removeProperty("--vv-top");
  $("#mask").style.removeProperty("--vv-h");
  sheetOn=false;
  if(typeof gfEdit==="object"&&gfEdit)for(var _gk in gfEdit)gfEdit[_gk]=false;  /* 关掉弹层后下次默认回到查看态 */
  var sh=document.querySelector(".sheet");
  if(sh){sh.style.height="";sh.style.minHeight="";sh.style.maxHeight="";sh.classList.remove("stable-short")}
  /* 先解锁 body，再恢复底层页面滚动位置（主页面用 window 滚动；子页面 window 为 0，恢复无副作用） */
  if(_sheetLockCss){
    var b=document.body,c=_sheetLockCss;
    b.style.position=c.position;b.style.top=c.top;b.style.left=c.left;b.style.right=c.right;
    b.style.width=c.width;b.style.overflow=c.overflow;
    document.documentElement.style.overscrollBehavior="";
    _sheetLockCss=null;
  }
  try{
    var _se=document.scrollingElement||document.documentElement;
    if(_se)_se.scrollTop=_sheetScrollY;
    window.scrollTo(0,_sheetScrollY);
  }catch(_e){}
  setTimeout(function(){ try{ var _se2=document.scrollingElement||document.documentElement; if(_se2)_se2.scrollTop=_sheetScrollY; window.scrollTo(0,_sheetScrollY); }catch(_e){} forceRepaint(); },30);
}

/* ---------------------- 导入 ---------------------- */
var pending=[],pendingFolders=[];
function restorePendingFolders(){
  if(!pendingFolders||!pendingFolders.length)return;
  var added=0,fixed=0;
  pendingFolders.forEach(function(fo){
    if(!fo||!fo.id)return;
    var ex=folders().find(function(x){return x.id===fo.id});
    if(ex){
      /* 已存在：旧版导入曾把子文件夹压平（丢了 p），这里按备份把父子层级补回来 */
      if(fo.p&&!ex.p){ex.p=fo.p;fixed++}
      return;
    }
    var nf={id:fo.id,name:fo.name||"未命名"};
    if(fo.p)nf.p=fo.p;      /* 关键：保留父文件夹 id，子文件夹才不会变成主文件夹 */
    folders().push(nf);added++;
  });
  pendingFolders=[];
  if(added||fixed)toast("已恢复 "+added+" 个文件夹"+(fixed?("，修正 "+fixed+" 处层级"):""),2200);
}
function guessName(html,filename){
  var m=html.match(/<title[^>]*>([\s\S]{1,120}?)<\/title>/i);
  if(m&&m[1].trim())return m[1].trim().replace(/\s+/g," ");
  var n=filename.replace(/\.html?$/i,"");
  return n||"未命名工具";
}
function guessDesc(html){
  var m=html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']{1,160})["']/i)
       || html.match(/<meta[^>]+content=["']([^"']{1,160})["'][^>]+name=["']description["']/i);
  return m?m[1].trim():"";
}
function readFiles(files){
  var list=Array.prototype.slice.call(files).filter(function(f){return /\.html?$/i.test(f.name)||f.type==="text/html"});
  if(!list.length){toast("请选择 .html 或 .htm 文件");return}
  toast(list.length>1?("正在解析 "+list.length+" 个文件…"):"正在解析文件，大文件需要几秒…",1800);
  Promise.all(list.map(function(f){
    return new Promise(function(res){
      var r=new FileReader();
      r.onload=function(){

        var isShelf = html.indexOf('id="seed-data"')>=0 || html.indexOf('seed-data')>=0 && html.indexOf('appList')>=0 || html.indexOf("__hbver")>=0;
        var isShelf = html.indexOf('id="seed-data"')>=0 || html.indexOf('seed-data')>=0 && html.indexOf('appList')>=0 || html.indexOf("__hbver")>=0;

          }catch(e){ parseFail="数据解析失败（"+String(e&&e.message||e).slice(0,40)+"）" }
          if(parseFail||!boxItems||!boxItems.length){
            res({file:f,html:"",name:f.name,desc:"",size:f.size,shelfEmpty:true,legacy:legacyShelf,reason:legacyShelf?"这是老版本的收纳盒文件（工具数据存在浏览器缓存里，文件内没有工具）":(parseFail||"备份里没有工具")});
            return;

          res({file:f,boxList:boxItems,folderList:(seed.settings&&seed.settings.folders)||[]});
          return;
        }
        res({file:f,html:html,name:guessName(html,f.name),desc:guessDesc(html),size:f.size});
      };

function doBundleImport(){
  var groups={};
  var mineFlag=importToMine();
  /* 勾选「文件夹变分组」时，建立 文件夹id -> 文件夹名 映射 */
  var fmap={};
  (pendingFolders||[]).forEach(function(fo){if(fo&&fo.id)fmap[fo.id]=fo.name||"未命名"});
  var asGroup=false,cb=$("#impFolderAsGroup");
  if(cb&&cb.checked&&Object.keys(fmap).length)asGroup=true;
  pending.forEach(function(r){
    if(!r.boxItem)return;
    var k=String((r.file&&r.file.name)||"备份").replace(/\.html?$/i,"")||"备份";
    (groups[k]=groups[k]||[]).push(r.boxItem);
  });
  var n=0;
  Object.keys(groups).forEach(function(k){
    var its=groups[k].map(function(x){
      var c=Object.assign({},x);delete c._url;
      if(asGroup){
        /* 已有分组优先保留；否则按原文件夹名分组，没有文件夹的归入「默认」 */
        var g=String(c.pgroup||"").trim();
        if(!g){g=(c.folder&&fmap[c.folder])?fmap[c.folder]:"默认"}
        c.pgroup=g;
      }
      /* 进度条 / 图标 在盒中盒内单独分组出来（与「文件夹变分组」勾选无关） */
      if(c.type==="progress")c.pgroup="进度条";
      else if(c.type==="icon")c.pgroup="图标";
      return normalize(c);
    });
    var sz=its.reduce(function(a,b){return a+(b.size||0)},0);
    DB.items.push(normalize({
      id:uid(),name:k,desc:"从备份导入的包（"+its.length+" 个内容）",
      type:"bundle",items:its,size:sz,tags:["盒中盒"],addedAt:Date.now(),mine:mineFlag
    }));
    n++;
  });
  pending=[];pendingFolders=[];
  save();render();closeSheet();
  if(!n){toast("备份里没有工具");return}
  toast(asGroup?("已导入 "+n+" 个盒中盒，文件夹已变为盒中盒内分组"):("已导入 "+n+" 个盒中盒，点开即可使用"),2600);
}

/* ---------------------- 导出单文件 ---------------------- */
function buildSelfContained(items){
  var src=(Array.isArray(items)?items:DB.items).map(function(it){
    var o=Object.assign({},it);
    delete o._url;delete o.lastOpen;
    if(o.type!=="embed"&&o.type!=="bundle")delete o.html;
    return o;
  });
  var seed={items:src,settings:{theme:DB.settings.theme||"auto",customTheme:DB.settings.customTheme||[],folders:DB.settings.folders||[],removedSeed:DB.settings.removedSeed||[]}};
  var json=JSON.stringify(seed).replace(/</g,"\\u003c");
  /* 用 DOM 克隆清理导出内容：不再用正则裁剪字符串（旧的区间正则在页面结构变化时会误伤脚本/数据段） */
  var root=document.documentElement.cloneNode(true);
  try{
    var q=function(s){return root.querySelector(s)};
    var se=q("#seed-data");
    if(!se){ toast("模板损坏，无法导出"); return null }
    se.textContent=json; /* 注入当前数据 */
    var st=q("#sheetTitle");if(st)st.textContent="";
    var sb=q("#sheetBody");if(sb)sb.innerHTML="";
    var sf=q("#sheetFoot");if(sf)sf.innerHTML="";
    var me=q("#menu");if(me){me.innerHTML="";me.classList.remove("on")}
    var to=q("#toasts");if(to)to.innerHTML="";
    var vw=q("#viewer");if(vw)vw.classList.remove("on");
    var fr=q("#frame");if(fr){fr.removeAttribute("srcdoc");fr.setAttribute("src","about:blank")}
    var vb=q("#vbar");if(vb)vb.style.display="none";
    var vo=q("#btnVOpen");if(vo)vo.style.display="none";
    /* 运行时注入的 PWA manifest / 苹果图标是 data: 或 blob: 大 URI（本地文件模式下可达数十万字符），
       不属于模板本身；导出时清掉 href，重新打开导出文件后脚本会再生成，功能不受影响 */
    var am=q("#app-manifest"),ai=q("#app-icon");
    if(am)am.removeAttribute("href");
    if(ai)ai.removeAttribute("href");
    var vn=q("#vName");if(vn)vn.textContent="";
    var pp=q("#pgPage");if(pp)pp.classList.remove("on");
    var bb=q("#boxPage");if(bb)bb.classList.remove("on");
    var pl=q("#pgList");if(pl)pl.innerHTML="";
    var bl=q("#boxList");if(bl)bl.innerHTML="";
    var ap=q("#appList");if(ap)ap.innerHTML="";
    var sel=q("#selbar");if(sel){sel.classList.remove("on");var sc=q("#selCnt");if(sc)sc.textContent="0"}
    var bd=q("body");if(bd){bd.classList.remove("selecting","organizing");bd.style.overflow=""}
    var e1=q("#btnMine"),e2=q("#btnEdit");
    if(e1)e1.classList.remove("on");
    if(e2)e2.classList.remove("on");
  }catch(e){}
  return "<!DOCTYPE html>\n"+root.outerHTML;
}
/* ============ 文件句柄：选一次文件，之后导入自动覆盖 ============ */
var fsHandle=null;
function fsIdb(){
  return new Promise(function(res,rej){
    try{
      var r=indexedDB.open("htmlbox-fs",1);
      r.onupgradeneeded=function(){ try{r.result.createObjectStore("h")}catch(e){} };
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error)};
    }catch(e){rej(e)}
  });
}
function fsStore(h){ try{ fsIdb().then(function(db){ var tx=db.transaction("h","readwrite"); tx.objectStore("h").put(h,"handle"); }).catch(function(){}) }catch(e){} }
function fsLoad(){ return fsIdb().then(function(db){ return new Promise(function(res){
  try{ var tx=db.transaction("h","readonly"); var q=tx.objectStore("h").get("handle"); q.onsuccess=function(){res(q.result||null)}; q.onerror=function(){res(null)}; }catch(e){res(null)}
}) }).catch(function(){return null}); }
function fsWrite(h,html){ return h.createWritable().then(function(w){ return w.write(new Blob([html],{type:"text/html"})).then(function(){ return w.close() }); }); }
// 若已授权过文件句柄，静默写回；成功返回 true
function tryAutoOverwrite(html){
  return fsLoad().then(function(h){
    if(!h||!h.queryPermission)return false;
    return h.queryPermission({mode:"readwrite"}).then(function(st){
      if(st==="granted")return true;
      return h.requestPermission({mode:"readwrite"}).then(function(s){return s==="granted"}).catch(function(){return false});
    }).then(function(ok){
      if(!ok)return false;
      return fsWrite(h,html).then(function(){ fsHandle=h; toast("已自动覆盖保存到原文件",2200); return true; },
        function(){ return false });
    });
  }).catch(function(){ return false });
}

function downloadText(text,filename){
  var mime=/\.(svg|txt)$/i.test(filename)?"text/plain;charset=utf-8":"text/html;charset=utf-8";
  var blob=new Blob([text],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download=filename;a.rel="noopener";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},8000);
}
/* ============ 导出网页链接为 TXT：按文件夹分类列出所有网址（含网站名称） ============
   顶层网页链接按所在文件夹（含层级路径）分组，「我的工具」「未分类」单独成组；
   盒中盒里的网页链接归到「盒中盒 · <包名>」组，保证「所有网页网址」都被导出。 */
function exportWebLinksTxt(){
  var groups={},order=[];
  function addTo(g,item){ if(!groups[g]){groups[g]=[];order.push(g)} groups[g].push(item) }
  function groupOf(it){
    if(it.folder){var p=folderPath(it.folder);if(p.length)return p.map(function(f){return f.name}).join(" / ")}
    if(it.mine)return "我的工具";
    return "未分类";
  }
  var total=0;
  DB.items.forEach(function(top){
    if(!top)return;
    if(top.type==="bundle"&&Array.isArray(top.items)){
      var bn="盒中盒 · "+(top.name||"未命名");
      (function walk(list,depth){
        if(!Array.isArray(list)||depth>4)return;
        list.forEach(function(x){
          if(!x)return;
          if(x.type==="bundle"&&Array.isArray(x.items)){walk(x.items,depth+1);return}
          if(isWebLink(x)){addTo(bn,{name:String(x.name||""),url:String(x.path||"")});total++}
        });
      })(top.items,0);
    }else if(isWebLink(top)){
      addTo(groupOf(top),{name:String(top.name||""),url:String(top.path||"")});total++;
    }
  });
  if(!total){toast("还没有收藏任何网页链接");return}
  var L=[];
  L.push("收纳盒 · 网页链接清单");
  L.push("导出时间："+new Date().toLocaleString("zh-CN"));
  L.push("共 "+total+" 个网页链接，按分类排列");
  L.push("");
  /* 横线长度跟随标题：中文/全角按 2 格、英文数字按 1 格计算显示宽度，动态生成同宽分隔线 */
  function txtWidth(s){var w=0;for(var i=0;i<s.length;i++){w+=(s.charCodeAt(i)>0x2e80)?2:1}return w}
  order.forEach(function(g){
    var title="【"+g+"】（"+groups[g].length+"）";
    var bar=new Array(txtWidth(title)+1).join("━");
    L.push(bar);
    L.push(title);
    L.push(bar);
    L.push("");
    groups[g].forEach(function(it){
      /* TXT 是纯文本，无法真正设字号 / 粗体：用「★ + 顶格独占一行 + 网址缩进」把网站名称做成视觉重点 */
      L.push("★ "+(it.name||"（未命名）"));
      L.push("   ↳ "+it.url);
      L.push("");
    });
  });
  downloadText(L.join("\n"),"收纳盒-网页链接.txt");
  toast("已导出 "+total+" 个网页链接");
}

function doSelExportEach(){

function buildEachFiles(its){
  var files=[];
  its.forEach(function(it){
    var safe=String(it.name||"导出").replace(/[\\/:*?"<>|]/g,"_").slice(0,50)||"导出";
    if(it.type==="progress"||it.type==="icon"){
      if(it.svg)files.push(new File([String(it.svg)],safe+".svg",{type:"image/svg+xml;charset=utf-8"}));
    }else if(it.type==="embed"&&it.html){
      files.push(new File([String(it.html)],safe+".html",{type:"text/html;charset=utf-8"}));
    }
  });
  return files;
}
function shareOrDownloadFiles(files,msg){
  closeSheet();
  try{
    if(navigator.canShare&&navigator.canShare({files:files})){
      navigator.share({files:files}).then(function(){toast(msg)})
      .catch(function(err){
        if(err&&err.name==="AbortError")return;
        seqDownload(files);
      });
      return;
    }
  }catch(e){}
  seqDownload(files);
  toast(msg);
}
function seqDownload(files){
  files.forEach(function(f,i){
    setTimeout(function(){
      var r=new FileReader();
      r.onload=function(){downloadText(String(r.result||""),f.name)};
      r.readAsText(f);
    },i*350);
  });
}

function downloadPack(html,fn,msg){

function doExportOne(id,fmt){
  var it=DB.items.find(function(x){return x.id===id});if(!it)return;

  var text=isP?String(it.svg||""):String(it.html||"");
  if(!text){toast("这个条目缺少内容，先重新导入一次");return}
  var safe=String(it.name||"导出").replace(/[\\/:*?"<>|]/g,"_").slice(0,50)||"导出";
  var fn=safe+(fmt==="txt"?".txt":isP?".svg":".html");
  var mime=fmt==="txt"||isP?"text/plain;charset=utf-8":"text/html;charset=utf-8";
  try{
    var file=new File([text],fn,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).then(function(){toast("在系统面板选「存储到文件」即可保存 "+fn)})
      .catch(function(err){
        if(err&&err.name==="AbortError")return;
        downloadText(text,fn);
        toast("已导出「"+it.name+"」");
      });
      return;
    }
  }catch(e){}
  downloadText(text,fn);
  toast("已导出「"+it.name+"」");

function doExport(){
  var html=buildSelfContained();
  if(!html)return;
  // 固定文件名：分享/保存到「文件」时选同一位置，iOS 会提示"替换"，实现覆盖
  var fn="收纳盒备份.html";
  closeSheet();
  // 优先：已授权过的文件句柄，静默覆盖
  try{
    var done=tryAutoOverwrite(html).then(function(ok){
      if(ok)return;
      doExportFallback(html,fn);
    });
    return;
  }catch(e){}
  doExportFallback(html,fn);
}
function doExportFallback(html,fn){
  // 支持文件系统 API：弹出保存选择器，选同一个文件即可覆盖，并记住句柄
  try{
    if(window.showSaveFilePicker){
      window.showSaveFilePicker({suggestedName:fn,types:[{description:"HTML",accept:{"text/html":[".html",".htm"]}}]})
      .then(function(h){ return fsWrite(h,html).then(function(){ fsStore(h); fsHandle=h; toast("已保存，之后导入会自动覆盖这个文件",2600); }); })
      .catch(function(err){ if(err&&err.name==="AbortError")return; shareExport(html,fn); });
      return;
    }
  }catch(e){}
  shareExport(html,fn);
}
function shareExport(html,fn){
  // iOS 优先用系统分享面板：内置 WebView 里 a[download] 会卡死触摸事件
  try{
    var file=new File([html],fn,{type:"text/html"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).then(function(){  // 不带 title：iOS 会把标题存成一个多余的小文本文件
        toast("已通过分享面板导出");
      }).catch(function(err){
        if(err&&err.name==="AbortError")return;
        downloadText(html,fn);
        showExportSheet(fn);
      });
      return;
    }
  }catch(e){}
  downloadText(html,fn);
  showExportSheet(fn);
}

function saveManifest(){
  var raw=$("#mf").value.trim();
  var arr;
  try{ arr=JSON.parse(raw||"[]") }catch(e){toast("JSON 格式有误："+e.message,3200);return}
  if(!Array.isArray(arr)){toast("清单必须是数组");return}
  var byName={};
  DB.items.forEach(function(it){byName[(it.name||"")+"|"+(it.path||it.id)]=it});
  var next=[];
  arr.forEach(function(row,i){
    if(!row||typeof row!=="object")return;
    var exist=DB.items[i]&&DB.items[i].type==="ref"?null:null;
    // 按 name+file 匹配原条目
    var found=DB.items.find(function(x){
      return x.name===(row.name||"")&&((x.path||"")===(row.file||row.url||"")||x.type==="embed");
    });
    if(row.type==="ref"||row.file||row.url){
      next.push(normalize({
        id:(found&&found.id)||uid(),name:row.name||"未命名",
        desc:row.desc||"",type:"ref",path:row.file||row.url||"",size:row.size||0,
        tags:["链接"],addedAt:(found&&found.addedAt)||Date.now(),builtin:!!row.builtin
      }));
    }else if(found){
      next.push(found);
    }else{
      next.push(normalize({id:uid(),name:row.name||"未命名",desc:row.desc||"",type:"embed",html:"",tags:["清单"],addedAt:Date.now()}));
    }
  });
  // 把未出现在清单里的内嵌条目也算作删除
  DB.items=next;save();render();closeSheet();toast("清单已保存");
}

function hideMenu(){ $("#menu").classList.remove("on"); document.body.classList.remove("menu-open"); menuFor=null }

$("#menu").addEventListener("click",function(e){
  var b=e.target.closest("[data-mact]");if(!b||!menuFor)return;
  var act=b.getAttribute("data-mact"),id=menuFor.id;
  /* 盒中盒内部条目的菜单分支 */
  if(menuFor.bx!=null){
    var bidx=menuFor.bx;
    hideMenu();
    if(act==="open")openNested(boxItem(bidx));
    else if(act==="rename")showBoxEdit(bidx);
    else if(act==="moveout")showBoxMoveOut(bidx);
    else if(act==="export")showBoxExport(bidx);
    else if(act==="bgroup")showBoxGroupSheet(bidx);

  }
  var it=DB.items.find(function(a){return a.id===id});
  hideMenu();
  if(!it)return;
  if(act==="open"){ openItem(id) }
  if(act==="newwin"){
    var u=(it.type==="ref"&&it.path)?it.path:null;
    if(u)window.open(u,"_blank","noopener");
    else toast("内嵌工具在收纳盒内打开即可");
  }
  if(act==="rename"){ showEdit(id) }
  if(act==="copy-svg"){
    var sv=String(it.svg||"");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(sv).then(function(){toast("SVG 已复制",2200)}).catch(function(){toast("复制失败")});
    }else toast("当前环境不支持复制");
  }
  if(act==="pin"){ it.pinned=!it.pinned;it.pinnedAt=it.pinned?Date.now():0;save();render();toast(it.pinned?"已置顶，排到最前面":"已取消置顶") }
  if(act==="mine"){ it.mine=it.mine?0:1;save();render();toast(it.mine?"已加入「我的工具」":"已移出「我的工具」") }
  if(act==="star"){ toggleStar(id) }
  if(act==="cover"){ pickCover(id) }
  if(act==="cover-del"){ it.cover="";delete it.cover;save();render();toast("已移除封面，恢复默认缩略图") }
  if(act==="thumbbg"){
    if(it.thumbBg==="dark"){ delete it.thumbBg }
    else it.thumbBg="dark";
    save();
    var dark=it.thumbBg==="dark";
    /* 只改当前 DOM 里这一条的缩略图底色，不重建整个列表——否则列表会跳回顶部。
       数据已 save，其他页面下次打开会按 thumbBg 正确渲染。 */
    var selectors='[data-pg="'+id+'"] .pgthumb,[data-pg="'+id+'"] .pthumb,'+
                  '[data-ic="'+id+'"] .pgthumb,[data-id="'+id+'"] .pthumb';
    [].slice.call(document.querySelectorAll(selectors)).forEach(function(el){
      el.classList.toggle("thumb-dark",dark)
    });
    toast(dark?"缩略图已换深色底":"缩略图已换浅色底");
  }
  if(act==="pgroup"){ showGroupSheet(id) }
  if(act==="maker"){ showMakerSheet(id) }
  if(act==="scope"){ showScopeSheet(id) }
  if(act==="toicon"||act==="toprog"){
    var want=act==="toicon"?"icon":"progress";
    if(it.type!==want){
      it.type=want;it.typeManual=true;   /* 主动移动就是明确选择，锁定不被自愈改回 */
      if(want==="progress"&&it.scope!=="chapter"&&it.scope!=="deco")it.scope="full";
      save();
      try{if(currentId===id)closeViewer(true)}catch(e){}
      render();
      if($("#pgPage").classList.contains("on"))renderPgPage();
      if($("#iconPage").classList.contains("on"))renderIconPage();
      toast(want==="icon"?"已移到图标库":"已移到进度条库");
    }
  }
  if(act==="move"){ selSet={};selSet[id]=true;showMoveSheet() }
  if(act==="export"){ exportItem(it) }
  if(act==="copylink"){
    var cu=b.getAttribute("data-url");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(cu).then(function(){toast("链接已复制",2200)}).catch(function(){toast("复制失败")});
    }else toast("此环境不支持复制");
  }
  if(act==="del"){ showDelete(id) }
});

/* ---------------------- 自定义封面（进度条库 / 图标库） ---------------------- */
/* 给进度条 / 图标上传一张自己的封面图，列表缩略图优先显示封面（⋯ 菜单里可更换 / 移除）。
   封面压缩到最长边 640px 存 IndexedDB，随备份一起导出导入 */
function pickCover(id){
  var inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];inp.remove();
    if(!f)return;
    if(!/^image\//.test(f.type)){toast("请选择图片文件");return}
    toast("正在处理封面…",1600);
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;
          if(!(W>0&&H>0)){toast("图片读取失败");return}
          var k=Math.min(1,640/Math.max(W,H));
          var cv=document.createElement("canvas");
          cv.width=Math.max(1,Math.round(W*k));cv.height=Math.max(1,Math.round(H*k));
          var cx=cv.getContext("2d");cx.drawImage(img,0,0,cv.width,cv.height);
          var url;
          try{url=cv.toDataURL(f.type==="image/png"||f.type==="image/webp"?f.type:"image/jpeg",0.85)}catch(e){url=null}
          if(!url){toast("图片处理失败");return}
          var it=DB.items.find(function(a){return a.id===id});
          if(!it)return;
          it.cover=url;it.coverAt=Date.now();
          save();_pgRenderSig="";render();
          toast("封面已更新");
        }catch(e){toast("图片处理失败")}
      };
      img.onerror=function(){toast("图片读取失败")};
      img.src=String(fr.result||"");
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}

    '<li><b>日常打开</b>：点卡片进入工具，左上角「返回」回列表。</li></ul>'+
    '<h2>导出备份（建议定期做）</h2>'+

    '<p class="hint" style="margin-top:6px">只想整理网址：点顶栏<b>下载图标</b> →「<b>导出网页链接（.txt）</b>」，会把收藏的所有网页网址按文件夹分类导出成文本文件，每条都带网站名称。</p>'+
    '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg><div><b>怎么判断备份是否正常：</b>如果导出的备份文件只有 <b>450KB</b> 左右（基本就是一个空的收纳盒骨架，里面没有工具内容），说明它是<strong>错误文件</strong>（旧缓存版本导出的）。解决方法：先在浏览器里刷新一次网站，再彻底关闭并重开桌面图标后重新导出；仍不行就删除桌面图标、在浏览器重新「添加到主屏幕」。正常的备份会更大，具体取决于你收藏了多少工具。</div></div>'+
    '<h2>换设备 / 数据丢失后恢复</h2>'+
    '<ol><li>打开收纳盒（在线链接或新文件）；</li>'+
    '<li>点「添加」→<b>选择 HTML 文件</b>，选中之前备份的 <span class="kbd">收纳盒备份.html</span>，里面的工具会被识别恢复；</li>'+

    '<h2>管理小技巧</h2>'+
    '<ul><li>卡片右上角 <b>⋯</b>：重命名、<b>置顶</b>、移动到文件夹、<b>导出文件</b>（单个工具导出 .html / 进度条 .svg）、删除；置顶的条目会排到最前面，主页面、我的工具、进度条库、图标库、星标页都一样；</li>'+
    '<li>顶栏 <b>⚙ 设置图标</b>：使用说明、✉ 通知信箱都收在里面；还可以分别开关「我的工具 / 进度条库 / 图标库」三个入口；</li>'+
    '<li>顶部搜索框可按<b>名称、标签、分组、网址、类型</b>筛选（也能搜到「我的工具」里的分组标签）；搜索时每张卡片会标出<b>保存途径</b>（我的工具 / 文件夹 / 未分类），一眼分清；主页面搜索也会列出<b>盒中盒里</b>匹配的文件，点一下打开盒子并自动筛出它们；点灰色标签可直接编辑标签；编辑工具的「标签」用逗号分隔可写<b>多个，全部显示、不再限制数量</b>；主页面 / 我的工具 / 进度条库 / 星标页各视图都会显示自定义标签，进度条库 / 星标页的搜索框也能按<b>名称 / 标签 / 备注 / 分组</b>筛选；</li>'+
    '<li><b>「全部 / 已打包 / 链接」筛选 + 文件夹归类</b>，工具多也不乱；我的工具 / 进度条库 / 图标库三个入口在文件夹行最前面，不与其他文件混在一起；<b>移动弹层默认只列主文件夹</b>，含子文件夹的主文件夹右侧会带一个「▸」小按钮，点它才展开自己的子文件夹（没有子文件夹的不显示按钮），且按「主文件夹 → 它自己的子文件夹」缩进排好，不会散在列表末尾；<b>整理</b>状态下主文件夹上的「移入」小按钮，可把它直接移到别的主文件夹里变成子文件夹（也可多选勾选主文件夹后点「移动到…」）；移动弹层最上面新增<b>「我的工具」</b>目标，选它可直接加入我的工具，主页面多选栏不再单独放「加入我的」按钮；</li>'+
    '<li>多选后点「导出」：可单独导出多个文件，或打包成一个迷你收纳盒 HTML（再导入时可选拆分或变成盒中盒）；</li>'+
    '<li>卡片若出现橙色<b>“缺内容”</b>标签，表示该工具的正文不在当前文件里，重新导入一次即可；</li>'+
    '<li>各库工具行的<b>漏斗</b>可展开全部分组、把常用分组置顶，点「编辑」还能重命名 / 删除 / 拖动排序，点「＋ 新建分组」可直接建空分组（建好就立刻出现在 ⋯ 菜单「设置分组」里，点一下即可填入，不用重新手输）；<b>视图按钮</b>循环切换排列方式（进度条库 / 星标页可在预览网格 / 单行列表 / 三列 / 流动胶囊之间切换，流动胶囊宽度随文字走）；</li><li><b>整理排序</b>：我的工具 / 进度条库 / 图标库 / 盒中盒工具行都有「整理」按钮，点开后<b>长按卡片直接拖动</b>就能改顺序，顺序会保存下来，再点一次「整理」退出；主页面的整理按钮用法一样；</li>'+
    '<li><b>制作者（进度条库 / 图标库）</b>：导入时可填制作者，或点条目 ⋯ 菜单「设置制作者」、多选后点「设置制作者」<b>批量改</b>（留空即清除）；没填制作者的在筛选里归入「未归类」（为 0 时自动隐藏）。漏斗「分组筛选」弹层点「编辑」可切「<b>编辑分组 / 编辑制作者</b>」：编辑制作者时可 ✎ <b>重命名</b>（该制作者下全部条目同步改名）、长按 ⠿ <b>拖动排序</b>；需给进度条 / 图标单独换缩略图，用 ⋯ 菜单「上传封面」（自动压缩、随备份走，可更换 / 移除）；</li>'+
    '<li><b>批量移动分组</b>：进度条库 / 图标库 / 我的工具 / 星标页点「多选」勾选后，点「<b>移动分组</b>」一次把勾选项归到同一分组（点已有分组可快速填入，留空即移出分组）；盒中盒里的「移动到…」是把文件抽到外面的文件夹，两者不同。主页面多选时进入这些库会自动退出主页面多选；</li>'+
    '<li><b>全文 / 章节进度 / 纯装饰</b>：导入 SVG 进度条会按源码里的「章 / 页码 / 全文 / 装饰」等字样自动识别类型，弹层会显示识别结果；怕识别错可在导入弹层「进度类型」一行手动选（不跟进度走的装饰图选「纯装饰」），导入后也能在 ⋯ 菜单「设置进度类型」随时改；进度条库「分组筛选」弹层的「进度类型」区可按类型筛选，搜索「章节 / 全文 / 装饰」也能按类型搜；点「全部」分组会自动清除制作者筛选；</li>'+
    '<li><b>导入</b>：点「添加」→「粘贴 / 导入 SVG」或选文件（可多选），会按内容自动识别进度条 / 图标并收进对应库；多选时<b>子文件夹也能勾选</b>，移动 / 导出会自动带上文件夹里的全部内容；</li>'+
    '<li>「设置 → 查重」找出重复的网址和内容相同的文件（盒中盒里的也一起查，位置会标出所属盒中盒），核对位置后勾选删除；</li>'+
    '<li>数据保存在浏览器本地：不要清除本站数据、不要删除主屏幕图标。</li></ul>'+
    '<h2>盒中盒与导入导出</h2>'+
    '<ul>'+
    '<li><b>盒中盒</b>：导入备份时选「变成盒中盒」，整包变成一个独立条目；打开后像普通页面一样搜索、分组、多选、导出，里面的文件不影响外面；多选后点<b>「移动到…」</b>可把选中的文件批量抽出到外面的文件夹或<b>我的工具</b>，单个文件的 ⋯ 菜单里「移出到收纳盒」也能选「我的工具」；<b>最后一个文件被移出或删除后，空盒中盒会自动删除</b>；主页面搜索和「设置 → 查重」也能查到盒中盒里的文件；</li>'+
    '<li><b>单独导出 / 打包导出</b>：多选后点「导出」，单独导出是每个项目各存一个文件；打包导出会合成一个迷你收纳盒 HTML，能直接打开，也能再导入回来（可选拆分或变成盒中盒）；</li>'+
    '<li><b>批量导入</b>：「添加」→「粘贴 / 导入 SVG」可一次选多个 svg / txt，自动识别进度条或图标收进对应库；网页链接导出时只记录网址；</li>'+
    '<li><b>进度条 / 图标库</b>：入口在文件夹行前面，各有独立的视图、分组、搜索；打开进度条点顶栏 ☆ 收藏，单独进度条页「复制源码」旁可直接导出 SVG / TXT；点<b>进度条库标题后面</b>的 <span class="solidstar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3.2 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg></span> 进星标页集中查看。</li>'+
    '</ul>'+
    '<h2>iOS 注意事项</h2>'+
    '<ul><li>「文件」App 里的<b>快速预览</b>（顶部有“完成”）只能看不能点，属系统限制——请用主屏幕图标或 Safari 打开；</li>'+
    '<li>内嵌工具运行在沙盒中，可运行脚本、弹窗、下载，但读不到收纳盒本身的数据；</li>'+
    '<li>个别依赖网络的工具，断网时不可用。</li></ul>'+
    '<div class="credit" style="margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-3);text-align:center">制作者：旧林 · 小红书号 946516033</div>'+
    '</div>';
  openSheet("使用说明",body,
    (DB.settings.removedSeed&&DB.settings.removedSeed.length?'<button class="btn-ghost" data-act="restore-builtin">恢复内置示例</button>':"")+
    '<button class="btn-primary" style="width:auto;padding:0 16px" data-act="sheet-cancel">知道了</button>');
}

/* ============ 事件委托（主交互层） ============ */
document.addEventListener("click",function(e){
  var t=e.target;
  /* 主页面搜索结果 · 盒中盒里的匹配项 */
  var bhit=t.closest('[data-act="open-boxhit"]');
  if(bhit){
    e.preventDefault();e.stopPropagation();
    var _bh=DB.items.find(function(x){return x.id===bhit.getAttribute("data-bid")&&x.type==="bundle"});
    if(_bh)openBoxPage(_bh,String(state.q||"").trim());
    else toast("找不到这个盒中盒");
    return;
  }

  /* 星标按钮：只切换收藏，不触发卡片打开 / 多选 */
  var stb=t.closest("[data-star]");
  if(stb){ e.preventDefault();e.stopPropagation();toggleStar(stb.getAttribute("data-star"));return }
  /* 分组筛选弹层：点分组名 / 置顶开关 / 恢复全部 */
  var gfn=t.closest('[data-act="gf-new"]');
  if(gfn){gfNewSheet(gfn.getAttribute("data-gfpage"));return}
  var gfnb=t.closest('[data-act="gf-new-back"]');
  if(gfnb){var _pn=gfnb.getAttribute("data-gfpage");gfEdit[_pn]=false;showGroupFilter(_pn);return}
  var gfng=t.closest('[data-act="gf-new-go"]');
  if(gfng){gfNewGo(gfng.getAttribute("data-gfpage"));return}
  var gfe=t.closest('[data-act="gf-edit"]');
  if(gfe){var _pe=gfe.getAttribute("data-gfpage");gfEdit[_pe]=!gfEdit[_pe];showGroupFilter(_pe);return}
  var gfet=t.closest('[data-act="gf-edittgt"]');
  if(gfet){
    var _pet=gfet.getAttribute("data-gfpage");
    gfEditTarget[_pet]=gfet.getAttribute("data-v")==="mk"?"mk":"grp";
    showGroupFilter(_pet);return;
  }
  var gfmkr=t.closest('[data-act="gf-mk-rename"]');
  if(gfmkr){gfMkRenameSheet(gfmkr.getAttribute("data-gfpage"),gfmkr.getAttribute("data-mkname"));return}
  var gfmkrg=t.closest('[data-act="gf-mk-rename-go"]');
  if(gfmkrg){gfMkRenameGo(gfmkrg.getAttribute("data-gfpage"),gfmkrg.getAttribute("data-mkname"));return}
  var gfr=t.closest('[data-act="gf-rename"]');
  if(gfr){gfRenameSheet(gfr.getAttribute("data-gfpage"),gfr.getAttribute("data-gfname"));return}
  var gfd=t.closest('[data-act="gf-del"]');
  if(gfd){gfDeleteSheet(gfd.getAttribute("data-gfpage"),gfd.getAttribute("data-gfname"));return}
  var gfb=t.closest('[data-act="gf-back"]');
  if(gfb){var _pb=gfb.getAttribute("data-gfpage");gfEdit[_pb]=true;showGroupFilter(_pb);return}
  var gfrg=t.closest('[data-act="gf-rename-go"]');
  if(gfrg){gfRenameGo(gfrg.getAttribute("data-gfpage"),gfrg.getAttribute("data-gfname"));return}
  var gfdg=t.closest('[data-act="gf-del-go"]');
  if(gfdg){gfDeleteGo(gfdg.getAttribute("data-gfpage"),gfdg.getAttribute("data-gfname"));return}
  var gfc=t.closest('[data-act="gf-close"]');
  if(gfc){gfEdit[gfc.getAttribute("data-gfpage")]=false;closeSheet();return}
  var gfpick=t.closest("[data-gfpick]");
  if(gfpick){ gfSetGroup(gfpick.getAttribute("data-gfpage"),gfpick.getAttribute("data-gfpick")); return }
  var gfpin=t.closest("[data-gfpin]");
  if(gfpin){ gfTogglePin(gfpin.getAttribute("data-gfpage"),gfpin.getAttribute("data-gfpin")); return }
  var gfall=t.closest('[data-act="gf-showall"]');
  if(gfall){ gfShowAll(gfall.getAttribute("data-gfpage")); return }
  /* 分组筛选弹层：行式 ⇄ 流动胶囊排列（编辑中点切换会先退出编辑） */
  var gflay=t.closest('[data-act="gf-layout"]');
  if(gflay){
    var _lp=gflay.getAttribute("data-gfpage");
    DB.settings.gfLayout=(DB.settings.gfLayout==="pills")?"rows":"pills";
    gfEdit[_lp]=false;save();showGroupFilter(_lp);
    toast(DB.settings.gfLayout==="pills"?"已切换到胶囊排列":"已切换到列表排列");
    return;
  }
  /* 进度条库 / 图标库 · 制作者筛选：点制作者胶囊即筛选；「未归类」= 没填制作者的 */
  var gfmk=t.closest("[data-gfmk]");
  if(gfmk){
    var _mkv=gfmk.getAttribute("data-gfmk"),_mkp=gfmk.getAttribute("data-gfpage")||"pg";
    if(_mkp==="icon")iconState.maker=_mkv;else pgState.maker=_mkv;
    gfRerender(_mkp);closeSheet();
    toast(_mkv==="__none__"?("已筛选未填写制作者的"+(_mkp==="icon"?"图标":"进度条")):("已筛选制作者："+_mkv));
    return;
  }
  var gfmkc=t.closest('[data-act="gf-mk-clear"]');
  if(gfmkc){
    var _mkcp=gfmkc.getAttribute("data-gfpage")||"pg";
    if(_mkcp==="icon")iconState.maker="";else pgState.maker="";
    gfRerender(_mkcp);closeSheet();toast("已显示全部制作者");return;
  }
  /* 进度条库 · 进度类型筛选：全文进度 / 章节进度 */
  var gfsc=t.closest("[data-gfsc]");
  if(gfsc){
    pgState.scope=gfsc.getAttribute("data-gfsc")||"";
    gfRerender("pg");closeSheet();
    toast(pgState.scope?("已筛选"+pgScopeName(pgState.scope)):"已显示全部进度类型");
    return;
  }
  var gfscc=t.closest('[data-act="gf-sc-clear"]');
  if(gfscc){ pgState.scope=""; gfRerender("pg"); closeSheet(); toast("已显示全部进度类型"); return }
  // 卡片菜单按钮
  var more=t.closest('[data-act="menu"]');
  if(more){
    e.preventDefault();e.stopPropagation();
    var r=more.getBoundingClientRect();
    showMenu(r.right-8,r.bottom+6,more.getAttribute("data-id"),"card");
    return;
  }
  // 盒中盒内部条目的菜单按钮
  var bxm=t.closest('[data-act="boxmenu"]');
  if(bxm){
    e.preventDefault();e.stopPropagation();
    var r3=bxm.getBoundingClientRect();
    showBoxMenu(r3.right-8,r3.bottom+6,+bxm.getAttribute("data-bx"));
    return;
  }
  var bmm=t.closest("[data-boxmove-mine]");
  if(bmm){doBoxMoveOut("",true);return}
  var bmv=t.closest("[data-boxmove-to]");
  if(bmv){doBoxMoveOut(bmv.getAttribute("data-boxmove-to"),false);return}
  // 分组弹窗：点已有分组名直接填入输入框
  var sg=t.closest("[data-setgrp]");
  if(sg){var gi=$("#g-name");if(gi)gi.value=sg.getAttribute("data-setgrp");return}
  var bsg=t.closest("[data-bsetgrp]");
  if(bsg){var bi=$("#bg-name");if(bi)bi.value=bsg.getAttribute("data-bsetgrp");return}
  // 文件夹行里的三个独立入口：我的工具 / 进度条库 / 图标库
  var emb=t.closest("#btnMine");
  if(emb){openMinePage();return}
  var etb=t.closest("#btnTplLib");
  if(etb){openPgPage();return}
  var eib=t.closest("#btnIconLib");
  if(eib){openIconPage();return}
  /* 整理模式下点卡片只用于拖动，不打开内容 / 菜单 */
  if(extOrgPage&&t.closest(extOrgSel(extOrgPage))&&!t.closest(".more"))return;
  var pgc=t.closest("[data-pg]");
  if(pgc&&($("#pgPage").classList.contains("on")||($("#starPage")&&$("#starPage").classList.contains("on")))&&!t.closest(".more")){
    var _pid=pgc.getAttribute("data-pg");
    if(extSelMode==="pg"||extSelMode==="star"){extSelToggleKey(_pid);return}
    var pit=DB.items.find(function(x){return x.id===_pid});
    /* 不关库页：查看器层级更高，返回时直接回到进度条库 / 星标页 */
    if(pit)openItem(pit.id);
    return;
  }
  var icc=t.closest("[data-ic]");
  if(icc&&$("#iconPage").classList.contains("on")&&!t.closest(".more")){
    if(extSelMode==="icon"){extSelToggleKey(icc.getAttribute("data-ic"));return}
    var iit=DB.items.find(function(x){return x.id===icc.getAttribute("data-ic")});
    if(iit){var rr=icc.getBoundingClientRect();showMenu(rr.right-10,rr.bottom+8,iit.id,"card")}
    return;
  }
  var bxc=t.closest("[data-bx]");
  if(bxc&&$("#boxPage").classList.contains("on")&&!t.closest(".more")){
    var bi=+bxc.getAttribute("data-bx");

function deleteItem(id){
  var idx=DB.items.findIndex(function(x){return x.id===id});
  if(idx<0){closeSheet();return}
  var it=DB.items[idx];
  if(it.builtin){
    DB.settings.removedSeed=(DB.settings.removedSeed||[]);
    if(DB.settings.removedSeed.indexOf(it.builtinId||it.id)<0)DB.settings.removedSeed.push(it.builtinId||it.id);
  }
  DB.items.splice(idx,1);
  save();render();closeSheet();toast("已删除");
}
function restoreBuiltin(){
  DB.settings.removedSeed=[];
  save();closeSheet();
  toast("已恢复，刷新页面后出现内置示例",2600);
}

/* ---------------- 独立页整理模式（长按拖动改顺序） ---------------- */
var extOrgPage=null; /* pg / mine / icon / box */
function extOrgSel(page){
  return page==="pg"?"#pgList > [data-pg]":page==="mine"?"#mineList > [data-id]":
    page==="icon"?"#iconList [data-ic]":page==="box"?"#boxList > [data-bx]":"#none";
}
function extOrgAllSel(){return "#pgList > [data-pg],#mineList > [data-id],#iconList [data-ic],#boxList > [data-bx]"}
function extOrgRerender(pg){
  var k=pg||extOrgPage;
  _pgRenderSig="";
  if(k==="pg"||k==="star")renderPgPage();
  else if(k==="mine")renderMinePage();
  else if(k==="icon")renderIconPage();
  else if(k==="box")renderBoxPage();
}
function syncExtOrgBtns(){
  ["pg","mine","icon","box"].forEach(function(k){
    var b=document.getElementById(k+"Org");
    if(b)b.classList.toggle("on",extOrgPage===k);
  });
}
function setExtOrg(page){
  if(extSelMode)exitExtSel();
  if(extOrgPage===page){exitExtOrg();toast("已退出整理");return}
  if(extOrgPage)exitExtOrg();
  extOrgPage=page;
  document.body.classList.add("extorg");
  syncExtOrgBtns();
  extOrgRerender();
  toast("整理模式：长按卡片拖动改顺序，再点「整理」退出");
}
function exitExtOrg(){
  if(!extOrgPage)return;
  var prev=extOrgPage;
  extOrgPage=null;
  document.body.classList.remove("extorg");
  syncExtOrgBtns();
  extOrgRerender(prev);
}
function commitExtOrg(page){
  if(page==="box"){
    if(!curBundle||!Array.isArray(curBundle.items))return;
    var old=curBundle.items.slice();
    var idx=[].slice.call(document.querySelectorAll("#boxList > [data-bx]"))
      .map(function(n){return +n.getAttribute("data-bx")});
    curBundle.items=idx.map(function(i){return old[i]}).filter(Boolean);
    save();renderBoxPage();toast("顺序已保存");return;
  }
  var sel=extOrgSel(page);
  var attr=page==="pg"?"data-pg":page==="mine"?"data-id":"data-ic";
  var ids=[].slice.call(document.querySelectorAll(sel)).map(function(n){return n.getAttribute(attr)});
  var vis=ids.map(function(id){return DB.items.find(function(x){return x.id===id})}).filter(Boolean);
  if(vis.length<2){extOrgRerender();return}
  var ords=vis.map(itemOrd).sort(function(a,b){return a-b});
  vis.forEach(function(it,i){it.ord=ords[i]});
  save();extOrgRerender();toast("顺序已保存");
}

/* 只切换已渲染卡片的选中 class，不整页重渲染（避免瀑布流重排造成闪一下）。
   新进入 / 退出多选时才整页重渲染一次，日常勾选走这里 */
function syncExtSelCellClasses(){
  var scope=extSelMode==="icon"?"#iconList":extSelMode==="mine"?"#mineList":extSelMode==="box"?"#boxList":extSelMode==="star"?"#starList":"#pgList";
  var attr=extSelMode==="icon"?"data-ic":extSelMode==="mine"?"data-id":extSelMode==="box"?"data-bx":"data-pg";
  var box=$(scope);if(!box)return;
  box.querySelectorAll("["+attr+"]").forEach(function(el){
    var k=el.getAttribute(attr);
    el.classList.toggle("esel-on",!!extSelSet[k]);
  });
}
function extSelToggleKey(key){
  if(extSelSet[key])delete extSelSet[key];else extSelSet[key]=1;
  syncExtSelCnt();syncExtSelCellClasses();
}
function extSelVisibleKeys(){
  var a=[];
  function add(k){if(a.indexOf(k)<0)a.push(k)}   /* 卡片与「⋯」按钮带同一个 key，去重后再算全选 */
  if(extSelMode==="pg"){document.querySelectorAll("#pgList [data-pg]").forEach(function(el){add(el.getAttribute("data-pg"))})}
  else if(extSelMode==="icon"){document.querySelectorAll("#iconList [data-ic]").forEach(function(el){add(el.getAttribute("data-ic"))})}
  else if(extSelMode==="box"){document.querySelectorAll("#boxList [data-bx]").forEach(function(el){add(el.getAttribute("data-bx"))})}
  else if(extSelMode==="mine"){document.querySelectorAll("#mineList [data-id]").forEach(function(el){add(el.getAttribute("data-id"))})}
  else if(extSelMode==="star"){document.querySelectorAll("#starList [data-pg]").forEach(function(el){add(el.getAttribute("data-pg"))})}
  return a;
}
function extSelAll(){
  var ks=extSelVisibleKeys();
  var all=ks.length>0&&ks.every(function(k){return extSelSet[k]});
  extSelSet={};
  if(!all)ks.forEach(function(k){extSelSet[k]=1});
  syncExtSelCnt();syncExtSelCellClasses();
}
function extSelItems(){
  return Object.keys(extSelSet).map(function(k){
    if(extSelMode==="box")return (curBundle&&curBundle.items)?curBundle.items[+k]:null;
    return DB.items.find(function(x){return x.id===k});
  }).filter(Boolean);
}
function extSelDeleteConfirm(){
  var n=Object.keys(extSelSet).length;

      :'<p class="hint" style="margin-top:0">删除后无法恢复，确定继续吗？</p>',

    '<button class="btn-primary" style="width:auto;padding:0 16px;background:var(--danger);box-shadow:none" data-act="esel-del-go">删除</button>');
}
function extSelDeleteGo(){
  if(extSelMode==="box"){
    var idxs=Object.keys(extSelSet).map(Number).sort(function(a,b){return b-a});
    idxs.forEach(function(i){if(curBundle&&curBundle.items&&curBundle.items[i]!=null)curBundle.items.splice(i,1)});

var drag=null;
document.addEventListener("pointerdown",function(e){
  if(!state.folderEdit&&!extOrgPage)return;
  if(selMode||extSelMode||drag)return;
  if(e.pointerType==="mouse"&&e.button!==0)return;
  var t=e.target;
  if(t.closest(".ordb,.fx,.more,.ckmark,[data-fold-edit],[data-fold-new]"))return;
  if(extOrgPage){
    var xel=t.closest(extOrgSel(extOrgPage));
    if(!xel)return;
    drag={el:xel,started:false,sx:e.clientX,sy:e.clientY,page:extOrgPage,
      timer:setTimeout(function(){beginDrag(e)},320)};
    return;
  }
  var el=t.closest('.card,.pill,.fchip[data-fold],.subf[data-fold]');
  if(!el)return;
  var fid=el.getAttribute?el.getAttribute("data-fold"):null;
  if(el.classList.contains("fchip")&&(!fid||fid==="__none__"))return;
  drag={el:el,started:false,sx:e.clientX,sy:e.clientY,
    timer:setTimeout(function(){beginDrag(e)},320)};
});
function beginDrag(e){
  if(!drag)return;
  drag.started=true;
  var r=drag.el.getBoundingClientRect();
  drag.ox=e.clientX-r.left;drag.oy=e.clientY-r.top;
  var g=drag.el.cloneNode(true);
  g.classList.add("drag-ghost");
  g.style.width=r.width+"px";
  document.body.appendChild(g);
  drag.ghost=g;
  drag.el.classList.add("dragging");
  try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}
}
document.addEventListener("pointermove",function(e){
  if(!drag||!drag.started)return;
  e.preventDefault();
  drag.ghost.style.left=(e.clientX-drag.ox)+"px";
  drag.ghost.style.top=(e.clientY-drag.oy)+"px";
  var under=document.elementFromPoint(e.clientX,e.clientY);
  var tgt=under&&under.closest?under.closest('.card,.pill,.fchip[data-fold],.subf[data-fold],'+extOrgAllSel()):null;
  if(!tgt||tgt===drag.el)return;
  /* 独立页整理：同一容器内互换位置；网格同行用左右、跨行用上下判定插在前 / 后 */
  if(drag.page){
    if(tgt.parentNode!==drag.el.parentNode)return;
    var xr=tgt.getBoundingClientRect(),er=drag.el.getBoundingClientRect();
    var sameRow=Math.abs((xr.top+xr.height/2)-(er.top+er.height/2))<Math.min(xr.height,er.height)*0.6;
    var xbefore=sameRow?(e.clientX<xr.left+xr.width/2):(e.clientY<xr.top+xr.height/2);
    tgt.parentNode.insertBefore(drag.el,xbefore?tgt:tgt.nextSibling);
    return;
  }
  if((tgt.classList.contains("fchip")||tgt.classList.contains("subf"))!==(drag.el.classList.contains("fchip")||drag.el.classList.contains("subf")))return;
  if(tgt.tagName!==drag.el.tagName&&!(tgt.classList.contains("subf")&&drag.el.classList.contains("subf")))return;
  /* subf 与 fchip 是同级容器内拖动：fchip 限定 folderRow，subf 限定所在 subrow */
  if(drag.el.classList.contains("fchip")&&tgt.parentNode!==drag.el.parentNode)return;
  if(drag.el.classList.contains("subf")&&tgt.closest(".subrow")!==drag.el.closest(".subrow"))return;
  if((drag.el.classList.contains("card")||drag.el.classList.contains("pill"))&&tgt.parentNode!==drag.el.parentNode)return;
  var r=tgt.getBoundingClientRect();
  var before=drag.el.classList.contains("fchip")
    ?(e.clientX<r.left+r.width/2)
    :(e.clientY<r.top+r.height/2);
  tgt.parentNode.insertBefore(drag.el,before?tgt:tgt.nextSibling);
},{passive:false});
function endDrag(){
  if(!drag)return;
  clearTimeout(drag.timer);
  if(drag.started){
    if(drag.ghost)drag.ghost.remove();
    drag.el.classList.remove("dragging");
    commitDrag(drag.el);
  }
  drag=null;
}
/* 整理态下禁止浏览器原生拖拽（img / 链接会抢走 pointermove） */

/* 树形顺序：主文件夹 → 它自己的子文件夹；每个文件夹默认折叠，只有含子文件夹的行右侧才有展开按钮 */
var moveOpen={}, moveCtx=null;
function moveBadSet(fidList){
  var bad={};
  (fidList||[]).forEach(function(fid){bad[fid]=1;descendantFolderIds(fid).forEach(function(d){bad[d]=1})});
  return bad;
}
function moveTreeRows(all){
  var byP={},ids={};
  all.forEach(function(f){ids[f.id]=1});
  all.forEach(function(f){
    var p=f.p&&ids[f.p]?f.p:"";      /* 父被排除或不存在时按主文件夹显示，避免子文件夹消失 */
    (byP[p]=byP[p]||[]).push(f);
  });
  var roots=byP[""]||[],rows=[];
  function walk(list,d){
    list.forEach(function(f){
      var kids=byP[f.id]||[];
      rows.push({f:f,d:d,kids:kids.length,open:!!moveOpen[f.id]});
      if(moveOpen[f.id])walk(kids,d+1);
    });
  }
  walk(roots,0);
  return {rows:rows,subs:all.length-roots.length};
}
function moveTargetsHTML(bad,topLabel,showMine){

    t.rows.map(function(r){
      var tg=r.kids
        ?'<button class="mvrow-toggle'+(r.open?" on":"")+'" data-mv-toggle="'+r.f.id+'" title="'+(r.open?"收起":"展开")+'子文件夹" aria-label="'+(r.open?"收起":"展开")+'子文件夹"><span class="arw">'+(r.open?"▾":"▸")+'</span></button>'

/* ---------------------- 键盘遮挡适配 ---------------------- */
(function(){
  var vv=window.visualViewport;
  if(!vv)return;
  var mask=document.getElementById("mask");
  var raf=0;
  /* body 被 position:fixed 锁定后，iOS Safari 聚焦输入框时不会自动滚动 .sheet-body，
     导致正在输入的 textarea/input 大半被弹层顶边裁掉（点「粘贴 SVG 源码」尤其明显）。
     这里主动把当前聚焦的输入框滚动到内容区可见位置。 */
  function revealFocused(){
    var sb=document.getElementById("sheetBody");
    if(!sb||!mask.classList.contains("kb-open"))return;
    var el=document.activeElement;
    if(!el||!/^(INPUT|TEXTAREA)$/.test(el.tagName)||!sb.contains(el))return;
    var sr=sb.getBoundingClientRect(), er=el.getBoundingClientRect();
    var pad=14;
    var delta=0;
    if(er.top<sr.top+pad)delta=er.top-sr.top-pad;             /* 顶部被裁 → 上滚 */
    else if(er.bottom>sr.bottom-pad)delta=er.bottom-sr.bottom+pad; /* 底部被裁 → 下滚 */
    if(delta)sb.scrollTop+=delta;
  }
  function apply(){
    raf=0;
    if(!mask||!mask.classList.contains("on"))return;
    var overlap=Math.max(0,innerHeight-vv.height-vv.offsetTop);
    if(overlap>60){
      /* 写入键盘上方可视区的真实坐标：offsetTop 是可视区顶边距，height 是可视区高度。
         CSS 直接拿这两个值定位弹层，绝不再叠减 dvh / overlap，避免弹层被压扁或跳动。 */
      mask.classList.add("kb-open");
      mask.style.setProperty("--vv-top",Math.round(vv.offsetTop)+"px");
      mask.style.setProperty("--vv-h",Math.round(vv.height)+"px");
      /* 布局写入后下一帧再滚动聚焦框，确保拿到的是键盘弹起后的位置 */
      requestAnimationFrame(function(){ setTimeout(revealFocused,0) });
    }else{
      mask.classList.remove("kb-open");
      mask.style.removeProperty("--vv-top");
      mask.style.removeProperty("--vv-h");
    }
  }
  function onResize(){ if(!raf)raf=requestAnimationFrame(apply) }  /* 键盘动画期间合并多次事件，消除抖动 */
  vv.addEventListener("resize",onResize);
  vv.addEventListener("scroll",onResize);
  /* focus 可能晚于键盘 resize，补一次：聚焦输入元素时若键盘已开则滚动到可见 */
  document.addEventListener("focusin",function(e){
    if(!mask||!mask.classList.contains("kb-open"))return;
    var el=e.target;
    if(!el||!/^(INPUT|TEXTAREA)$/.test(el.tagName))return;
    setTimeout(revealFocused,60);
  },true);
})();

function progressThumbUri(svg){
  try{
    var s=String(svg||"");
    /* 阅读器进度条模板：占位符先填示例值，否则 data URI 里留着 {w}/{h}/{=} 解析失败，缩略图整张空白 */
    if(svgHasTpl(s))s=svgFillTpl(s);
    s=s.replace(/<script[\s\S]*?<\/script>/gi,"")
      .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,"");
    /* 去掉 SMIL 动画节点：部分 WebView 里 data URI 的 SVG 也会跑 <animate>，多图案进度条缩略图会逐格闪入。
       删掉后 <use> 继承父级 fill-opacity（完成态），缩略图直接显示静态成品。 */
    s=s.replace(/<(animate|animateTransform|animateMotion|set|mpath)\b[^>]*>[\s\S]*?<\/\1\s*>/gi,"")
       .replace(/<(animate|animateTransform|animateMotion|set|mpath)\b[^>]*\/>/gi,"");
    var m=s.match(/<svg[\s\S]*<\/svg>/i);if(m)s=m[0];
    /* 去掉 XML 声明 / DOCTYPE，避免 data URI 解析失败 */
    s=s.replace(/<\?[\s\S]*?\?>/g,"").replace(/<!DOCTYPE[^>]*>/gi,"").trim();
    var head=s.match(/<svg\b[^>]*/i);
    if(head){
      var tag=head[0];
      /* 补 xmlns：img 加载时缺 xmlns 会整张不渲染 */
      if(!/\sxmlns\s*=/.test(tag))s=s.replace(/<svg\b/i,'<svg xmlns="http://www.w3.org/2000/svg"');
      /* 宽高为百分比 → 去掉，交给 CSS 控制；都没有则用 viewBox 尺寸补上，避免 img 内在尺寸为 0 而不显示 */
      ["width","height"].forEach(function(a){
        var re=new RegExp("\\s"+a+"\\s*=\\s*(\"[^\"]*\"|'[^']*')","i");
        var mm=s.match(re);
        if(mm&&/\d\s*%/.test(mm[1]))s=s.replace(re,""); /* 百分比尺寸去掉，改用下面补的固定值 */
      });
      if(!/(\swidth\s*=)/i.test(s)||!/(\sheight\s*=)/i.test(s)){
        var vb=(s.match(/viewBox\s*=\s*["']([^"']+)["']/i)||[])[1];
        var v=vb?vb.trim().split(/[\s,]+/).map(Number):null;
        var w=(v&&v.length===4&&v.every(Number.isFinite)&&v[2]>0)?v[2]:48;
        var h=(v&&v.length===4&&v.every(Number.isFinite)&&v[3]>0)?v[3]:48;
        s=s.replace(/<svg\b/i,'<svg width="'+w+'" height="'+h+'"');
      }
    }
    return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
  }catch(e){return ""}
}

  if(e.target.closest("#starView")){

    renderMinePage();
    toast(minePageState.view==="card"?"卡片视图":minePageState.view==="grid"?"三列视图":minePageState.view==="list"?"单行列表视图":"流动胶囊视图");
  }
  var bv=e.target.closest("#boxView");
  if(bv){
    var _bo=["grid","list","flow"],_bi=_bo.indexOf(boxState.view);if(_bi<0)_bi=0;
    boxState.view=_bo[(_bi+1)%3];
    renderBoxPage();
    toast(boxState.view==="grid"?"网格视图":boxState.view==="list"?"单行列表视图":"流动胶囊视图");
  }
});

["dragenter","dragover"].forEach(function(ev){

  });

/* ============ 启动 ============ */
load();
render();
hydrate().then(function(){
  /* 自愈：旧版本把含 {w}/{h}/{=} 占位符的阅读器进度条模板误识别成图标收进了图标库。
     带模板占位符的自动识别成图标时，启动时转回进度条库（只动这一类，静态图形不碰）。
     注意：若用户在导入弹层手动选了「单个图标」（typeManual 标记），说明就是要当图标收着，
     尊重其选择、绝不转走；放在 hydrate 之后：大内容 svg 存在 IndexedDB，要先等它填回才能检查 */
  var n=0;
  DB.items.forEach(function(it){
    if(it.type==="icon"&&!it.typeManual&&it.svg&&svgHasTpl(it.svg)){it.type="progress";n++}
    /* 自愈：旧版识别逻辑没读 data-progress 值、又被注释里的「装饰」等字样干扰，
       把章节进度条误存成了全文进度或纯装饰。启动时按源码重新判断，
       只要源码确为章节进度就纠正回来；只动用户没手动设过进度类型的条目，尊重手动选择 */
    if(it.type==="progress"&&!it.scopeManual&&it.scope!=="chapter"&&it.svg&&svgGuessScope(it.svg)==="chapter"){
      it.scope="chapter";n++;
    }
  });
  if(n){try{save();render()}catch(e){}}
});

/* 版本过期检测：桌面 PWA 可能被旧 Service Worker 卡在老版本（老版导出备份没有工具内容）。
   拉一次最新页面比对构建标记，不一致就提示刷新 / 重建图标 */
if(!inFile&&location.protocol.indexOf("http")===0){
  fetch(location.href,{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
    var m=t.match(/hb:build-([0-9A-Za-z]+)/);
    if(m&&m[1]!==BUILD_ID){
      // 每 24 小时最多提醒一次，避免每次打开都弹
      var last=0;
      try{last=Number(localStorage.getItem("hb.updateToast")||0)}catch(e){}
      if(Date.now()-last>86400000){
        try{localStorage.setItem("hb.updateToast",String(Date.now()))}catch(e){}
        toast("网站已更新，请刷新页面；桌面图标需关闭重开，若仍异常请删除后重新添加",6000);
      }
    }
  }).catch(function(){});
}

    if(list&&list.childElementCount===0&&DB.items.length&&!document.querySelector(".empty")){
      location.reload();
    }
  }catch(e){}
},3000);

 {id:"3.2",title:"3.2版本更新通知",date:"11月16日",body:

 },
 {id:"3.1",title:"3.1版本更新通知",date:"11月15日",body:
  '<div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 7.5h18a1 1 0 0 1 1 1V19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.5a1 1 0 0 1 1-1Z"/><path d="M8 13h8M8 17h5"/></svg><div><b>盒中盒导入可保留文件夹：</b>导入备份选「导入为盒中盒」时，如果备份里带文件夹，会多出一个可勾选的选项。勾上后，原来属于各文件夹的工具在盒中盒里会自动按<b>文件夹名分好组</b>（没有文件夹的归入「默认」分组），打开盒中盒点顶部的分组标签就能筛选；不勾则和以前一样。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg><div><b>修复：备份导入后子文件夹错位。</b>之前导出的备份重新导入，子文件夹会跑到最外面变成主文件夹。现在会按备份里的父子层级<b>原样还原</b>；已经被压平的旧数据，重新导入一次备份也会<b>自动补回层级</b>，不用手动重建。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg><div><b>设置新增「全部清空」：</b>重新导入备份前，点「设置 → 全部清空」可一键清空全部工具、文件夹（含子文件夹）、分组与置顶，带<b>二次确认</b>。建议先导出一份备份再清空。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 7.5h18a1 1 0 0 1 1 1V19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.5a1 1 0 0 1 1-1Z"/><path d="M8 13h8M8 17h5"/></svg><div><b>设置新增「切换到文件夹导航模式」：</b>开启后主页面变成文件夹导航，只列出「未分类」和各主文件夹；子文件夹<b>默认不展开</b>，点行尾「▸」逐级展开，点文件夹名直接进去看内容。导航行不再显示数字徽标；「未分类」里没有工具时这一行会自动隐藏（普通列表页也一样）。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg><div><b>盒中盒内进度条 / 图标单独分组：</b>把备份按「导入为盒中盒」导入时，里面原有的进度条和图标会自动单独归到「进度条」「图标」两个分组。分组顺序统一为<b>全部 → 各文件夹分组 → 进度条 → 图标 → 未分组</b>，顶部标签栏和漏斗筛选弹层里的顺序完全一致。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 11h16M4 16h10M4 20h7"/></svg><div><b>卡片视图备注完整显示：</b>主页面卡片视图里的备注不再只显示一行、也不会被截断，会<b>完整换行并铺满卡片宽度</b>；顺带去掉了备注右侧多余的留白，长备注看起来更整齐。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83"/></svg><div><b>设置面板小调整：</b>「使用说明」和「通知信箱」改成两个<b>并排同一行</b>的窄胶囊按钮，信箱统一叫「通知信箱」；使用说明、全部清空提示里的称呼也已保持一致。</div></div>'},
 {id:"ver3-rename",mailOnly:true,title:"构建号名字修改通知",date:"11月15日",body:
  '<div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><div>从 <b>b1115a</b> 版本开始，版本号改为 <b>3.0</b>。</div></div>'},
 {id:"b1115a",title:"b1115a版本更新通知（含b1114a更新内容）",date:"11月15日",body:
  '<div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 2 2 3.5-4"/><rect x="11" y="4" width="10" height="2.4" rx="1.2" fill="currentColor" stroke="none"/><path d="m3 13 2 2 3.5-4"/><rect x="11" y="11" width="10" height="2.4" rx="1.2" fill="currentColor" stroke="none"/><path d="m3 20 2 2 3.5-4"/><rect x="11" y="18" width="10" height="2.4" rx="1.2" fill="currentColor" stroke="none"/></svg><div><b>子文件夹支持多选：</b>主页面点「多选」后，文件夹也能勾选——可整包<b>移动</b>到别的文件夹、<b>导出</b>（按多选文件的方式，自动带上文件夹里全部内容）、加入我的工具或删除。<b>移动弹层</b>现在默认只显示主文件夹，含子文件夹的主文件夹右侧会带一个「▸」小按钮，点它才按父子顺序缩进展开自己的子文件夹（没有子文件夹的不显示按钮）；<b>整理</b>状态下主文件夹上的「移入」按钮，可把它直接移进别的主文件夹变成子文件夹。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="m8.5 12 2 2 5-5"/></svg><div><b>设置新增「查重」：</b>一键找出重复的网址和内容完全相同的文件（盒中盒里的也一起查），显示每个重复项所在的位置（文件夹 / 分组 / 收藏库 / 盒中盒），勾选后一键删除，收藏前可以先清理一遍。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><div><b>导入与导出：</b>点「添加」→「粘贴 / 导入 SVG」或各库的「导入」，会按内容<b>自动识别</b>是进度条还是图标，收进对应的库，认错了在弹层里手动改；<b>可一次选多个 svg / txt 文件</b>批量导入；<b>「我的工具」页的「导入」</b>和主页面「添加」一样，支持 HTML 工具文件（可多选）、粘贴 HTML 源码、收藏网页链接，导入后自动加入「我的工具」，<b>不提供 SVG / TXT 导入</b>。顶栏下载图标导出整个收纳盒备份；各库和主页面多选后点「导出」，可选<b>单独导出</b>（每个项目一个文件）或<b>打包导出</b>（合成一个迷你收纳盒 HTML，能直接打开、也能再导入回来）。网页链接会一起打包，只记录网址。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg><div><b>盒中盒：</b>导入备份时选「变成盒中盒」，整包会变成一个独立条目，打开后里面的文件单独搜索、分组、多选、导出，不影响外面的收纳盒。盒中盒、我的工具、进度条库、图标库的操作区已统一：漏斗筛选 / 整理 / 导出 / 视图 / 分组标签 / 搜索栏都在同一行，<b>多选</b>按钮改到顶栏右侧、<b>整理</b>按钮下移到工具行（两个位置对调）。<b>盒中盒多选现在可以「移动到…」</b>，把选中的文件批量抽出到外面的文件夹或<b>我的工具</b>；单个文件的 ⋯ 菜单「移出到收纳盒」也能选「我的工具」；主页面 / 盒中盒的移动弹层最上面都新增了<b>「我的工具」</b>目标。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="4.6" height="4.6" rx="1.2"/><rect x="9.7" y="3.5" width="4.6" height="4.6" rx="1.2"/><rect x="15.9" y="3.5" width="4.6" height="4.6" rx="1.2"/><rect x="3.5" y="9.7" width="4.6" height="4.6" rx="1.2"/><rect x="9.7" y="9.7" width="4.6" height="4.6" rx="1.2"/><rect x="15.9" y="9.7" width="4.6" height="4.6" rx="1.2"/><rect x="3.5" y="15.9" width="4.6" height="4.6" rx="1.2"/><rect x="9.7" y="15.9" width="4.6" height="4.6" rx="1.2"/><rect x="15.9" y="15.9" width="4.6" height="4.6" rx="1.2"/></svg><div><b>排列与分组：</b>点视图按钮循环切换——主页面与我的工具有卡片 / 三列 / 单行列表（右侧标「已打包 / 网页」）/ <b>流动胶囊</b>（宽度随文字走）；进度条库是预览网格 / 单行列表 / 三列 / 流动胶囊。分组多时点<b>漏斗</b>查看全部、把常用分组<b>置顶</b>；点弹层里的「编辑」还能<b>重命名、删除分组、拖动 ⠿ 调整顺序</b>。四个独立页工具行新增「整理」按钮，点开后长按拖动即可调整文件顺序；主页面搜索现在也能按标签 / 分组查找，还能搜到盒中盒里的文件，结果会标出保存途径。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.2 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg><div><b>星标收藏：</b>打开一个进度条，点顶栏 ☆ 收藏，再点一次取消；已收藏的卡片角上会显示一个小星星，没收藏的不显示。进度条库标题后面的 <span class="solidstar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3.2 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg></span> 进入「星标收藏」页，支持搜索、多选、导出。星星与按钮都跟随主题色。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83"/></svg><div><b>其它：</b>「我的工具」也能多选编辑，主页面多选在「移动到…」里选「我的工具」即可批量加入；<b>盒中盒清空后自动删除空盒子</b>；「设置」里可隐藏卡片标签、开关三个入口；点「设置」→「使用说明」可随时查看提示。</div></div>'},
 {id:"b1101a",title:"b1101a 版本更新通知",date:"11月1日",body:
  '<div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><div><b>网站修复更新。</b>之前通过「文件」方式导出的存档备份，需要重新导出一次（点顶栏下载图标 →「导出 / 备份」），否则旧备份里没有工具内容，无法用于恢复。你当前的工具和数据不受影响。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg><div><b>检查你的备份：</b>如果导出的备份文件只有 <b>154KB</b> 左右，说明它是<strong>错误文件</strong>（旧缓存版本导出的，里面没有工具内容）。解决方法：先在浏览器里刷新一次网站，再彻底关闭并重开桌面图标后重新导出；仍不行就删除桌面图标、在浏览器重新「添加到主屏幕」。正常的备份应该有几 MB。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 5h5v5M19 5l-8 8M19 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4"/></svg><div><b>网页链接新打开方式：</b>网页现在会在收纳盒里直接打开（带返回按钮）。如果网页显示空白（该网站禁止内嵌），点顶栏 <b>↗</b> 换新窗口打开，并会提示「已记住：这个网站以后直接在新窗口打开」——之后这个网站都会自动直接跳转，不再白屏。</div></div>'+
  '<div class="note" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><div><b>新增整理模式：</b>点文件夹行最前面的 <b>✏️ 小铅笔</b>进入整理。整理状态下：<b>点文件夹名字</b>可以直接重命名；<b>长按拖动</b>可以调整文件夹顺序，也可以拖动下方的工具卡片调整位置；点文件夹上的 <b>×</b> 删除文件夹（里面的工具不会被删）。平时不进整理模式，怎么点都不会误删。</div></div>'}
];
var NOTICE_KEY="hb.notice.v8";
function mailUnread(){
  try{ return localStorage.getItem(NOTICE_KEY)!=="read" }catch(e){ return true }
}
function syncMailDot(){}
/* ============ 设置面板：信箱 / 说明 / 入口开关 ============ */
/* ============ 查重：重复网址 / 内容完全相同的文件（含盒中盒里的） ============ */
function dedupKey(it){
  if(it.type==="ref")return "u:"+String(it.path||"").trim().replace(/\/+$/,"").toLowerCase();
  if(it.type==="embed")return "h:"+String(it.html||"");
  if(it.type==="progress"||it.type==="icon")return "s:"+String(it.svg||"").replace(/\s+/g,"");
  return null;
}
/* 展开所有可比对条目：顶层 + 每个盒中盒里的（含嵌套），owner 为所属顶层盒中盒 */
function dedupEntries(){
  var out=[];
  DB.items.forEach(function(top){
    if(!top)return;
    if(top.type==="bundle"&&Array.isArray(top.items)){
      (function walk(list,depth){
        if(!Array.isArray(list)||depth>4)return;
        list.forEach(function(x){
          if(!x)return;
          if(x.type==="bundle"&&Array.isArray(x.items)){walk(x.items,depth+1);return}
          out.push({it:x,owner:top});
        });
      })(top.items,0);
    }else out.push({it:top,owner:null});
  });
  return out;
}
function removeFromBundle(b,id){
  if(!b||!Array.isArray(b.items))return false;
  var i=b.items.findIndex(function(x){return x&&x.id===id});
  if(i>=0){b.items.splice(i,1);return true}
  for(var j=0;j<b.items.length;j++){
    var x=b.items[j];
    if(x&&x.type==="bundle"&&removeFromBundle(x,id))return true;
  }
  return false;
}
function recalcBundleSize(b){
  if(!b||!Array.isArray(b.items))return;
  b.items.forEach(function(x){if(x&&x.type==="bundle")recalcBundleSize(x)});
  b.size=b.items.reduce(function(a,x){return a+((x&&x.size)||0)},0);
}
function itemLoc(it,owner){
  if(owner){
    var ob=["盒中盒 · "+(owner.name||"未命名")];
    var og=String(it.pgroup||"").trim();if(og)ob.push("分组："+og);
    return ob.join(" · ");
  }
  var bits=[];
  if(it.type==="progress")bits.push("进度条库");
  else if(it.type==="icon")bits.push("图标库");
  else if(it.type==="ref")bits.push("链接");
  if(it.mine)bits.push("我的工具");
  if(it.folder){try{var pp=folderPath(it.folder).map(function(f){return f.name});if(pp.length)bits.push(pp.join(" › "))}catch(e){}}
  var g=String(it.pgroup||"").trim();if(g)bits.push("分组："+g);
  return bits.length?bits.join(" · "):"未分类";
}
function showDedup(){
  var groups={},order=[];
  dedupEntries().forEach(function(e){
    var k=dedupKey(e.it);if(!k)return;
    if(!groups[k]){groups[k]=[];order.push(k)}
    groups[k].push(e);
  });
  var dups=order.filter(function(k){return groups[k].length>1});
  var body;
  if(!dups.length){
    body='<p class="hint" style="margin-top:0">没有发现重复的网址，也没有内容完全相同的文件（盒中盒里的文件也一起查了）。</p>';
  }else{
    body='<p class="hint" style="margin-top:0">发现 <b>'+dups.length+'</b> 组重复（网址相同或内容完全相同才算，含盒中盒里的文件）。每组默认勾选第一个之外的重复项，也可以自己调整要删哪些，勾选项的位置列在右侧。</p>'+
      '<div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">';
    dups.forEach(function(k){
      var g=groups[k];
      var isUrl=k.slice(0,2)==="u:";
      body+='<div class="dupgrp"><div class="duphead">'+(isUrl?"🔗 相同网址":"📄 相同内容")+
        '<span class="dupsnippet">'+(isUrl?esc(String(g[0].it.path||"").trim()):esc(g[0].it.name||"")+" 等 "+g.length+" 个文件内容一致")+'</span></div>';
      g.forEach(function(e,i){
        body+='<label class="duprow"><input type="checkbox" class="dupck" data-did="'+esc(e.it.id)+'" data-dbox="'+(e.owner?esc(e.owner.id):"")+'"'+(i?' checked':"")+'>'+
          '<span class="dupnm">'+esc(e.it.name||"未命名")+'</span>'+
          '<span class="duploc">'+esc(itemLoc(e.it,e.owner))+'</span></label>';
      });
      body+='</div>';
    });
    body+='</div>';
  }
  openSheet("查重"+(dups.length?(" · "+dups.length+" 组"):""),body,
    dups.length
      ?'<button class="btn-ghost" data-act="sheet-cancel">不删了</button>'+

function doDedupDel(){
  var cks=[].slice.call(document.querySelectorAll(".dupck:checked"));
  if(!cks.length){toast("没有勾选要删除的项");return}
  var topIds=[],boxIds=[];
  cks.forEach(function(c){
    var bid=c.getAttribute("data-dbox");
    if(bid)boxIds.push({bid:bid,id:c.getAttribute("data-did")});
    else topIds.push(c.getAttribute("data-did"));
  });
  var n=0;
  DB.items=DB.items.filter(function(x){if(topIds.indexOf(x.id)>=0){n++;return false}return true});
  boxIds.forEach(function(o){
    var b=DB.items.find(function(x){return x.id===o.bid&&x.type==="bundle"});
    if(b&&removeFromBundle(b,o.id)){recalcBundleSize(b);n++}
  });
  boxSyncSize();save();render();
  toast("已删除 "+n+" 个重复项");
  showDedup();
}

/* ============ PWA：manifest / 图标 / SW 全部内联 ============ */
(function setupPWA(){
  // 图标：内联 SVG data URI（iOS 需要 png，SVG 会退化为截图，这里用 canvas 生成 png）
  function drawIcon(size,inset){
    var c=document.createElement("canvas");c.width=c.height=size;
    var x=c.getContext("2d");
    var g=x.createLinearGradient(0,0,size,size);
    g.addColorStop(0,"#3b6cff");g.addColorStop(1,"#8a5bff");
    x.fillStyle=g;
    var r=size*0.22,pad=size*inset*0.5||0;
    // 圆角矩形
    x.beginPath();
    if(x.roundRect){ x.roundRect(pad,pad,size-pad*2,size-pad*2,r) } else { x.rect(pad,pad,size,size) }
    x.fill();
    // 三层盒子线条
    x.strokeStyle="rgba(255,255,255,.95)";x.lineWidth=size*0.045;
    x.lineJoin="round";x.lineCap="round";
    var cx=size/2, w=size*0.26, h=size*0.13, y0=size*0.36;
    for(var i=0;i<3;i++){
      var cy=y0+i*h*1.55;
      x.beginPath();
      x.moveTo(cx-w,cy-h*0.18);
      x.lineTo(cx,cy-h*0.95);
      x.lineTo(cx+w,cy-h*0.18);
      x.lineTo(cx,cy+h*0.6);
      x.closePath();
      x.globalAlpha=i===0?1:(i===1?0.6:0.35);
      x.stroke();
    }
    x.globalAlpha=1;
    return c;
  }
  var icon192=drawIcon(192,0.16).toDataURL("image/png");
  var icon512=drawIcon(512,0.16).toDataURL("image/png");
  var iconApple=drawIcon(180,0.02).toDataURL("image/png");
  var iconMask=drawIcon(512,0.24).toDataURL("image/png");
  $("#app-icon").setAttribute("href",iconApple);

  // manifest：blob URL（file:// 下 Safari 不认 blob manifest，所以只在 http 下挂）
  try{
    var mf={
      name:"收纳盒 · HTML 工作台",short_name:"收纳盒",
      start_url:location.pathname+location.search,
      display:"standalone",background_color:"#eceffb",theme_color:"#5a5fd8",
      orientation:"any",lang:"zh-CN",
      icons:[
        {src:icon192,sizes:"192x192",type:"image/png",purpose:"any"},
        {src:icon512,sizes:"512x512",type:"image/png",purpose:"any"},
        {src:iconMask,sizes:"512x512",type:"image/png",purpose:"maskable"}
      ]
    };
    var blob=new Blob([JSON.stringify(mf)],{type:"application/manifest+json"});
    if(location.protocol!=="file:"){
      $("#app-manifest").setAttribute("href",URL.createObjectURL(blob));
    }else{
      $("#app-manifest").setAttribute("href","data:application/manifest+json;charset=utf-8,"+encodeURIComponent(JSON.stringify(mf)));
    }
  }catch(e){}

  // service worker：网络优先（避免更新后一直读旧缓存白屏），断网才用缓存（仅 http/https）
  if("serviceWorker" in navigator&&location.protocol!=="file:"){
    var swCode=[
      "const C='htmlbox-v2';",
      "self.addEventListener('install',e=>{self.skipWaiting()});",
      "self.addEventListener('activate',e=>{",
      "  e.waitUntil((async()=>{",
      "    const keys=await caches.keys();",
      "    await Promise.all(keys.filter(k=>k!==C).map(k=>caches.delete(k)));",
      "    await self.clients.claim();",
      "  })())});",
      "self.addEventListener('fetch',e=>{",
      "  const req=e.request;if(req.method!=='GET')return;",
      "  if(req.mode==='navigate'){",
      "    e.respondWith((async()=>{",
      "      try{const res=await fetch(req);",
      "        const c=await caches.open(C);c.put(location.pathname,res.clone());return res}",
      "      catch(err){const c=await caches.open(C);",
      "        const f=await c.match(location.pathname);",
      "        if(f)return f;throw err}})());return}",
      "  e.respondWith((async()=>{",
      "    try{const res=await fetch(req);",
      "      if(res&&res.ok&&new URL(req.url).origin===location.origin){const c=await caches.open(C);c.put(req,res.clone())}",
      "      return res}",
      "    catch(err){const c=await caches.open(C);",
      "      const hit=await c.match(req,{ignoreSearch:true});",
      "      if(hit)return hit;throw err}})());",
      "});"
    ].join("\n");
    var swUrl=URL.createObjectURL(new Blob([swCode],{type:"text/javascript"}));
    navigator.serviceWorker.register(swUrl,{scope:"./"}).catch(function(){ /* 忽略 */ });
  }
})();
